<script>
// === Firebase接続設定 ===
const firebaseConfig = {
  apiKey: "AIzaSyCFr2e2VVWPV8JIf9cIRUh94fLxGFpNR1w",
  authDomain: "ethics-card-game-4598a.firebaseapp.com",

  projectId: "ethics-card-game-4598a",
  storageBucket: "ethics-card-game-4598a.firebasestorage.app",
  messagingSenderId: "1094270378260",
  appId: "1:1094270378260:web:aef75b9c4108f2bd472201",
  measurementId: "G-R8SYD17150"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let CARD_DATABASE = [];

// ==========================================
// 思想家カードゲーム バトル基礎関数群
// ==========================================

// ------------------------------------------
// 1. 初期化・フラグ管理（ステップ3）
// ------------------------------------------
function initializeCardState(card) {
  card.currentHP = card.maxHP || card.hp; // スプレッドシートのHPを最大HPとする
  card.isDead = false;
  
  // 防御・回避系
  card.isInvincible = false;
  card.evadeRate = 0;
  card.damageReduction = 0;
  card.nullifyRank = null;

  // 復活・身代わり・回復系
  card.hasGuts = false;
  card.hasRevive = false;
  card.coverTarget = null;
  card.regenAmount = 0;

  // 状態異常系（ステップ4）
  card.stunTurns = 0;
  card.silenceTurns = 0;

  // バフ・デバフ系
  card.attackBuff = 0;
  card.defenseBuff = 0;
}

// ------------------------------------------
// 2. ダメージ・回復・バフ処理（ステップ1・3・4統合）
// ------------------------------------------
function applyDamage(attacker, defender, baseDamage) {
  // ① 身代わり判定
  let actualTarget = defender;
  if (defender.coverTarget && !defender.coverTarget.isDead) {
    actualTarget = defender.coverTarget;
    console.log(`${actualTarget.name}がダメージを肩代わり！`);
  }

  // ② 特定ランク無効判定
  if (actualTarget.nullifyRank && attacker.rank !== actualTarget.nullifyRank) return 0;

  // ③ 無敵・回避判定
  if (actualTarget.isInvincible) return 0;
  if (actualTarget.evadeRate > 0 && Math.random() < actualTarget.evadeRate) {
    console.log(`${actualTarget.name}は攻撃を回避した！`);
    return 0;
  }

  // ④ ダメージ計算（基本ダメージ＋バフ補正－軽減率）
  let rawDamage = Math.max(0, baseDamage + (attacker.attackBuff || 0) - (actualTarget.defenseBuff || 0));
  let finalDamage = Math.floor(rawDamage * (1 - actualTarget.damageReduction));
  
  actualTarget.currentHP -= finalDamage;

  // ⑤ 食いしばり・退場判定
  if (actualTarget.currentHP <= 0) {
    if (actualTarget.hasGuts) {
      actualTarget.currentHP = 1;
      actualTarget.hasGuts = false;
    } else {
      actualTarget.currentHP = 0;
      actualTarget.isDead = true;
    }
  }
  return finalDamage;
}

function dealTrueDamage(target, amount) { // 貫通ダメージ
  target.currentHP -= amount;
  if (target.currentHP <= 0) target.isDead = true;
}

function executeInstantKill(target) { // 即死処理
  target.currentHP = 0;
  target.hasGuts = false;
  target.isDead = true;
}

function applyHeal(target, amount, allowOverflow = false) { // 回復処理
  if (target.currentHP <= 0 && !target.isDead) return 0;
  target.currentHP += amount;
  if (!allowOverflow && target.currentHP > target.maxHP) {
    target.currentHP = target.maxHP;
  }
}

function applyBuff(target, statType, amount) { // バフ処理
  if (statType === 'attack') target.attackBuff += amount;
  else if (statType === 'defense') target.defenseBuff += amount;
}

function clearAllBuffs(target) { // バフ・状態異常リセット
  target.attackBuff = 0;
  target.defenseBuff = 0;
  target.isInvincible = false;
  target.evadeRate = 0;
  target.stunTurns = 0;
}

// ------------------------------------------
// 3. 属性（タグ）判定処理（ステップ2）
// ------------------------------------------
function hasTag(card, tagName) {
  return card.synergyTags && card.synergyTags.includes(tagName);
}

function countTagInParty(party, tagName) {
  return party.filter(card => !card.isDead && hasTag(card, tagName)).length;
}

function applyEffectToTag(party, tagName, effectType, amount) {
  party.forEach(card => {
    if (!card.isDead && hasTag(card, tagName)) {
      if (effectType === 'hp') applyHeal(card, amount);
      else if (effectType === 'attack') applyBuff(card, 'attack', amount);
    }
  });
}

// ------------------------------------------
// 4. システム判定・ダイス（ステップ4）
// ------------------------------------------
function canAct(card) {
  if (card.stunTurns > 0) {
    card.stunTurns--;
    return false;
  }
  return true;
}

function rollDice(sides = 6) {
  return Math.floor(Math.random() * sides) + 1;
}

// ==========================================
// 基礎関数群 ここまで
// ==========================================

// ==========================================
// 5. スキルのルーティング（振り分け）関数
// ==========================================
function executeSkill(attacker, targetParty, skillData) {
  if (!canAct(attacker)) {
    console.log(`${attacker.name}は動けない！`);
    return;
  }

  // ※仮置き：ターゲットは相手パーティーの先頭
  let target = targetParty[0];

  switch (skillData.type) {
    case 'damage':
      console.log(`${attacker.name}の攻撃！`);
      applyDamage(attacker, target, skillData.value);
      break;
    case 'heal':
      console.log(`${attacker.name}の回復！`);
      applyHeal(attacker, skillData.value);
      break;
    case 'buff':
      console.log(`${attacker.name}の強化！`);
      applyBuff(attacker, 'attack', skillData.value);
      break;
    case 'debuff':
      console.log(`${attacker.name}の妨害！`);
      applyBuff(target, 'attack', -skillData.value);
      break;
    case 'special':
      console.log(`${attacker.name}の特殊スキル発動！`);
      executeSpecialSkill(attacker, targetParty, skillData);
      break;
    default:
      console.log("効果がない、またはパッシブスキルです");
      break;
  }
}

// ------------------------------------------
// 特殊スキル（special）専用の分岐処理
// ------------------------------------------
function executeSpecialSkill(attacker, targetParty, skillData) {
  let target = targetParty[0];

  if (attacker.name === "近松門左衛門") {
    executeInstantKill(target);
    executeInstantKill(attacker);
  } else if (attacker.name === "マズロー") {
    let dice = rollDice(6);
    console.log(`ダイスの目は${dice}！`);
  }
}

// ==========================================
// 6. UIテスト用連携コード
// ==========================================
let testAttacker, testDefender;

// 画面のHP表示を更新する関数
function updateBattleUI() {
  if (!testAttacker || !testDefender) return;
  const atkNameEl = document.getElementById('attacker-name');
  if (atkNameEl) atkNameEl.innerText = testAttacker.name;

  const atkHpEl = document.getElementById('attacker-hp');
  if (atkHpEl) atkHpEl.innerText = testAttacker.currentHP;

  const defNameEl = document.getElementById('defender-name');
  if (defNameEl) defNameEl.innerText = testDefender.name;

  const defHpEl = document.getElementById('defender-hp');
  if (defHpEl) defHpEl.innerText = Math.max(0, testDefender.currentHP);
} 
fetch('cards.json')
  .then(response => response.json())
  .then(data => {
    data.forEach(card => {
      if (typeof initializeCardState === 'function') {
        initializeCardState(card);
      }
    });
    CARD_DATABASE = data;

    if (Array.isArray(CARD_DATABASE) && CARD_DATABASE.length >= 2) {
      testAttacker = CARD_DATABASE[0];
      testDefender = CARD_DATABASE[1];
      if (typeof updateBattleUI === 'function') {
        updateBattleUI();
      }
    }

    console.log("思想家データ全 " + CARD_DATABASE.length + " 件の読み込みが完了しました！");
  })
  .catch(error => console.error("cards.json 読み込みエラー:", error));

let myRole = "";
let roomId = "";
let roomRef = null;
let gameState = null;
let currentLogs = [];
let isCpuMode = false; // CPU対戦モードフラグ

function addLogMessage(msg) {
  currentLogs.unshift(msg);
}

function renderLogs(logs) {
  const l = document.getElementById("log");
  if (!l || !logs) return;
  l.innerHTML = logs.map(msg => "<div>・" + msg + "</div>").join("");
}

function applyTeamSynergy(cards, teamName) {
  const tagCounts = {};
  cards.forEach(c => {
    if (c.synergyTags && Array.isArray(c.synergyTags)) {
      c.synergyTags.forEach(tag => { tagCounts[tag] = (tagCounts[tag] || 0) + 1; });
    }
  });

  cards.forEach(c => {
    c.hasSynergy = false;
    if (c.synergyTags && Array.isArray(c.synergyTags)) {
      c.synergyTags.forEach(tag => { if (tagCounts[tag] >= 2) c.hasSynergy = true; });
    }

    if (c.hasSynergy && !c.synergyApplied) {
      c.maxHp = Math.floor(c.maxHp * 1.2);
      c.hp = c.maxHp;
      c.synergyApplied = true;
      addLogMessage("🤝 【絆発動】[" + teamName + "] " + c.name + " の絆効果発動！ HPが1.2倍(" + c.maxHp + ")に強化！");
    }
  });
}

// === CPU対戦開始 ===
function startCpuBattle() {
  isCpuMode = true;
  myRole = "p1";
  currentLogs = [];

  const shuffled = [...CARD_DATABASE].sort(() => 0.5 - Math.random());

  // 全カードを isFlipped: false （裏面）で初期化
  const p1Cards = shuffled.slice(0, 3).map(c => ({
    ...c,
    hp: c.hp ?? c.maxHp ?? 100,
    currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
    maxHp: c.maxHp ?? 100,
    atk: c.atk ?? 20,
    baseAtk: c.baseAtk ?? c.atk ?? 20,
    skillUsed: false,
    isFlipped: false // 初期状態はすべて裏
  }));

  const p2Cards = shuffled.slice(3, 6).map(c => ({
    ...c,
    hp: c.hp ?? c.maxHp ?? 100,
    currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
    maxHp: c.maxHp ?? 100,
    atk: c.atk ?? 20,
    baseAtk: c.baseAtk ?? c.atk ?? 20,
    skillUsed: false,
    isFlipped: false // 初期状態はすべて裏
  }));

  applyTeamSynergy(p1Cards, "P1");
  applyTeamSynergy(p2Cards, "P2");

  gameState = {
    turnCount: 1,
    p1: { cards: p1Cards, cmd: null },
    p2: { cards: p2Cards, cmd: null },
    phase: "card_reveal",
    revealedCount: 0, // 確実に 0 でリセット
    logs: ["⚔️ CPU対戦が開始されました！「カードをめくる」ボタンを押してください。"]
  };

  document.getElementById("setup-area").style.display = "none";
  document.getElementById("game-area").style.display = "block";

  updateGameUI();
}


function revealNextCard() {
  if (!gameState || gameState.phase !== "card_reveal") return;

  if (typeof gameState.revealedCount !== "number") {
    gameState.revealedCount = 0;
  }

  if (isCpuMode) {
    const p1Cards = gameState.p1.cards;
    const p2Cards = gameState.p2.cards;

    // 自分のカードを1枚めくる
    if (gameState.revealedCount < 3) {
      p1Cards[gameState.revealedCount].isFlipped = true;
      gameState.revealedCount++;
    }

    // 3枚めくり終えたらCPUカードを全オープンしてコマンド選択へ
    if (gameState.revealedCount >= 3) {
      p2Cards.forEach(c => c.isFlipped = true);
      gameState.phase = "command_select";
      addLogMessage("⚔️ すべての思想家が登場しました！コマンドを選択してください。");
    }
  } else {
    // マルチプレイヤー時
    const myCards = gameState[myRole].cards;

    if (gameState.revealedCount < 3) {
      myCards[gameState.revealedCount].isFlipped = true;
      gameState.revealedCount++;
    }

    if (gameState.revealedCount >= 3) {
      addLogMessage("⚔️ あなたの思想家が出揃いました！相手の準備を待っています...");
      if (roomRef) {
        roomRef.child(`${myRole}/cards`).set(sanitizeObject(myCards));
      }
    }
  }

  updateGameUI();
}



// undefinedなプロパティを完全に除去する安全化関数
function sanitizeObject(obj) {
  return JSON.parse(JSON.stringify(obj, (key, value) => value === undefined ? null : value));
}

// undefinedなプロパティを完全に除去する安全化関数
function sanitizeObject(obj) {
  return JSON.parse(JSON.stringify(obj, (key, value) => value === undefined ? null : value));
}

// Firebaseのデータ監視関数（部屋の同期処理）
// 1. 部屋の通信・同期を担当する関数
function listenToRoom(roomId) {
  roomRef.on("value", (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    // 自分のめくりカウンター（revealedCount）が相手のデータで上書きされるのを防ぐ
    const localRevealedCount = (gameState && typeof gameState.revealedCount === "number") 
      ? gameState.revealedCount 
      : 0;

    gameState = data;

    // 対人戦の場合、ローカル（手元）のめくりカウントを保持する
    if (!isCpuMode && gameState.phase === "card_reveal") {
      gameState.revealedCount = localRevealedCount;
    }

    if (gameState.phase === "waiting_p2" && myRole === "p1") {
      const connEl = document.getElementById("connection-status");
      if (connEl) connEl.innerText = "🏠 部屋作成完了。P2の参加を待っています...";
    } else {
      const setupEl = document.getElementById("setup-area");
      const gameEl = document.getElementById("game-area");
      if (setupEl) setupEl.style.display = "none";
      if (gameEl) gameEl.style.display = "block";
    }

    updateGameUI();
  });
}

// undefinedなプロパティを完全除去する関数
function sanitizeObject(obj) {
  return JSON.parse(JSON.stringify(obj, (key, value) => value === undefined ? null : value));
}

// 2. 部屋の作成・参加を担当する関数
function joinRoom(role) {
  const roomId = document.getElementById("room-id-input").value.trim();
  if (!roomId) return alert("部屋IDを入力してください");
  if (!CARD_DATABASE.length) return alert("カードデータを読み込み中です。少々お待ちください。");

  myRole = role;
  isCpuMode = false;
  currentLogs = [];

  roomRef = firebase.database().ref("rooms/" + roomId);

  if (role === "p1") {
    // P1: 部屋を作成
    const shuffled = [...CARD_DATABASE].sort(() => 0.5 - Math.random());
    
    const p1Cards = shuffled.slice(0, 3).map(c => ({
      ...c,
      hp: c.hp ?? c.maxHp ?? 100,
      currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
      maxHp: c.maxHp ?? 100,
      atk: c.atk ?? 20,
      baseAtk: c.baseAtk ?? c.atk ?? 20,
      skillUsed: false,
      isFlipped: false
    }));

    const p2Cards = shuffled.slice(3, 6).map(c => ({
      ...c,
      hp: c.hp ?? c.maxHp ?? 100,
      currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
      maxHp: c.maxHp ?? 100,
      atk: c.atk ?? 20,
      baseAtk: c.baseAtk ?? c.atk ?? 20,
      skillUsed: false,
      isFlipped: false
    }));

    applyTeamSynergy(p1Cards, "P1");
    applyTeamSynergy(p2Cards, "P2");

    const initialGameState = {
      turnCount: 1,
      p1: { cards: p1Cards, cmd: null },
      p2: { cards: p2Cards, cmd: null },
      phase: "waiting_p2",
      revealedCount: 0,
      logs: ["🏠 部屋作成完了。P2の参加を待っています..."]
    };

    roomRef.set(sanitizeObject(initialGameState));
    listenToRoom(roomId);
    } else {
    // P2: 部屋に参加
    listenToRoom(roomId);
    roomRef.once("value", (snapshot) => {
      const data = snapshot.val();
      if (data && data.phase === "waiting_p2") {
        roomRef.update({
          phase: "card_reveal",
          logs: [...(data.logs || []), "⚔️ P2が参加しました！各自カードをめくってください。"]
        });
      }
    });
  }
}
function updateGameUI() {
  if (!gameState) return;

  // 1. P1・P2のカード描画（HTML上の要素名に合わせて安全に描画）
  const p1Area = document.getElementById("p1-cards") || document.getElementById("p1-area");
  const p2Area = document.getElementById("p2-cards") || document.getElementById("p2-area");

  if (p1Area && gameState.p1 && gameState.p1.cards) {
    const isP1Enemy = (myRole === "p2");
    p1Area.innerHTML = gameState.p1.cards.map(c => renderCard(c, isP1Enemy)).join("");
  }

  if (p2Area && gameState.p2 && gameState.p2.cards) {
    const isP2Enemy = (myRole === "p1");
    p2Area.innerHTML = gameState.p2.cards.map(c => renderCard(c, isP2Enemy)).join("");
  }

  // 2. フェーズに応じたUI表示切替
  const commandInputs = document.getElementById("command-inputs");
  const waitMsg = document.getElementById("wait-msg");

  if (gameState.phase === "card_reveal") {
    if (commandInputs) commandInputs.style.display = "none";
    if (waitMsg) {
      waitMsg.style.display = "block";
      const count = gameState.revealedCount || 0;
      if (count < 3) {
        waitMsg.innerHTML = `
          <button class="cpu-btn" onclick="revealNextCard()" style="font-size: 16px; padding: 10px 20px;">
            🃏 カードをめくる (${count} / 3)
          </button>
        `;
      } else {
        waitMsg.innerText = "相手の準備完了を待っています...";
      }
    }
  } else if (gameState.phase === "command_select") {
    if (commandInputs) commandInputs.style.display = "block";
    if (waitMsg) waitMsg.style.display = "none";
  }

  // ログ描画
  updateLogsUI();
}
// 戦闘開始時に1度だけ実行する関数の例
function triggerBattleStartPassives() {
  if (!gameState) return;

  ["p1", "p2"].forEach(role => {
    const playerObj = gameState[role];
    const enemyObj = gameState[role === "p1" ? "p2" : "p1"];

    if (playerObj && playerObj.cards) {
      playerObj.cards.forEach(card => {
        if (card.hp > 0) {
          triggerPassive("onBattleStart", card, playerObj, enemyObj);
        }
      });
    }
  });

  if (!isCpuMode && gameState.p1.cmd && gameState.p2.cmd && myRole === "p1") {
    processBattlePhase();
  }
}

function renderCard(c, isEnemy) {
  // まだめくられていない（裏面）場合
  if (!c.isFlipped) {
    return `
      <div class="card card-back" style="background: #333; border: 2px solid #555; height: 180px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
        <div style="font-size: 32px; color: #888;">❓</div>
      </div>
    `;
  }

  // ▼ オープン済み（表面）の場合の表示（元のデザインを維持）
  const hpPercent = Math.max(0, (c.currentHP ?? c.hp ?? 100) / (c.maxHp ?? 100) * 100);
  const synergyClass = c.hasSynergy ? 'synergy-active' : '';

  return `
    <div class="card-container ${c.currentHP === 0 ? 'defeated' : ''} ${synergyClass}" onclick="openModal('${c.id}')">
      <img src="${c.image}" class="card-image" alt="${c.name}" onerror="this.src='https://via.placeholder.com/140x140?text=No+Image'">
      <div class="card-name">${c.name}</div>
      <div class="hp-bar-container">
        <div class="hp-bar" style="width: ${hpPercent}%;"></div>
        <span class="hp-text">${c.currentHP ?? c.hp} / ${c.maxHp}</span>
      </div>
    </div>
  `;
}

function updateSelectOptions(myCards) {
  const atkSelect = document.getElementById("attacker-select");
  if (!atkSelect || !myCards) return;

  const currentAtkVal = atkSelect.value;
  atkSelect.innerHTML = myCards
    .map((c, i) => `<option value="${i}" ${c.hp === 0 ? 'disabled':''}>${c.name} (ATK:${c.atk}) ${c.skillUsed ? '[スキル済]':''}</option>`).join('');

  if (currentAtkVal !== "") atkSelect.value = currentAtkVal;
  updateSkillDisplay();
}

function updateSkillDisplay() {
  const myData = gameState ? gameState[myRole] : null;
  if (!myData) return;

  const atkIdx = document.getElementById("attacker-select").value || 0;
  const selectedCard = myData.cards[atkIdx];
  const skillBtn = document.getElementById("skill-btn");
  const statusEl = document.getElementById("skill-used-status");

  if (selectedCard) {
    const actPt = selectedCard.activeVal ?? 0;
    const pasPt = selectedCard.passiveVal ?? 0;
    const actRate = Math.min(100, Math.floor((actPt / 50) * 100));
    const pasRate = Math.min(100, Math.floor((pasPt / 50) * 100));

    document.getElementById("active-val").innerText = actPt;
    document.getElementById("active-rate").innerText = actRate;
    document.getElementById("skill-name").innerText = selectedCard.skillName || "-";
    document.getElementById("skill-desc").innerText = selectedCard.skillDesc || "-";
    
    document.getElementById("passive-val").innerText = pasPt;
    document.getElementById("passive-rate").innerText = pasRate;
    document.getElementById("passive-name").innerText = selectedCard.passiveName || "-";
    document.getElementById("passive-desc").innerText = selectedCard.passiveDesc || "-";

    if (actPt === 0) {
      skillBtn.disabled = true;
      skillBtn.title = "アクティブスキルポイントが0のため発動できません";
      if (statusEl) statusEl.innerText = "";
   } else {
      skillBtn.disabled = false;
      skillBtn.title = "";
      if (statusEl) statusEl.innerText = "";
    }
  }
}

function submitCommand(type) {
  console.log("① submitCommandが呼ばれました。タイプ:", type);

  if (!gameState) {
    console.log("エラー: gameStateが存在しません");
    return;
  }

  // 思想家選択ドロップダウン（select要素）を自動探査
  let actorSelect = document.getElementById("actor-select") || 
                    document.getElementById("select-actor") || 
                    document.getElementById("my-actor-select") ||
                    document.getElementById("attacker-select");

  if (!actorSelect) {
    actorSelect = document.querySelector("#action-area select") || document.querySelector("select");
  }

  if (!actorSelect) {
    console.log("エラー: 思想家選択用のselect要素が見つかりません");
    return;
  }

  const actorIndex = parseInt(actorSelect.value, 10) || 0;
  console.log("② 選択されたアクターインデックス:", actorIndex);

  // applyAction側の仕様(cmd.attacker)に合わせてキー名を決定
  const cmd = {
    type: type,
    attacker: actorIndex
  };

  if (isCpuMode) {
    // プレイヤーのコマンドを設定
    gameState[myRole].cmd = cmd;

    // CPUのコマンドを自動生成
    generateCpuCommand();

    console.log("③ 両者のコマンドがセットされました。ターン解決(processBattlePhase)へ進みます");
    
    // CPU戦のターン解決処理を実行
    processBattlePhase();
  } else {
    // オンライン対戦の場合（Firebaseへ送信）
    roomRef.child(myRole + "/cmd").set(cmd);
  }

  updateGameUI();
}
// === CPUの自動思考ロジック ===
function generateCpuCommand() {
  const aliveIndices = gameState.p2.cards
    .map((c, i) => ({ ...c, idx: i }))
    .filter(c => c.hp > 0);

  if (aliveIndices.length === 0) return;

  // ランダムに思想家を選択
  const chosen = aliveIndices[Math.floor(Math.random() * aliveIndices.length)];
  const actPt = chosen.activeVal || 0;

  // スキルが使えてPtがあれば、50%の確率でスキルを使用、それ以外は通常攻撃
  let type = "attack";
  if (actPt > 0 && !chosen.skillUsed && Math.random() < 0.5) {
    type = "skill";
  }

  gameState.p2.cmd = { type: type, attacker: chosen.idx };
}

function getRandomTarget(targetCards) {
  const aliveTargets = targetCards.map((c, i) => ({ ...c, originalIdx: i })).filter(c => c.hp > 0);
  if (aliveTargets.length === 0) return null;
  const randIdx = Math.floor(Math.random() * aliveTargets.length);
  return aliveTargets[randIdx].originalIdx;
}

function getAttributeMultiplier(atkType, defType) {
  if ((atkType === "源流" || atkType === "他者") && defType === "西洋") return 1.5;
  if (atkType === "西洋" && defType === "日本") return 1.5;
  if (atkType === "日本" && (defType === "源流" || defType === "他者")) return 1.5;
  return 1.0;
}

function processBattlePhase() {
  const p1Name = isCpuMode ? "あなた" : "P1";
  const p2Name = isCpuMode ? "CPU" : "P2";

  addLogMessage("=== 第 " + gameState.turnCount + " ターン 結果発表！ ===");
  
  // ▼▼ 【ターン開始時パッシブ】ここで呼び出し ▼▼
  [gameState.p1, gameState.p2].forEach(pObj => {
    pObj.cards.forEach(card => {
      if (card.hp > 0) {
        triggerPassive("onTurnStart", card, pObj, pObj === gameState.p1 ? gameState.p2 : gameState.p1);
      }
    });
  });

  applyAction(p1Name, gameState.p1, gameState.p2, gameState.p1.cmd, gameState.p2.cmd);
  applyAction(p2Name, gameState.p2, gameState.p1, gameState.p2.cmd, gameState.p1.cmd);

// ▼▼ 【ターン終了時パッシブ】呼び出し ▼▼
  [gameState.p1, gameState.p2].forEach(pObj => {
    const enemyObj = pObj === gameState.p1 ? gameState.p2 : gameState.p1;
    pObj.cards.forEach(card => {
  if (card.hp > 0) {
        triggerPassive("onTurnEnd", card, pObj, enemyObj);
      }
    });
  });

  // ▼ コマンドをリセットしてUIを更新
  gameState.p1.cmd = null;
  gameState.p2.cmd = null;
// ▼ 勝敗チェック（全滅判定）
  const p1Alive = gameState.p1.cards.some(c => c.hp > 0);
  const p2Alive = gameState.p2.cards.some(c => c.hp > 0);

  if (!p1Alive || !p2Alive) {
    gameState.phase = "finished";

    if (!p1Alive && !p2Alive) {
      addLogMessage("🤝 引き分け！両者のチームが全滅しました！");
    } else if (!p2Alive) {
      // P1が勝利した場合のログ表示切り替え
      const winMsg = isCpuMode ? "🎉 Victory！ あなたの勝利です！" : "🎉 プレイヤー1 (P1) の勝利です！";
      addLogMessage(winMsg);
    } else {
      // P2が勝利した場合のログ表示切り替え
      const loseMsg = isCpuMode ? "💀 Defeat... CPUの勝利です。" : "🎉 プレイヤー2 (P2) の勝利です！";
      addLogMessage(loseMsg);
    }
    
    // コマンド入力をリセットしてUI描画後、処理を終了
    gameState.p1.cmd = null;
    gameState.p2.cmd = null;
    updateGameUI();
    return; // ターンを進めずにここで終了
  }
  gameState.turnCount++;

  updateGameUI();
}
function executeDamage(pName, attacker, target, actorObj, targetObj, baseDmg, isSkill) {
  if (!target || target.hp <= 0) return;

  // ① 最初に mult を定義・計算する
  const mult = getAttributeMultiplier(attacker.type, target.type);
  let finalDamage = Math.floor(baseDmg * mult);

  if (attacker.atkBuff) {
    finalDamage *= 2;
    attacker.atkBuff = false;
    addLogMessage("💨 " + attacker.name + " の攻撃力が2倍にアップしている！");
  }

  if (target.defenseBuff) {
    finalDamage = Math.floor(finalDamage / 2);
    target.defenseBuff = false;
    addLogMessage("🌍 " + target.name + " は土の盾でダメージを半減した！");
  }

  if (target.fixedDamageVal !== undefined && target.fixedDamageVal !== null) {
    finalDamage = target.fixedDamageVal;
    target.fixedDamageVal = null;
    addLogMessage("📐 " + target.name + " は「決定論」により、被ダメージが " + finalDamage + " に固定された！");
  }

  // ② 被弾時パッシブの処理
  if (typeof triggerPassive === "function") {
    const reducedDmg = triggerPassive("onTakeDamage", target, attacker, finalDamage);
    if (typeof reducedDmg === "number") {
      finalDamage = reducedDmg;
    }
  }

  // ③ mult を使ったログ用テキスト生成
  let effText = mult > 1.0 ? " (弱点突いた！)" : "";
  
  target.hp -= finalDamage;
  if (target.hp < 0) target.hp = 0; 

  addLogMessage("⚔️ [" + pName + "] " + attacker.name + " の攻撃！ " + target.name + " に " + finalDamage + " のダメージ！" + effText);

  // ④ 死亡時パッシブの処理
  if (target.hp === 0) {
    addLogMessage("💀 " + target.name + " は倒れた！");
    if (typeof triggerPassive === "function") {
      triggerPassive("onDeath", target, targetObj, actorObj);
    }
  }
}
function applyAction(pName, actorObj, targetObj, cmd, oppCmd) {
  if (!cmd || !actorObj || !actorObj.cards || !actorObj.cards[cmd.attacker]) return;

  const attacker = actorObj.cards[cmd.attacker];
  if (attacker.hp <= 0) return;
　if (attacker.isStunned) {
      addLogMessage(`💤 [${pName}] ${attacker.name} は罪を悔い改めており、行動できない！`);
      attacker.isStunned = false; // 1回休んだら解除
      return;
    }
  const tgtIdx = getRandomTarget(targetObj.cards);
  const target = tgtIdx !== null ? targetObj.cards[tgtIdx] : null;

  if (cmd.type === 'attack') {
    if (target && target.hp > 0) {
      executeDamage(pName, attacker, target, actorObj, targetObj, attacker.atk, false);
    }
  } else {
    const activePt = attacker.activeVal || 0;
    if (activePt === 0) {
      addLogMessage("⚠️ [" + pName + "] " + attacker.name + " はスキルを発動できない！");
      return;
    }

    const activeRate = Math.min(100, Math.floor((activePt / 50) * 100));
    const rand = Math.floor(Math.random() * 100);

    if (rand >= activeRate) {
      addLogMessage("🎲 [" + pName + "] " + attacker.name + " のスキル「" + attacker.skillName + "」不発... (確率:" + activeRate + "%)");
      return;
    }

    let isCanceledByFestinger = false;
    if (oppCmd && oppCmd.type === 'skill' && targetObj && targetObj.cards[oppCmd.attacker]) {
      const oppAttacker = targetObj.cards[oppCmd.attacker];
      if (oppAttacker.id === 'festinger' && oppAttacker.hp > 0) {
        const festingerRate = Math.min(100, Math.floor(((oppAttacker.activeVal || 0) / 50) * 100));
        if (Math.floor(Math.random() * 100) < festingerRate) {
          isCanceledByFestinger = true;
        }
      }
    }

    if (isCanceledByFestinger) {
      addLogMessage("🚫 [" + pName + "] " + attacker.name + " のスキルはフェスティンガーの「認知的不協和」により無効化された！");
      return;
    }

    addLogMessage("🔥 [" + pName + "] " + attacker.name + " のスキル「" + attacker.skillName + "」発動！ (発動率:" + activeRate + "%)");

    // attacker.skillType ("special", "damage", "heal" 等) を優先して取得する
　　const sType = attacker.skillType || attacker.type || "special";

    switch (sType) {
      case "damage":
        if (target) {
          const dmg = activePt * 2;
          executeDamage(pName, attacker, target, actorObj, targetObj, dmg, true);
        }
        break;

      case "debuff":
        if (target) {
          const diceMax = Math.max(1, Math.floor(activePt / 5));
          const diceRoll = Math.floor(Math.random() * diceMax) + 1;
          const reduced = Math.min(diceRoll, target.atk);
          target.atk -= reduced;
          addLogMessage("🎲 [" + attacker.name + "] 1d" + diceMax + "ダイス ➔ 出た目:" + diceRoll + "！ " + target.name + " のATKを " + reduced + " 低下させた！(残ATK:" + target.atk + ")");
        }
        break;

      case "heal":
        const healAmt = activePt;
        actorObj.cards.forEach(c => {
          if (c.hp > 0) c.hp = Math.min(c.maxHp, c.hp + healAmt);
        });
        addLogMessage("✨ [" + attacker.name + "] の「" + attacker.skillName + "」！ 味方全員のHPが " + healAmt + " 回復！");
        break;

      case "buff":
        const buffAmt = Math.max(1, Math.floor(activePt / 5));
        actorObj.cards.forEach(c => {
          if (c.hp > 0) c.atk += buffAmt;
        });
        addLogMessage("🔥 [" + attacker.name + "] の「" + attacker.skillName + "」！ 味方全員のATKが +" + buffAmt + " 上昇！");
        break;

      case "cancel":
        addLogMessage("🛡️ [" + attacker.name + "] の「" + attacker.skillName + "」！ このターンの相手スキルを無効化！");
        break;

      case "special":
      default:
        executeSpecialSkill(pName, attacker, target, actorObj, targetObj, activePt);
        break;
    }
  }
}

function executeSpecialSkill(pName, attacker, target, actorObj, targetObj, activePt) {
  // specialSkills.js に、この attacker.id が登録されているか確認
  if (typeof specialSkillLogic !== 'undefined' && specialSkillLogic[attacker.id]) {
    // 登録されていれば、その専用処理を呼び出す
    specialSkillLogic[attacker.id](pName, attacker, target, actorObj, targetObj, activePt);
  } else {
    // まだ specialSkills.js に書いていないキャラの場合
    addLogMessage("⚠️ [" + pName + "] " + attacker.name + " の特殊スキルは未実装です。");
  }
}
