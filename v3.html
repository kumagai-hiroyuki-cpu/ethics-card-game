<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倫理 思想家カードバトル (3vs3)</title>

  <style>
    html, body {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      font-family: sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 10px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #f39c12;
      margin: 10px 0;
      font-size: 1.4em;
    }

    .room-setup {
      background: #2c3e50;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
    }

    .status-msg {
      font-weight: bold;
      color: #1abc9c;
      margin: 10px 0;
    }

    .battle-field {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 900px;
      margin: 0 auto;
    }

    .player-board {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #444;
    }

    .board-title {
      margin: 0 0 10px 0;
      font-size: 1em;
      display: flex;
      justify-content: space-between;
    }

    .card-list {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card-container {
      width: 30%;
      max-width: 140px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid #555;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    .card-container:active {
      transform: scale(0.95);
    }

    .card-container.defeated {
      opacity: 0.3;
      filter: grayscale(100%);
      pointer-events: none;
    }

    .card-container.synergy-active {
      border: 2px solid #f1c40f;
      box-shadow: 0 0 8px #f1c40f;
    }

    .card-image {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .card-name {
      font-size: 0.8em;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1c40f;
      text-align: center;
    }

    .hp-bar {
      background: #555;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
      position: relative;
    }

    .hp-fill {
      background: #2ecc71;
      height: 100%;
      transition: width 0.3s;
    }

    .hp-text {
      position: absolute;
      width: 100%;
      text-align: center;
      font-size: 9px;
      line-height: 12px;
      top: 0;
      left: 0;
      color: #fff;
      font-weight: bold;
    }

    .controls {
      background: #2c3e50;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 15px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .skill-box {
      background: #1a252f;
      border: 1px solid #1abc9c;
      border-radius: 6px;
      padding: 8px;
      margin: 8px 0;
      font-size: 0.85em;
      text-align: left;
    }

    .skill-title {
      color: #f39c12;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .skill-desc {
      color: #ecf0f1;
      font-size: 0.8em;
    }

    button {
      background: #e67e22;
      color: #fff;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      margin: 4px;
      font-weight: bold;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    button.cpu-btn {
      background: #27ae60;
      font-size: 15px;
      padding: 10px 20px;
    }

    button:disabled {
      background: #7f8c8d;
      cursor: not-allowed;
      opacity: 0.6;
    }

    select {
      padding: 6px;
      font-size: 13px;
      border-radius: 4px;
      margin-bottom: 6px;
      touch-action: manipulation;
    }

    .log-window {
      background: #000;
      border: 1px solid #444;
      padding: 8px;
      height: 140px;
      overflow-y: scroll;
      font-family: monospace;
      font-size: 0.8em;
      margin-top: 10px;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }

    .modal-card {
      background: #2c3e50;
      border: 2px solid #f1c40f;
      border-radius: 10px;
      width: 85%;
      max-width: 300px;
      padding: 15px;
      text-align: center;
      touch-action: manipulation;
    }

    .modal-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }

    .modal-title {
      font-size: 1.2em;
      color: #f1c40f;
      font-weight: bold;
      margin: 8px 0 4px 0;
    }

    .modal-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: #e67e22;
      font-size: 0.8em;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .modal-detail {
      font-size: 0.8em;
      text-align: left;
      background: #1a252f;
      padding: 8px;
      border-radius: 6px;
      margin-top: 6px;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="specialSkills.js"></script>
  <script src="passiveSkills.js"></script>
</head>

<body>
  <h1>📜 倫理 思想家カードバトル (3vs3)</h1>

  <div class="room-setup" id="setup-area">
    <div style="margin-bottom: 12px;">
      <button type="button" class="cpu-btn" onclick="startCpuBattle()">🤖 コンピュータと対戦 (一人プレイ)</button>
    </div>
    <hr style="border: 0; border-top: 1px solid #555; margin: 15px 0;">
    <input type="text" id="room-id-input" placeholder="部屋ID (例: 333)" style="padding: 6px; font-size: 14px;">
    <button type="button" onclick="joinRoom('p1')">部屋を作る (P1)</button>
    <button type="button" onclick="joinRoom('p2')">部屋に入る (P2)</button>
    <div id="connection-status" class="status-msg"></div>
  </div>

  <div class="battle-field" id="game-area" style="display:none;">
    <div class="player-board" id="enemy-board">
      <div class="board-title"><span>⚔️ <span id="enemy-title">相手チーム</span></span></div>
      <div id="enemy-cards" class="card-list"></div>
    </div>
    <div class="player-board" id="my-board">
      <div class="board-title"><span>🛡️ あなた (<span id="my-role"></span>)</span></div>
      <div id="my-cards" class="card-list"></div>
    </div>
  </div>

  <div class="controls" id="action-area" style="display:none;">
    <div id="wait-msg" class="status-msg" style="font-size: 0.9em;">コマンドを選択してください</div>
    <div id="command-inputs">
      行動する思想家: <select id="attacker-select" onchange="updateSkillDisplay()"></select><br>
      <span style="font-size:0.8em; color:#bdc3c7;">※攻撃ターゲットは自動でランダムに選ばれます</span><br>

      <div class="skill-box">
        <div class="skill-title">
          ✨ アクティブ [Pt:<span id="active-val">0</span> / 発動率:<span id="active-rate">0</span>%]:
          <span id="skill-name">-</span>
          <span id="skill-used-status" style="font-size:0.8em; color:#95a5a6;"></span>
        </div>
        <div class="skill-desc" id="skill-desc">-</div>

        <div class="skill-title" style="margin-top: 6px; color: #e74c3c;">
          🌀 パッシブ [Pt:<span id="passive-val">0</span> / 発動率:<span id="passive-rate">0</span>%]:
          <span id="passive-name">-</span>
        </div>
        <div class="skill-desc" id="passive-desc">-</div>
      </div>

      <button type="button" onclick="submitCommand('attack')">通常攻撃</button>
      <button type="button" id="skill-btn" onclick="submitCommand('skill')">スキル発動</button>
    </div>
  </div>

  <div id="log" class="log-window"></div>

  <div class="modal-overlay" id="card-modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <img id="modal-img" class="modal-img" src="">
      <div id="modal-title" class="modal-title"></div>
      <div>
        <span id="modal-rank" class="modal-badge"></span>
        <span id="modal-type" class="modal-badge" style="background:#3498db;"></span>
      </div>
      <div class="modal-detail">
        <strong style="color:#f39c12;">【アクティブスキル】</strong> (Pt:<span id="modal-active-val"></span>)<br>
        <span id="modal-skill-name" style="font-weight:bold;"></span>:
        <span id="modal-skill-desc" style="color:#bdc3c7;"></span>
        <hr style="border:0; border-top:1px solid #444; margin:6px 0;">
        <strong style="color:#e74c3c;">【パッシブスキル】</strong> (Pt:<span id="modal-passive-val"></span>)<br>
        <span id="modal-passive-name" style="font-weight:bold;"></span>:
        <span id="modal-passive-desc" style="color:#bdc3c7;"></span>
        <hr style="border:0; border-top:1px solid #444; margin:6px 0;">
        <strong style="color:#1abc9c;">【絆タグ】</strong><br>
        <span id="modal-tags" style="color:#1abc9c;"></span>
      </div>
      <button type="button" onclick="closeModal()" style="margin-top:12px;">閉じる</button>
    </div>
  </div>

  <script>
    document.addEventListener('touchstart', function () {}, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (e.target && e.target.closest('button, select, .card-container, .modal-card')) {
        e.preventDefault();
      }
    }, { passive: false });

    function bindTouchCompat() {
      document.querySelectorAll('button, select, .card-container').forEach(el => {
        if (el.dataset.touchBound === '1') return;
        el.dataset.touchBound = '1';

        el.addEventListener('touchstart', function (e) {
          e.preventDefault();
        }, { passive: false });

        el.addEventListener('pointerdown', function (e) {
          if (e.pointerType && e.pointerType !== 'mouse') {
            e.preventDefault();
          }
        }, { passive: false });
      });
    }

    document.addEventListener('DOMContentLoaded', bindTouchCompat);

    const firebaseConfig = {
      apiKey: "AIzaSyCFr2e2VVWPV8JIf9cIRUh94fLxGFpNR1w",
      authDomain: "ethics-card-game-4598a.firebaseapp.com",
      databaseURL: "https://ethics-card-game-4598a-default-rtdb.firebaseio.com",
      projectId: "ethics-card-game-4598a",
      storageBucket: "ethics-card-game-4598a.firebasestorage.app",
      messagingSenderId: "1094270378260",
      appId: "1:1094270378260:web:aef75b9c4108f2bd472201",
      measurementId: "G-R8SYD17150"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let CARD_DATABASE = [];

    function initializeCardState(card) {
      card.currentHP = card.maxHP || card.hp;
      card.isDead = false;
      card.isInvincible = false;
      card.evadeRate = 0;
      card.damageReduction = 0;
      card.nullifyRank = null;
      card.hasGuts = false;
      card.hasRevive = false;
      card.coverTarget = null;
      card.regenAmount = 0;
      card.stunTurns = 0;
      card.silenceTurns = 0;
      card.attackBuff = 0;
      card.defenseBuff = 0;
    }

    function applyDamage(attacker, defender, baseDamage) {
      let actualTarget = defender;
      if (defender.coverTarget && !defender.coverTarget.isDead) {
        actualTarget = defender.coverTarget;
      }
      if (actualTarget.nullifyRank && attacker.rank !== actualTarget.nullifyRank) return 0;
      if (actualTarget.isInvincible) return 0;
      if (actualTarget.evadeRate > 0 && Math.random() < actualTarget.evadeRate) {
        return 0;
      }
      let rawDamage = Math.max(0, baseDamage + (attacker.attackBuff || 0) - (actualTarget.defenseBuff || 0));
      let finalDamage = Math.floor(rawDamage * (1 - actualTarget.damageReduction));
      actualTarget.currentHP -= finalDamage;
      if (actualTarget.currentHP <= 0) {
        if (actualTarget.hasGuts) {
          actualTarget.currentHP = 1;
          actualTarget.hasGuts = false;
        } else {
          actualTarget.currentHP = 0;
          actualTarget.isDead = true;
        }
      }
      return finalDamage;
    }

    function dealTrueDamage(target, amount) {
      target.currentHP -= amount;
      if (target.currentHP <= 0) target.isDead = true;
    }

    function executeInstantKill(target) {
      target.currentHP = 0;
      target.hasGuts = false;
      target.isDead = true;
    }

    function applyHeal(target, amount, allowOverflow = false) {
      if (target.currentHP <= 0 && !target.isDead) return 0;
      target.currentHP += amount;
      if (!allowOverflow && target.currentHP > target.maxHP) {
        target.currentHP = target.maxHP;
      }
    }

    function applyBuff(target, statType, amount) {
      if (statType === 'attack') target.attackBuff += amount;
      else if (statType === 'defense') target.defenseBuff += amount;
    }

    function clearAllBuffs(target) {
      target.attackBuff = 0;
      target.defenseBuff = 0;
      target.isInvincible = false;
      target.evadeRate = 0;
      target.stunTurns = 0;
    }

    function hasTag(card, tagName) {
      return card.synergyTags && card.synergyTags.includes(tagName);
    }

    function countTagInParty(party, tagName) {
      return party.filter(card => !card.isDead && hasTag(card, tagName)).length;
    }

    function applyEffectToTag(party, tagName, effectType, amount) {
      party.forEach(card => {
        if (!card.isDead && hasTag(card, tagName)) {
          if (effectType === 'hp') applyHeal(card, amount);
          else if (effectType === 'attack') applyBuff(card, 'attack', amount);
        }
      });
    }

    function canAct(card) {
      if (card.stunTurns > 0) {
        card.stunTurns--;
        return false;
      }
      return true;
    }

    function rollDice(sides = 6) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function executeSkill(attacker, targetParty, skillData) {
      if (!canAct(attacker)) return;
      let target = targetParty[0];

      switch (skillData.type) {
        case 'damage':
          applyDamage(attacker, target, skillData.value);
          break;
        case 'heal':
          applyHeal(attacker, skillData.value);
          break;
        case 'buff':
          applyBuff(attacker, 'attack', skillData.value);
          break;
        case 'debuff':
          applyBuff(target, 'attack', -skillData.value);
          break;
        case 'special':
          executeSpecialSkill(attacker, targetParty, skillData);
          break;
      }
    }

    function executeSpecialSkill(attacker, targetParty, skillData) {
      let target = targetParty[0];
      if (attacker.name === "近松門左衛門") {
        executeInstantKill(target);
        executeInstantKill(attacker);
      } else if (attacker.name === "マズロー") {
        let dice = rollDice(6);
      }
    }

    let testAttacker, testDefender;

    function updateBattleUI() {
      if (!testAttacker || !testDefender) return;
      const atkNameEl = document.getElementById('attacker-name');
      if (atkNameEl) atkNameEl.innerText = testAttacker.name;

      const atkHpEl = document.getElementById('attacker-hp');
      if (atkHpEl) atkHpEl.innerText = testAttacker.currentHP;

      const defNameEl = document.getElementById('defender-name');
      if (defNameEl) defNameEl.innerText = testDefender.name;

      const defHpEl = document.getElementById('defender-hp');
      if (defHpEl) defHpEl.innerText = Math.max(0, testDefender.currentHP);
    }

    fetch('cards.json')
      .then(response => response.json())
      .then(data => {
        data.forEach(card => initializeCardState(card));
        CARD_DATABASE = data;

        if (Array.isArray(CARD_DATABASE) && CARD_DATABASE.length >= 2) {
          testAttacker = CARD_DATABASE[0];
          testDefender = CARD_DATABASE[1];
          updateBattleUI();
        }
      })
      .catch(error => console.error("cards.json 読み込みエラー:", error));

    let myRole = "";
    let roomId = "";
    let gameState = null;
    let currentLogs = [];
    let isCpuMode = false;

    function addLogMessage(msg) {
      if (!window.currentLogs) window.currentLogs = [];
      window.currentLogs.push(msg);

      if (typeof gameState !== "undefined" && gameState) {
        if (!gameState.logs) gameState.logs = [];
        gameState.logs.push(msg);
      }

      const logElem = document.getElementById("log");
      if (logElem) {
        const p = document.createElement("p");
        p.textContent = msg;
        p.style.margin = "2px 0";
        logElem.appendChild(p);
        logElem.scrollTop = logElem.scrollHeight;
      }
    }

    function applyTeamSynergy(cards, teamName) {
      const tagCounts = {};
      cards.forEach(c => {
        if (c.synergyTags && Array.isArray(c.synergyTags)) {
          c.synergyTags.forEach(tag => { tagCounts[tag] = (tagCounts[tag] || 0) + 1; });
        }
      });

      cards.forEach(c => {
        c.hasSynergy = false;
        if (c.synergyTags && Array.isArray(c.synergyTags)) {
          c.synergyTags.forEach(tag => {
            if (tagCounts[tag] >= 2) c.hasSynergy = true;
          });
        }

        if (c.hasSynergy && !c.synergyApplied) {
          c.maxHp = Math.floor(c.maxHp * 1.2);
          c.hp = c.maxHp;
          c.synergyApplied = true;
          addLogMessage("🤝 【絆発動】[" + teamName + "] " + c.name + " の絆効果発動！ HPが1.2倍(" + c.maxHp + ")に強化！");
        }
      });
    }

    function startCpuBattle() {
      isCpuMode = true;
      myRole = "p1";
      currentLogs = [];

      const shuffled = [...CARD_DATABASE].sort(() => 0.5 - Math.random());
      const p1Cards = shuffled.slice(0, 3).map(c => ({
        ...c,
        hp: c.hp ?? c.maxHp ?? 100,
        currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
        maxHp: c.maxHp ?? 100,
        atk: c.atk ?? 20,
        baseAtk: c.baseAtk ?? c.atk ?? 20,
        skillUsed: false,
        isFlipped: false
      }));

      const p2Cards = shuffled.slice(3, 6).map(c => ({
        ...c,
        hp: c.hp ?? c.maxHp ?? 100,
        currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
        maxHp: c.maxHp ?? 100,
        atk: c.atk ?? 20,
        baseAtk: c.baseAtk ?? c.atk ?? 20,
        skillUsed: false,
        isFlipped: false
      }));

      applyTeamSynergy(p1Cards, "P1");
      applyTeamSynergy(p2Cards, "P2");

      gameState = {
        turnCount: 1,
        p1: { name: "あなた", cards: p1Cards, cmd: null },
        p2: { name: "CPU", cards: p2Cards, cmd: null },
        phase: "card_reveal",
        revealedCount: 0,
        logs: ["⚔️ CPU対戦が開始されました！「カードをめくる」ボタンを押してください。"]
      };

      const setupArea = document.getElementById("setup-area");
      const gameArea = document.getElementById("game-area");
      if (setupArea) setupArea.style.display = "none";
      if (gameArea) gameArea.style.display = "block";

      updateGameUI();
      if (typeof triggerBattleStartPassives === "function") {
        triggerBattleStartPassives();
      }
    }

    function joinRoom(role) {
      const inputElem = document.getElementById("room-id-input");
      let inputRoomId = inputElem ? inputElem.value.trim() : "";

      if (!inputRoomId) {
        if (role === 'p1') {
          inputRoomId = "100";
          if (inputElem) inputElem.value = "100";
        } else {
          alert("部屋IDを入力してください（例: 333）");
          return;
        }
      }

      roomId = inputRoomId;
      myRole = role;
      isCpuMode = false;

      if (typeof db === "undefined" || !db) {
        alert("Firebaseに接続されていません。");
        return;
      }

      const roomRef = db.ref("rooms/" + roomId);

      if (role === 'p1') {
        const shuffled = [...CARD_DATABASE].sort(() => 0.5 - Math.random());
        const p1Cards = shuffled.slice(0, 3).map(c => ({
          ...c,
          hp: c.hp ?? c.maxHp ?? 100,
          currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
          maxHp: c.maxHp ?? 100,
          atk: c.atk ?? 20,
          skillUsed: false,
          isFlipped: false
        }));
        const p2Cards = shuffled.slice(3, 6).map(c => ({
          ...c,
          hp: c.hp ?? c.maxHp ?? 100,
          currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
          maxHp: c.maxHp ?? 100,
          atk: c.atk ?? 20,
          skillUsed: false,
          isFlipped: false
        }));

        applyTeamSynergy(p1Cards, "P1");
        applyTeamSynergy(p2Cards, "P2");

        const newGameState = {
          phase: "waiting_p2",
          turnCount: 1,
          p1: { name: "P1(あなた)", cards: p1Cards, cmd: null },
          p2: { name: "P2(待機中)", cards: p2Cards, cmd: null },
          revealedCount: 0,
          logs: ["部屋を作成しました (部屋ID: " + roomId + ")。P2の参加を待っています..."]
        };

        roomRef.set(sanitizeObject(newGameState), function (error) {
          if (error) {
            alert("部屋の作成に失敗しました。");
          } else {
            listenToRoom(roomId);
            const setupArea = document.getElementById("setup-area");
            const gameArea = document.getElementById("game-area");
            if (setupArea) setupArea.style.display = "none";
            if (gameArea) gameArea.style.display = "block";
            updateGameUI();
          }
        });
      } else if (role === 'p2') {
        roomRef.once("value", function (snapshot) {
          const data = snapshot.val();
          if (data) {
            data.phase = "card_reveal";
            if (data.p2) data.p2.name = "P2(あなた)";
            if (data.p1) data.p1.name = "P1(相手)";
            data.logs = [...(data.logs || []), "⚔️ P2が参加しました！各自カードをめくってください。"];

            roomRef.update(sanitizeObject(data), function (error) {
              if (!error) {
                listenToRoom(roomId);
                const setupArea = document.getElementById("setup-area");
                const gameArea = document.getElementById("game-area");
                if (setupArea) setupArea.style.display = "none";
                if (gameArea) gameArea.style.display = "block";
                updateGameUI();
              }
            });
          } else {
            alert("部屋ID 「" + roomId + "」 が存在しません。先にP1で部屋を作成してください。");
          }
        });
      }
    }

    function revealNextCard() {
      if (!gameState || gameState.phase !== "card_reveal") return;

      const myData = gameState[myRole];
      if (!myData || !myData.cards) return;

      const unrevealedCard = myData.cards.find(c => !c.isFlipped);
      if (unrevealedCard) {
        unrevealedCard.isFlipped = true;
      }

      const allMyFlipped = myData.cards.every(c => c.isFlipped);

      if (isCpuMode) {
        if (allMyFlipped) {
          gameState.p2.cards.forEach(c => c.isFlipped = true);
          gameState.phase = "command_select";
          addLogMessage("⚔️ すべての思想家が登場しました！コマンドを選択してください。");
        }
        updateGameUI();
      } else {
        const enemyRole = myRole === "p1" ? "p2" : "p1";
        const enemyData = gameState[enemyRole];
        const allEnemyFlipped = enemyData && enemyData.cards ? enemyData.cards.every(c => c.isFlipped) : false;

        let updates = {};
        updates[`rooms/${roomId}/${myRole}/cards`] = sanitizeObject(myData.cards);

        if (allMyFlipped && allEnemyFlipped) {
          updates[`rooms/${roomId}/phase`] = "command_select";
          updates[`rooms/${roomId}/logs`] = [...(gameState.logs || []), "⚔️ お互いの準備が完了しました！コマンドを選択してください。"];
        } else if (allMyFlipped) {
          addLogMessage("⚔️ あなたの思想家が出揃いました！相手の準備を待っています...");
          updates[`rooms/${roomId}/logs`] = gameState.logs || [];
        }

        if (db && roomId) {
          db.ref().update(updates);
        }
      }
    }

    function sanitizeObject(obj) {
      return JSON.parse(JSON.stringify(obj, (key, value) => value === undefined ? null : value));
    }

    function listenToRoom(id) {
      if (isCpuMode) return;
      const roomRef = db ? db.ref("rooms/" + id) : null;
      if (!roomRef) return;

      roomRef.on("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          gameState = data;

          if (!isCpuMode && gameState.phase === "command_select") {
            if (gameState.p1 && gameState.p1.cmd && gameState.p2 && gameState.p2.cmd) {
              if (myRole === "p1") {
                processBattlePhase();
                db.ref("rooms/" + roomId).set(sanitizeObject(gameState));
              }
            }
          }

          updateGameUI();
          bindTouchCompat();
        }
      });
    }

    function updateGameUI() {
      if (!gameState) return;

      const myRoleElem = document.getElementById("my-role");
      if (myRoleElem && gameState.p1) {
        myRoleElem.textContent = myRole === "p1" ? (gameState.p1.name || "あなた") : (gameState.p2.name || "あなた");
      }

      const myCardsElem = document.getElementById("my-cards");
      const enemyCardsElem = document.getElementById("enemy-cards");

      const myPlayerData = myRole === "p1" ? gameState.p1 : gameState.p2;
      const enemyPlayerData = myRole === "p1" ? gameState.p2 : gameState.p1;

      if (myCardsElem && myPlayerData && myPlayerData.cards) {
        myCardsElem.innerHTML = myPlayerData.cards.map(c => renderCard(c, false)).join("");
      }

      if (enemyCardsElem && enemyPlayerData && enemyPlayerData.cards) {
        enemyCardsElem.innerHTML = enemyPlayerData.cards.map(c => renderCard(c, true)).join("");
      }

      const actionArea = document.getElementById("action-area");
      const waitMsg = document.getElementById("wait-msg");
      const commandInputs = document.getElementById("command-inputs");

      if (actionArea) actionArea.style.display = "block";

      if (gameState.phase === "waiting_p2") {
        if (commandInputs) commandInputs.style.display = "none";
        if (waitMsg) {
          waitMsg.style.display = "block";
          waitMsg.innerHTML = `<div style="font-size: 16px; color: #f1c40f;">⏳ 相手(P2)が部屋に入るのを待っています...<br><small>(部屋ID: ${roomId})</small></div>`;
        }
      } else if (gameState.phase === "card_reveal") {
        if (commandInputs) commandInputs.style.display = "none";
        if (waitMsg) {
          waitMsg.style.display = "block";
          const myFlippedCount = myPlayerData && myPlayerData.cards ? myPlayerData.cards.filter(c => c.isFlipped).length : 0;

          if (myFlippedCount < 3) {
            waitMsg.innerHTML = `
              <button type="button" class="cpu-btn" onclick="revealNextCard()" style="font-size: 16px; padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
                🃏 カードをめくる (${myFlippedCount} / 3)
              </button>
            `;
          } else {
            waitMsg.innerText = "相手の準備完了を待っています...";
          }
        }
      } else if (gameState.phase === "command_select") {
        if (commandInputs) commandInputs.style.display = "block";
        if (waitMsg) waitMsg.style.display = "none";

        if (myPlayerData && myPlayerData.cards) {
          updateSelectOptions(myPlayerData.cards);
        }
      }

      const logElem = document.getElementById("log");
      if (logElem) {
        const logsToRender = (gameState && gameState.logs && gameState.logs.length > 0)
          ? gameState.logs
          : (window.currentLogs || []);

        logElem.innerHTML = "";
        logsToRender.forEach(msg => {
          const div = document.createElement("div");
          div.textContent = msg;
          div.style.margin = "2px 0";
          logElem.appendChild(div);
        });
        logElem.scrollTop = logElem.scrollHeight;
      }

      bindTouchCompat();
    }

    function triggerBattleStartPassives() {
      if (!gameState) return;

      ["p1", "p2"].forEach(role => {
        const playerObj = gameState[role];
        const enemyObj = gameState[role === "p1" ? "p2" : "p1"];

        if (playerObj && playerObj.cards) {
          playerObj.cards.forEach(card => {
            if (card.hp > 0) {
              triggerPassive("onBattleStart", card, playerObj, enemyObj);
            }
          });
        }
      });
    }

    function renderCard(c, isEnemy) {
      if (!c || !c.isFlipped) {
        return `
          <div class="card-container card-back" style="min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #2a2a2a; border: 2px solid #555;">
            <div style="font-size: 36px; color: #e74c3c; font-weight: bold;">❓</div>
          </div>
        `;
      }

      const hpPercent = Math.max(0, (c.currentHP ?? c.hp ?? 100) / (c.maxHp ?? 100) * 100);
      const synergyClass = c.hasSynergy ? 'synergy-active' : '';

      return `
        <div class="card-container ${c.currentHP === 0 ? 'defeated' : ''} ${synergyClass}" onclick="openModal('${c.id}')">
          <img src="${c.image}" class="card-image" alt="${c.name}" onerror="this.src='https://via.placeholder.com/140x140?text=No+Image'">
          <div class="card-name">${c.name}</div>
          <div class="hp-bar-container" style="padding: 4px;">
            <div class="hp-bar">
              <div class="hp-fill" style="width: ${hpPercent}%;"></div>
              <span class="hp-text">${c.currentHP ?? c.hp} / ${c.maxHp}</span>
            </div>
          </div>
        </div>
      `;
    }

    function updateSelectOptions(myCards) {
      const atkSelect = document.getElementById("attacker-select");
      if (!atkSelect || !myCards) return;

      const currentAtkVal = atkSelect.value;
      atkSelect.innerHTML = myCards.map((c, i) => `
        <option value="${i}" ${c.hp === 0 ? 'disabled' : ''}>${c.name} (ATK:${c.atk}) ${c.skillUsed ? '[スキル済]' : ''}</option>
      `).join('');

      if (currentAtkVal !== "") atkSelect.value = currentAtkVal;
      updateSkillDisplay();
    }

    function updateSkillDisplay() {
      const myData = gameState ? gameState[myRole] : null;
      if (!myData) return;

      const atkIdx = document.getElementById("attacker-select").value || 0;
      const selectedCard = myData.cards[atkIdx];
      const skillBtn = document.getElementById("skill-btn");
      const statusEl = document.getElementById("skill-used-status");

      if (selectedCard) {
        const actPt = selectedCard.activeVal ?? 0;
        const pasPt = selectedCard.passiveVal ?? 0;
        const actRate = Math.min(100, Math.floor((actPt / 50) * 100));
        const pasRate = Math.min(100, Math.floor((pasPt / 50) * 100));

        document.getElementById("active-val").innerText = actPt;
        document.getElementById("active-rate").innerText = actRate;
        document.getElementById("skill-name").innerText = selectedCard.skillName || "-";
        document.getElementById("skill-desc").innerText = selectedCard.skillDesc || "-";

        document.getElementById("passive-val").innerText = pasPt;
        document.getElementById("passive-rate").innerText = pasRate;
        document.getElementById("passive-name").innerText = selectedCard.passiveName || "-";
        document.getElementById("passive-desc").innerText = selectedCard.passiveDesc || "-";

        if (actPt === 0) {
          skillBtn.disabled = true;
          skillBtn.title = "アクティブスキルポイントが0のため発動できません";
          if (statusEl) statusEl.innerText = "";
        } else {
          skillBtn.disabled = false;
          skillBtn.title = "";
          if (statusEl) statusEl.innerText = "";
        }
      }
    }

    function submitCommand(type) {
      if (!gameState) return;

      let actorSelect = document.getElementById("actor-select") ||
        document.getElementById("select-actor") ||
        document.getElementById("my-actor-select") ||
        document.getElementById("attacker-select");

      if (!actorSelect) {
        actorSelect = document.querySelector("#action-area select") || document.querySelector("select");
      }

      if (!actorSelect) return;

      const actorIndex = parseInt(actorSelect.value, 10) || 0;
      const cmd = {
        type: type,
        attacker: actorIndex
      };

      if (isCpuMode) {
        gameState[myRole].cmd = cmd;
        generateCpuCommand();
        processBattlePhase();
      } else {
        db.ref("rooms/" + roomId + "/" + myRole + "/cmd").set(cmd);
      }

      updateGameUI();
    }

    function generateCpuCommand() {
      const aliveIndices = gameState.p2.cards
        .map((c, i) => ({ ...c, idx: i }))
        .filter(c => c.hp > 0);

      if (aliveIndices.length === 0) return;

      const chosen = aliveIndices[Math.floor(Math.random() * aliveIndices.length)];
      const actPt = chosen.activeVal || 0;

      let type = "attack";
      if (actPt > 0 && !chosen.skillUsed && Math.random() < 0.5) {
        type = "skill";
      }

      gameState.p2.cmd = { type: type, attacker: chosen.idx };
    }

    function getRandomTarget(targetCards) {
      const aliveTargets = targetCards.map((c, i) => ({ ...c, originalIdx: i })).filter(c => c.hp > 0);
      if (aliveTargets.length === 0) return null;
      const randIdx = Math.floor(Math.random() * aliveTargets.length);
      return aliveTargets[randIdx].originalIdx;
    }

    function getAttributeMultiplier(atkType, defType) {
      if ((atkType === "源流" || atkType === "他者") && defType === "西洋") return 1.5;
      if (atkType === "西洋" && defType === "日本") return 1.5;
      if (atkType === "日本" && (defType === "源流" || defType === "他者")) return 1.5;
      return 1.0;
    }

    function processBattlePhase() {
      const p1Name = isCpuMode ? "あなた" : "P1";
      const p2Name = isCpuMode ? "CPU" : "P2";

      addLogMessage("=== 第 " + gameState.turnCount + " ターン 結果発表！ ===");

      [gameState.p1, gameState.p2].forEach(pObj => {
        if (pObj && pObj.cards) {
          pObj.cards.forEach(card => {
            const hp = card.currentHP ?? card.hp ?? 0;
            if (hp > 0 && typeof triggerPassive === "function") {
              triggerPassive("onTurnStart", card, pObj, pObj === gameState.p1 ? gameState.p2 : gameState.p1);
            }
          });
        }
      });

      applyAction(p1Name, gameState.p1, gameState.p2, gameState.p1.cmd, gameState.p2.cmd);
      applyAction(p2Name, gameState.p2, gameState.p1, gameState.p2.cmd, gameState.p1.cmd);

      [gameState.p1, gameState.p2].forEach(pObj => {
        if (pObj && pObj.cards) {
          const enemyObj = pObj === gameState.p1 ? gameState.p2 : gameState.p1;
          pObj.cards.forEach(card => {
            const hp = card.currentHP ?? card.hp ?? 0;
            if (hp > 0 && typeof triggerPassive === "function") {
              triggerPassive("onTurnEnd", card, pObj, enemyObj);
            }
          });
        }
      });

      gameState.p1.cmd = null;
      gameState.p2.cmd = null;

      const p1Alive = gameState.p1.cards.some(c => (c.currentHP ?? c.hp ?? 0) > 0);
      const p2Alive = gameState.p2.cards.some(c => (c.currentHP ?? c.hp ?? 0) > 0);

      if (!p1Alive || !p2Alive) {
        gameState.phase = "finished";

        if (!p1Alive && !p2Alive) {
          addLogMessage("🤝 引き分け！両者のチームが全滅しました！");
        } else if (!p2Alive) {
          const winMsg = isCpuMode ? "🎉 Victory！ あなたの勝利です！" : "🎉 プレイヤー1 (P1) の勝利です！";
          addLogMessage(winMsg);
        } else {
          const loseMsg = isCpuMode ? "💀 Defeat... CPUの勝利です。" : "🎉 プレイヤー2 (P2) の勝利です！";
          addLogMessage(loseMsg);
        }

        updateGameUI();
        return;
      }

      gameState.turnCount += 1;
      gameState.phase = "command_select";
      updateGameUI();
    }

    function closeModal() {
      const modal = document.getElementById("card-modal");
      if (modal) {
        modal.style.display = "none";
      }
    }

    function openModal(cardId) {
      const card = CARD_DATABASE.find(c => c.id === cardId);
      if (!card) return;

      const modal = document.getElementById("card-modal");
      if (!modal) return;

      document.getElementById("modal-img").src = card.image || "";
      document.getElementById("modal-title").textContent = card.name || "";
      document.getElementById("modal-rank").textContent = card.rank || "";
      document.getElementById("modal-type").textContent = card.type || "";
      document.getElementById("modal-active-val").textContent = card.activeVal ?? 0;
      document.getElementById("modal-skill-name").textContent = card.skillName || "";
      document.getElementById("modal-skill-desc").textContent = card.skillDesc || "";
      document.getElementById("modal-passive-val").textContent = card.passiveVal ?? 0;
      document.getElementById("modal-passive-name").textContent = card.passiveName || "";
      document.getElementById("modal-passive-desc").textContent = card.passiveDesc || "";
      document.getElementById("modal-tags").textContent = (card.synergyTags || []).join(" / ");

      modal.style.display = "flex";
    }

    bindTouchCompat();
  </script>
</body>
