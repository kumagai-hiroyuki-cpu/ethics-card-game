<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>倫理 思想家カードバトル (3vs3)</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #2c3e50;
      --panel-dark: #1a252f;
      --gold: #f1c40f;
      --orange: #e67e22;
      --green: #27ae60;
      --text: #fff;
      --muted: #bdc3c7;
      --danger: #e74c3c;
      --success: #2ecc71;
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 10px;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    h1 {
      text-align: center;
      color: var(--gold);
      margin: 10px 0 16px;
      font-size: 1.5em;
    }

    .room-setup,
    .controls,
    .player-board {
      background: var(--panel);
      border-radius: 10px;
      box-shadow: 0 5px 12px var(--shadow);
    }

    .room-setup {
      max-width: 900px;
      margin: 0 auto 18px;
      padding: 18px;
      text-align: center;
    }

    .room-setup input {
      padding: 8px 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #555;
      margin-right: 8px;
      min-width: 130px;
    }

    .status-msg {
      color: #1abc9c;
      font-weight: bold;
      margin-top: 10px;
      min-height: 20px;
    }

    .battle-field {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .player-board {
      padding: 12px;
      border: 2px solid #444;
    }

    .board-title {
      font-size: 1.1em;
      font-weight: bold;
      margin: 0 0 10px;
    }

    .card-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .card-container {
      width: 30%;
      max-width: 140px;
      background: #333;
      border: 2px solid #555;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
    }

    .card-container:active { transform: scale(0.97); }
    .card-container.defeated {
      opacity: 0.35;
      filter: grayscale(100%);
      pointer-events: none;
    }
    .card-container.synergy-active {
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.7);
    }

    .card-image {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .card-name {
      padding: 4px 4px 2px;
      font-size: 0.8em;
      font-weight: bold;
      color: var(--gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .hp-bar {
      margin: 0 4px 5px;
      height: 12px;
      background: #555;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .hp-fill {
      height: 100%;
      background: var(--success);
      transition: width 0.2s ease;
    }

    .hp-text {
      position: absolute;
      inset: 0;
      font-size: 9px;
      font-weight: bold;
      line-height: 12px;
      text-align: center;
      color: white;
    }

    .card-back {
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      border-color: #666;
      color: #e74c3c;
      font-size: 2.2em;
      font-weight: bold;
    }

    .controls {
      max-width: 900px;
      margin: 18px auto 0;
      padding: 14px;
      text-align: center;
    }

    .skill-box {
      background: var(--panel-dark);
      border: 1px solid #1abc9c;
      border-radius: 6px;
      padding: 10px;
      text-align: left;
      margin: 10px 0;
    }

    .skill-title {
      color: #f39c12;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .skill-desc {
      color: var(--text);
      font-size: 0.8em;
      line-height: 1.4;
    }

    button {
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 5px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin: 4px;
      touch-action: manipulation;
    }

    button.cpu-btn {
      background: var(--green);
      padding: 10px 18px;
      font-size: 15px;
    }

    button:disabled {
      background: #7f8c8d;
      cursor: not-allowed;
      opacity: 0.7;
    }

    select {
      padding: 6px 8px;
      border-radius: 5px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .log-window {
      max-width: 900px;
      min-height: 140px;
      height: 160px;
      margin: 16px auto 0;
      background: #000;
      border: 1px solid #444;
      border-radius: 6px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.82em;
      padding: 8px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.visible { display: flex; }

    .modal-card {
      background: var(--panel);
      border: 2px solid var(--gold);
      border-radius: 12px;
      width: 85%;
      max-width: 300px;
      padding: 16px;
      text-align: center;
    }

    .modal-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      background: #000;
    }

    .modal-title {
      margin: 10px 0 4px;
      font-size: 1.2em;
      color: var(--gold);
      font-weight: bold;
    }

    .modal-badge {
      display: inline-block;
      background: var(--orange);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8em;
      font-weight: bold;
      margin: 0 4px 6px;
    }

    .modal-detail {
      background: var(--panel-dark);
      border-radius: 6px;
      padding: 8px;
      text-align: left;
      font-size: 0.8em;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>📜 倫理 思想家カードバトル (3vs3)</h1>

  <div class="room-setup" id="setup-area">
    <button type="button" class="cpu-btn" onclick="startCpuBattle()">🤖 コンピュータと対戦 (一人プレイ)</button>
    <hr style="border:0;border-top:1px solid #555;margin:15px 0;" />
    <input type="text" id="room-id-input" placeholder="部屋ID (例: 333)" />
    <button type="button" onclick="joinRoom('p1')">部屋を作る (P1)</button>
    <button type="button" onclick="joinRoom('p2')">部屋に入る (P2)</button>
    <div id="connection-status" class="status-msg"></div>
  </div>

  <div class="battle-field" id="game-area" style="display:none;">
    <div class="player-board">
      <div class="board-title">⚔️ <span id="enemy-title">相手チーム</span></div>
      <div id="enemy-cards" class="card-list"></div>
    </div>

    <div class="player-board">
      <div class="board-title">🛡️ あなた (<span id="my-role">-</span>)</div>
      <div id="my-cards" class="card-list"></div>
    </div>
  </div>

  <div class="controls" id="action-area" style="display:none;">
    <div id="wait-msg" class="status-msg" style="font-size:0.9em;">コマンドを選択してください</div>
    <div id="command-inputs">
      行動する思想家: <select id="attacker-select" onchange="updateSkillDisplay()"></select><br />
      <span style="font-size:0.8em;color:#bdc3c7;">※攻撃ターゲットは自動でランダムに選ばれます</span>

      <div class="skill-box">
        <div class="skill-title">✨ アクティブ [Pt:<span id="active-val">0</span> / 発動率:<span id="active-rate">0</span>%]: <span id="skill-name">-</span> <span id="skill-used-status" style="font-size:0.8em;color:#95a5a6;"></span></div>
        <div class="skill-desc" id="skill-desc">-</div>

        <div class="skill-title" style="margin-top: 8px; color: #e74c3c;">🌀 パッシブ [Pt:<span id="passive-val">0</span> / 発動率:<span id="passive-rate">0</span>%]: <span id="passive-name">-</span></div>
        <div class="skill-desc" id="passive-desc">-</div>
      </div>

      <button type="button" onclick="submitCommand('attack')">通常攻撃</button>
      <button type="button" id="skill-btn" onclick="submitCommand('skill')">スキル発動</button>
    </div>
  </div>

  <div id="log" class="log-window"></div>

  <div class="modal-overlay" id="card-modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <img id="modal-img" class="modal-img" src="" alt="" />
      <div id="modal-title" class="modal-title"></div>
      <div>
        <span id="modal-rank" class="modal-badge"></span>
        <span id="modal-type" class="modal-badge" style="background:#3498db;"></span>
      </div>
      <div class="modal-detail">
        <strong style="color:#f39c12;">【アクティブスキル】</strong> (Pt:<span id="modal-active-val"></span>)<br />
        <span id="modal-skill-name" style="font-weight:bold;"></span>:
        <span id="modal-skill-desc" style="color:#bdc3c7;"></span>
        <hr style="border:0;border-top:1px solid #444;margin:6px 0;" />
        <strong style="color:#e74c3c;">【パッシブスキル】</strong> (Pt:<span id="modal-passive-val"></span>)<br />
        <span id="modal-passive-name" style="font-weight:bold;"></span>:
        <span id="modal-passive-desc" style="color:#bdc3c7;"></span>
        <hr style="border:0;border-top:1px solid #444;margin:6px 0;" />
        <strong style="color:#1abc9c;">【絆タグ】</strong><br />
        <span id="modal-tags" style="color:#1abc9c;"></span>
      </div>
      <button type="button" onclick="closeModal()" style="margin-top:12px;">閉じる</button>
    </div>
  </div>

  <script>
    const philosopherPool = [
      { id: 'socrates', name: 'ソクラテス', rank: 'A', type: '哲学', image: 'https://picsum.photos/seed/socrates/300/200', maxHP: 80, atk: 16, activeVal: 10, skillName: '問答', skillDesc: '相手に3ダメージを与え、次ターンの防御を下げる。', passiveVal: 6, passiveName: '省察', passiveDesc: '自分のHPが高いとき攻撃が強化される。', synergyTags: ['哲学', '民主'] },
      { id: 'epicurus', name: 'エピクロス', rank: 'A', type: '快楽', image: 'https://picsum.photos/seed/epicurus/300/200', maxHP: 84, atk: 15, activeVal: 12, skillName: '安楽', skillDesc: '自分のHPを8回復し、次の攻撃を強化する。', passiveVal: 5, passiveName: '静穏', passiveDesc: '回復時に追加HPを得る。', synergyTags: ['快楽', '哲学'] },
      { id: 'kant', name: 'カント', rank: 'B', type: '義務', image: 'https://picsum.photos/seed/kant/300/200', maxHP: 72, atk: 18, activeVal: 9, skillName: '義務律', skillDesc: '相手に7ダメージ。自分の防御を1上げる。', passiveVal: 6, passiveName: '規範', passiveDesc: 'HPが少ないほど威力が上がる。', synergyTags: ['義務', '法'] },
      { id: 'nietzsche', name: 'ニーチェ', rank: 'S', type: '創造', image: 'https://picsum.photos/seed/nietzsche/300/200', maxHP: 90, atk: 22, activeVal: 14, skillName: '超人', skillDesc: '大ダメージを与え、突進する。', passiveVal: 9, passiveName: '強者', passiveDesc: '攻撃時に追加ダメージ。', synergyTags: ['創造', '自由'] },
      { id: 'marx', name: 'マルクス', rank: 'B', type: '階級', image: 'https://picsum.photos/seed/marx/300/200', maxHP: 78, atk: 17, activeVal: 11, skillName: '労働者', skillDesc: '自分と味方に5回復。', passiveVal: 7, passiveName: '資本', passiveDesc: '味方のHPが低いと攻撃が増幅。', synergyTags: ['階級', '政治'] },
      { id: 'hegel', name: 'ヘーゲル', rank: 'A', type: '弁証', image: 'https://picsum.photos/seed/hegel/300/200', maxHP: 76, atk: 19, activeVal: 10, skillName: '弁証法', skillDesc: '相手に6ダメージを与え、連続攻撃の機会を作る。', passiveVal: 6, passiveName: '歴史', passiveDesc: '攻撃後に少量回復。', synergyTags: ['弁証', '政治'] }
    ];

    let gameState = null;
    let myRole = 'p1';
    let roomId = '';
    let isCpuMode = false;

    function makeCard(cardBase) {
      return {
        ...cardBase,
        currentHP: cardBase.maxHP,
        maxHP: cardBase.maxHP,
        atk: cardBase.atk,
        skillUsed: false,
        isFlipped: false,
        hasSynergy: false,
        attackBuff: 0,
        defenseBuff: 0,
        isDead: false
      };
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function ensureCardTeam(team, label) {
      team.forEach(card => {
        if (!card.maxHP) card.maxHP = 80;
        if (!card.currentHP) card.currentHP = card.maxHP;
        card.currentHP = Math.max(0, card.currentHP);
        card.isDead = card.currentHP <= 0;
        card.attackBuff = card.attackBuff || 0;
        card.defenseBuff = card.defenseBuff || 0;
        card.hasSynergy = false;
      });

      const tagCounts = {};
      team.forEach(card => {
        if (Array.isArray(card.synergyTags)) {
          card.synergyTags.forEach(tag => {
            tagCounts[tag] = (tagCounts[tag] || 0) + 1;
          });
        }
      });

      team.forEach(card => {
        if (Array.isArray(card.synergyTags)) {
          const hasTag = card.synergyTags.some(tag => tagCounts[tag] >= 2);
          if (hasTag) {
            card.hasSynergy = true;
            card.maxHP = Math.floor(card.maxHP * 1.2);
            card.currentHP = Math.min(card.maxHP, (card.currentHP || card.maxHP) + 8);
          }
        }
      });

      addLogMessage(`🤝 【絆発動】[${label}] ${team.map(c => c.name).join(', ')} が連携してHPを強化しました。`);
    }

    function createTeam() {
      const cards = shuffle(philosopherPool).slice(0, 3).map(makeCard);
      cards.forEach(card => {
        card.currentHP = card.maxHP;
        card.isDead = false;
      });
      return cards;
    }

    function addLogMessage(message) {
      if (!gameState) {
        console.log(message);
        return;
      }
      if (!gameState.logs) gameState.logs = [];
      gameState.logs.push(message);
      renderLog();
    }

    function renderLog() {
      const log = document.getElementById('log');
      if (!log || !gameState || !gameState.logs) return;
      log.innerHTML = '';
      gameState.logs.forEach(msg => {
        const div = document.createElement('div');
        div.textContent = msg;
        div.style.margin = '2px 0';
        log.appendChild(div);
      });
      log.scrollTop = log.scrollHeight;
    }

    function startCpuBattle() {
      isCpuMode = true;
      myRole = 'p1';
      const p1Cards = createTeam();
      const p2Cards = createTeam();
      ensureCardTeam(p1Cards, 'P1');
      ensureCardTeam(p2Cards, 'P2');

      gameState = {
        phase: 'card_reveal',
        turnCount: 1,
        p1: { name: 'あなた', cards: p1Cards, cmd: null },
        p2: { name: 'CPU', cards: p2Cards, cmd: null },
        logs: ['⚔️ CPU対戦が開始されました！「カードをめくる」ボタンを押してください。']
      };

      document.getElementById('setup-area').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      updateGameUI();
      renderLog();
    }

    function joinRoom(role) {
      const input = document.getElementById('room-id-input');
      let roomValue = (input && input.value.trim()) || '';
      if (!roomValue) {
        if (role === 'p1') {
          roomValue = '100';
          input.value = roomValue;
        } else {
          alert('部屋IDを入力してください（例: 333）');
          return;
        }
      }

      myRole = role;
      roomId = roomValue;
      isCpuMode = false;
      gameState = {
        phase: 'waiting_p2',
        turnCount: 1,
        p1: { name: 'P1(あなた)', cards: createTeam(), cmd: null },
        p2: { name: 'P2(待機中)', cards: createTeam(), cmd: null },
        logs: [`部屋を作成しました (部屋ID: ${roomId})。P2の参加を待っています...`]
      };

      document.getElementById('setup-area').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';
      updateGameUI();
      renderLog();

      const status = document.getElementById('connection-status');
      if (status) status.textContent = 'ローカル対戦モードで起動しました（Firebase未接続のため、簡易実行モードです）。';
    }

    function revealNextCard() {
      if (!gameState || gameState.phase !== 'card_reveal') return;

      const myData = gameState[myRole];
      if (!myData || !myData.cards) return;

      const next = myData.cards.find(card => !card.isFlipped);
      if (next) next.isFlipped = true;

      const allMyFlipped = myData.cards.every(card => card.isFlipped);
      if (isCpuMode) {
        if (allMyFlipped) {
          gameState.p2.cards.forEach(card => { card.isFlipped = true; });
          gameState.phase = 'command_select';
          addLogMessage('⚔️ すべての思想家が登場しました！コマンドを選択してください。');
        }
      } else {
        const enemyRole = myRole === 'p1' ? 'p2' : 'p1';
        const enemyData = gameState[enemyRole];
        const allEnemyFlipped = enemyData && enemyData.cards ? enemyData.cards.every(card => card.isFlipped) : false;

        if (allMyFlipped && allEnemyFlipped) {
          gameState.phase = 'command_select';
          addLogMessage('⚔️ お互いの準備が完了しました！コマンドを選択してください。');
        } else if (allMyFlipped) {
          addLogMessage('⚔️ あなたの思想家が出揃いました！相手の準備を待っています...');
        }
      }

      updateGameUI();
      renderLog();
    }

    function renderCard(card, isEnemy = false) {
      if (!card) return '';

      if (!card.isFlipped) {
        return `
          <div class="card-container card-back" title="未公開">
            ?
          </div>
        `;
      }

      const hpPercent = Math.max(0, (card.currentHP || 0) / (card.maxHP || 1) * 100);
      const synergyClass = card.hasSynergy ? 'synergy-active' : '';
      const defeatedClass = card.currentHP <= 0 ? 'defeated' : '';

      return `
        <div class="card-container ${synergyClass} ${defeatedClass}" onclick="openModal('${card.id}')">
          <img src="${card.image}" class="card-image" alt="${card.name}" onerror="this.src='https://via.placeholder.com/140x140?text=No+Image'" />
          <div class="card-name">${card.name}</div>
          <div class="hp-bar">
            <div class="hp-fill" style="width:${hpPercent}%"></div>
            <span class="hp-text">${card.currentHP || 0} / ${card.maxHP || 0}</span>
          </div>
        </div>
      `;
    }

    function updateGameUI() {
      if (!gameState) return;

      const myPlayerData = myRole === 'p1' ? gameState.p1 : gameState.p2;
      const enemyPlayerData = myRole === 'p1' ? gameState.p2 : gameState.p1;

      const enemyTitle = document.getElementById('enemy-title');
      if (enemyTitle) enemyTitle.textContent = enemyPlayerData ? enemyPlayerData.name : '相手チーム';

      const myRoleEl = document.getElementById('my-role');
      if (myRoleEl) myRoleEl.textContent = myPlayerData ? myPlayerData.name : 'あなた';

      document.getElementById('my-cards').innerHTML = (myPlayerData && myPlayerData.cards || []).map(card => renderCard(card, false)).join('');
      document.getElementById('enemy-cards').innerHTML = (enemyPlayerData && enemyPlayerData.cards || []).map(card => renderCard(card, true)).join('');

      const actionArea = document.getElementById('action-area');
      const waitMsg = document.getElementById('wait-msg');
      const commandInputs = document.getElementById('command-inputs');
      if (!actionArea) return;

      actionArea.style.display = 'block';

      if (gameState.phase === 'waiting_p2') {
        if (commandInputs) commandInputs.style.display = 'none';
        if (waitMsg) {
          waitMsg.style.display = 'block';
          waitMsg.innerHTML = `<div style="font-size:16px;color:#f1c40f;">⏳ 相手が参加するのを待っています...<br><small>(部屋ID: ${roomId || 'CPU'})</small></div>`;
        }
      } else if (gameState.phase === 'card_reveal') {
        if (commandInputs) commandInputs.style.display = 'none';
        if (waitMsg) {
          waitMsg.style.display = 'block';
          const count = (myPlayerData && myPlayerData.cards || []).filter(card => card.isFlipped).length;
          if (count < 3) {
            waitMsg.innerHTML = `<button type="button" class="cpu-btn" onclick="revealNextCard()">🃏 カードをめくる (${count} / 3)</button>`;
          } else {
            waitMsg.innerText = '相手の準備完了を待っています...';
          }
        }
      } else if (gameState.phase === 'command_select') {
        if (commandInputs) commandInputs.style.display = 'block';
        if (waitMsg) waitMsg.style.display = 'none';
        updateSelectOptions((myPlayerData && myPlayerData.cards) || []);
      }

      renderLog();
    }

    function updateSelectOptions(cards) {
      const select = document.getElementById('attacker-select');
      if (!select) return;

      const current = select.value || '0';
      select.innerHTML = cards.map((card, index) => `
        <option value="${index}" ${card.currentHP <= 0 ? 'disabled' : ''}>
          ${card.name} (ATK:${card.atk}) ${card.skillUsed ? '[スキル済]' : ''}
        </option>
      `).join('');

      if (cards.length > 0) {
        const safeValue = Number(current) < cards.length ? current : '0';
        select.value = safeValue;
      }

      updateSkillDisplay();
    }

    function updateSkillDisplay() {
      const myData = gameState ? (myRole === 'p1' ? gameState.p1 : gameState.p2) : null;
      if (!myData || !myData.cards) return;

      const select = document.getElementById('attacker-select');
      const index = Number((select && select.value) || 0);
      const selectedCard = myData.cards[index] || myData.cards[0];
      const skillBtn = document.getElementById('skill-btn');

      if (!selectedCard) return;

      const actPt = selectedCard.activeVal || 0;
      const pasPt = selectedCard.passiveVal || 0;
      const actRate = Math.min(100, Math.floor((actPt / 50) * 100));
      const pasRate = Math.min(100, Math.floor((pasPt / 50) * 100));

      document.getElementById('active-val').textContent = actPt;
      document.getElementById('active-rate').textContent = actRate;
      document.getElementById('skill-name').textContent = selectedCard.skillName || '-';
      document.getElementById('skill-desc').textContent = selectedCard.skillDesc || '-';

      document.getElementById('passive-val').textContent = pasPt;
      document.getElementById('passive-rate').textContent = pasRate;
      document.getElementById('passive-name').textContent = selectedCard.passiveName || '-';
      document.getElementById('passive-desc').textContent = selectedCard.passiveDesc || '-';

      if (skillBtn) {
        skillBtn.disabled = actPt <= 0;
        skillBtn.title = actPt <= 0 ? 'アクティブスキルポイントが0のため発動できません' : '';
      }
    }

    function getEnemyCards() {
      if (!gameState) return [];
      const enemyRole = myRole === 'p1' ? 'p2' : 'p1';
      return (gameState[enemyRole] && gameState[enemyRole].cards) || [];
    }

    function submitCommand(type) {
      if (!gameState) return;
      const player = myRole === 'p1' ? gameState.p1 : gameState.p2;
      if (!player || !player.cards) return;

      const select = document.getElementById('attacker-select');
      const actorIndex = Number((select && select.value) || 0);
      const actor = player.cards[actorIndex] || player.cards[0];
      if (!actor || actor.currentHP <= 0) return;

      const enemies = getEnemyCards().filter(card => card && card.currentHP > 0 && !card.isDead);
      if (!enemies.length) return;

      const target = enemies[Math.floor(Math.random() * enemies.length)];
      if (type === 'skill') {
        if ((actor.activeVal || 0) <= 0) {
          addLogMessage(`⚠️ ${actor.name} はアクティブPtが0のためスキルを使えません。`);
          return;
        }
        actor.activeVal = (actor.activeVal || 0) - 1;
        actor.skillUsed = true;
        applyAction(actor, target, 'skill');
      } else {
        applyAction(actor, target, 'attack');
      }

      if (gameState.phase === 'command_select') {
        gameState.phase = 'card_reveal';
      }

      updateGameUI();
      renderLog();
    }

    function applyAction(actor, target, actionType) {
      if (!actor || !target) return;

      if (actionType === 'attack') {
        const damage = Math.max(1, (actor.atk || 10) + (actor.attackBuff || 0) - (target.defenseBuff || 0));
        target.currentHP = Math.max(0, (target.currentHP || 0) - damage);
        addLogMessage(`⚔️ ${actor.name} の通常攻撃！ ${target.name} に ${damage} ダメージ。`);
      } else if (actionType === 'skill') {
        const skillDamage = Math.max(4, (actor.activeVal || 0) * 3 + (actor.atk || 10));
        target.currentHP = Math.max(0, (target.currentHP || 0) - skillDamage);
        addLogMessage(`✨ ${actor.name} のスキル「${actor.skillName || 'スキル'}」！ ${target.name} に ${skillDamage} ダメージ。`);
      }

      if (target.currentHP <= 0) {
        target.currentHP = 0;
        target.isDead = true;
        addLogMessage(`💀 ${target.name} は倒れた。`);
      }

      actor.skillUsed = true;
      updateGameUI();
    }

    function processBattlePhase() {
      if (!gameState) return;
      const p1 = gameState.p1;
      const p2 = gameState.p2;

      if (!p1 || !p2) return;

      const p1Alive = (p1.cards || []).filter(card => card && card.currentHP > 0).length;
      const p2Alive = (p2.cards || []).filter(card => card && card.currentHP > 0).length;
      if (!p1Alive || !p2Alive) {
        addLogMessage('🏁 戦闘終了。');
        return;
      }

      const p1Actor = (p1.cards || []).find(card => card && card.currentHP > 0) || null;
      const p2Actor = (p2.cards || []).find(card => card && card.currentHP > 0) || null;
      const p1Target = (p2.cards || []).find(card => card && card.currentHP > 0) || null;
      const p2Target = (p1.cards || []).find(card => card && card.currentHP > 0) || null;

      if (p1Actor && p1Target) applyAction(p1Actor, p1Target, 'attack');
      if (p2Actor && p2Target) applyAction(p2Actor, p2Target, 'attack');

      gameState.turnCount += 1;
      addLogMessage(`🔁 ターン ${gameState.turnCount} へ進行しました。`);
      updateGameUI();
    }

    function openModal(cardId) {
      const card = [...(gameState?.p1?.cards || []), ...(gameState?.p2?.cards || [])].find(item => item && item.id === cardId);
      if (!card) return;

      const modal = document.getElementById('card-modal');
      if (!modal) return;

      document.getElementById('modal-img').src = card.image;
      document.getElementById('modal-title').textContent = card.name;
      document.getElementById('modal-rank').textContent = card.rank || 'N';
      document.getElementById('modal-type').textContent = card.type || '思想';
      document.getElementById('modal-active-val').textContent = card.activeVal || 0;
      document.getElementById('modal-skill-name').textContent = card.skillName || '-';
      document.getElementById('modal-skill-desc').textContent = card.skillDesc || '-';
      document.getElementById('modal-passive-val').textContent = card.passiveVal || 0;
      document.getElementById('modal-passive-name').textContent = card.passiveName || '-';
      document.getElementById('modal-passive-desc').textContent = card.passiveDesc || '-';
      document.getElementById('modal-tags').textContent = (card.synergyTags || []).join(', ') || '-';

      modal.classList.add('visible');
    }

    function closeModal() {
      const modal = document.getElementById('card-modal');
      if (modal) modal.classList.remove('visible');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderLog();
      updateGameUI();
    });
  </script>
</body>
</html>
