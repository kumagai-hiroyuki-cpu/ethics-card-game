<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倫理 思想家カードバトル (3vs3)</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 10px; margin: 0; user-select: none; }
    h1 { text-align: center; color: #f39c12; margin: 10px 0; font-size: 1.4em; }

    /* 公式化された編成画面のデザイン */
    .room-setup { background: #2c3e50; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 15px; max-width: 600px; margin-left: auto; margin-right: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
    .setup-title { color: #1abc9c; font-size: 1.2em; margin-bottom: 15px; font-weight: bold; border-bottom: 2px solid #34495e; padding-bottom: 8px; }
    .rule-selector { margin-bottom: 15px; background: #34495e; padding: 10px; border-radius: 6px; display: inline-block; }
    .deck-builder { display: flex; flex-direction: column; gap: 10px; align-items: center; background: #1a252f; padding: 15px; border-radius: 6px; }
    .deck-slot { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 350px; }
    .deck-slot label { font-weight: bold; color: #ecf0f1; width: 60px; text-align: right; margin-right: 10px; }
    .deck-slot select { flex-grow: 1; padding: 8px; font-size: 14px; border-radius: 4px; border: 1px solid #7f8c8d; background: #fff; }
    .cost-display { font-weight: bold; font-size: 1.1em; margin: 15px 0 10px 0; background: #34495e; padding: 8px 15px; border-radius: 20px; display: inline-block; }

    .status-msg { font-weight: bold; color: #1abc9c; margin: 10px 0; text-align: center; }

    .battle-field { display: flex; flex-direction: column; gap: 15px; max-width: 900px; margin: 0 auto; }
    .player-board { background: #2a2a2a; padding: 10px; border-radius: 10px; border: 2px solid #444; }
    .board-title { margin: 0 0 10px 0; font-size: 1em; display: flex; justify-content: space-between; }

    .card-list { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .card-container { width: 30%; max-width: 140px; background: #333; border-radius: 6px; overflow: hidden; border: 2px solid #555; cursor: pointer; position: relative; transition: transform 0.1s; }
    .card-container:active { transform: scale(0.95); }
    .card-container.defeated { opacity: 0.3; filter: grayscale(100%); pointer-events: none; }
    .card-container.synergy-active { border: 2px solid #f1c40f; box-shadow: 0 0 8px #f1c40f; }

    .card-image { width: 100%; height: 140px; object-fit: cover; display: block; background: #000; }
    .card-info { padding: 5px; background: rgba(0,0,0,0.8); }
    .card-name { font-size: 0.8em; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f1c40f; text-align: center; }

    .hp-bar { background: #555; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 4px; position: relative; }
    .hp-fill { background: #2ecc71; height: 100%; transition: width 0.3s; }
    .hp-text { position: absolute; width: 100%; text-align: center; font-size: 9px; line-height: 12px; top: 0; left: 0; color: #fff; font-weight: bold; }

    .controls { background: #2c3e50; padding: 12px; border-radius: 8px; text-align: center; margin-top: 15px; max-width: 900px; margin-left: auto; margin-right: auto; }

    button.cpu-btn { background: #27ae60; font-size: 15px; padding: 12px 24px; width: 100%; max-width: 300px; }
    button:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.5; }
    button:hover:not(:disabled) { opacity: 0.9; }

    .log-window { background: #000; border: 1px solid #444; padding: 8px; height: 140px; overflow-y: scroll; font-family: monospace; font-size: 0.8em; margin-top: 10px; max-width: 900px; margin-left: auto; margin-right: auto; }

    /* モーダル */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }

    .modal-detail { font-size: 0.8em; text-align: left; background: #1a252f; padding: 8px; border-radius: 6px; margin-top: 6px; }

    input[type="text"] { padding: 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 10px; width: 150px; }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<body>
<h1>📜 倫理 思想家カードバトル (3vs3)</h1>

<!-- 公式チーム編成フェーズ -->
<div class="room-setup" id="setup-area">

  <hr style="border: 0; border-top: 1px solid #555; margin: 20px 0;">
  
  <div style="display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap;">
    <input type="text" id="room-id-input" placeholder="部屋ID (例: 333)">
    <button id="btn-p1" class="start-btn" onclick="joinRoom('p1')" style="background: #2980b9;">部屋を作る (P1)</button>
    <button id="btn-p2" class="start-btn" onclick="joinRoom('p2')" style="background: #8e44ad;">部屋に入る (P2)</button>

<!-- バトルフィールド -->
<div class="battle-field" id="game-area" style="display:none;">
  <div class="player-board" id="enemy-board">

  <div class="player-board" id="my-board">
    <div class="board-title"><span>🛡️ あなた (<span id="my-role"></span>)</span></div>

</div>

<div class="controls" id="action-area" style="display:none;">
  <div id="wait-msg" class="status-msg" style="font-size: 0.9em;">コマンドを選択してください</div>
  <div id="command-inputs">
    行動する思想家: <select id="attacker-select" onchange="updateSkillDisplay()"></select><br>
    <span style="font-size:0.8em; color:#bdc3c7;">※攻撃ターゲットは自動でランダムに選ばれます</span><br>
  </div>
  <div id="reset-area" style="display: none; margin-top: 10px;">
    <button class="cpu-btn" onclick="resetGame()" style="background-color: #e67e22;">
      🔄 チーム編成へ戻る
    </button>
  </div>
  <div class="skill-box">
    <div class="skill-title">✨ アクティブ [Pt:<span id="active-val">0</span> / 発動率:<span id="active-rate">0</span>%]: <span id="skill-name">-</span> <span id="skill-used-status" style="color:#e74c3c;"></span></div>
    <div class="skill-desc" id="skill-desc">-</div>
    <div class="skill-title" style="margin-top: 6px; color: #e74c3c;">🌀 パッシブ [Pt:<span id="passive-val">0</span> / 発動率:<span id="passive-rate">0</span>%]: <span id="passive-name">-</span></div>
    <div class="skill-desc" id="passive-desc">-</div>
  </div>

  <button onclick="submitCommand('attack')">通常攻撃</button>
  <button id="skill-btn" onclick="submitCommand('skill')">スキル発動</button>
</div>

<div id="log" class="log-window"></div>

<div class="modal-overlay" id="card-modal" onclick="closeModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <img id="modal-img" class="modal-img" src="">
    <div id="modal-title" class="modal-title"></div>
    <div>
      <span id="modal-rank" class="modal-badge"></span>
      <span id="modal-cost" class="modal-badge" style="background:#e74c3c;"></span>
      <span id="modal-type" class="modal-badge" style="background:#3498db;"></span>
    </div>
    <div class="modal-detail">
      <strong style="color:#f39c12;">【アクティブスキル】</strong> (Pt:<span id="modal-active-val"></span>)<br>
      <span id="modal-skill-name" style="font-weight:bold;"></span>: <span id="modal-skill-desc" style="color:#bdc3c7;"></span>
      <hr style="border:0; border-top:1px solid #444; margin:6px 0;">
      <strong style="color:#e74c3c;">【パッシブスキル】</strong> (Pt:<span id="modal-passive-val"></span>)<br>
      <span id="modal-passive-name" style="font-weight:bold;"></span>: <span id="modal-passive-desc" style="color:#bdc3c7;"></span>
      <hr style="border:0; border-top:1px solid #444; margin:6px 0;">
      <strong style="color:#1abc9c;">【絆タグ】</strong><br>
      <span id="modal-tags" style="color:#1abc9c;"></span>
    </div>
    <button onclick="closeModal()" style="margin-top:12px;">閉じる</button>
  </div>
</div>

<script>
// === Firebase接続設定 ===
const firebaseConfig = {
  apiKey: "AIzaSyCFr2e2VVWPV8JIf9cIRUh94fLxGFpNR1w",
  authDomain: "ethics-card-game-4598a.firebaseapp.com",
  databaseURL: "https://ethics-card-game-4598a-default-rtdb.firebaseio.com",
  projectId: "ethics-card-game-4598a",
  storageBucket: "ethics-card-game-4598a.firebasestorage.app",
  messagingSenderId: "1094270378260",
  appId: "1:1094270378260:web:aef75b9c4108f2bd472201",
  measurementId: "G-R8SYD17150"
};

// ==========================================
// コスト・編成システム & 最適化エンジン
// ==========================================
const MIN_COST_PER_SLOT = 2; // ランダム枠1つにつき最低消費する想定コスト（Rank C相当）

function getCurrentMaxCost() {
  const selectEl = document.getElementById('cost-limit-select');
  return selectEl ? parseInt(selectEl.value) : 10;
}

function getCardCost(card) {
  if (card.cost) return card.cost;
  if (card.rank === 'S') return 5;
  if (card.rank === 'A') return 4;
  if (card.rank === 'B') return 3;
  if (card.rank === 'C') return 2;
  return 3;
}

function initDeckMenu() {
  const db = window.CARD_DATABASE || [];
  if (db.length === 0) { setTimeout(initDeckMenu, 1000); return; }
  
  const sortedDb = [...db].sort((a, b) => getCardCost(b) - getCardCost(a));
  for (let i = 1; i <= 3; i++) {
    const el = document.getElementById(`deck-${i}`);
    if (!el) continue;
    el.innerHTML = '<option value="random">- 🎲 ランダム枠 (最適化) -</option>';
    sortedDb.forEach(card => {
      const opt = document.createElement('option');
      opt.value = card.id;
      opt.textContent = `[Cost:${getCardCost(card)}] ${card.name} (Rank:${card.rank || '-'})`;
      el.appendChild(opt);
    });
  }
  updateCostUI();
}
document.addEventListener('DOMContentLoaded', () => { initDeckMenu(); });

function updateCostUI() {
  let fixedCost = 0;
  let randomCount = 0;
  const maxCost = getCurrentMaxCost();
  
  for (let i = 1; i <= 3; i++) {
    const val = document.getElementById(`deck-${i}`).value;
    if (val !== 'random' && val !== '') {
      const card = CARD_DATABASE.find(c => String(c.id) === String(val));
      if (card) fixedCost += getCardCost(card);
    } else {
      randomCount++;
    }
  }

  const minRequiredCost = fixedCost + (randomCount * MIN_COST_PER_SLOT);
  const disp = document.getElementById('cost-display');
  const btns = document.querySelectorAll('.start-btn');

  if (fixedCost > maxCost || minRequiredCost > maxCost) {
    disp.innerHTML = `総コスト: <span style="color:#e74c3c;">${fixedCost}${randomCount > 0 ? ' + 🎲' : ''} / ${maxCost} (制限超過)</span>`;
    btns.forEach(b => b.disabled = true);
  } else {
    disp.innerHTML = `総コスト: <span style="color:#2ecc71;">${fixedCost}${randomCount > 0 ? ' + 🎲' : ''} / ${maxCost}</span>`;
    btns.forEach(b => b.disabled = false);
  }
}

// 組み合わせ最適化アルゴリズム（残りコスト枠内で最強のキャラを探索）
function getOptimizedRandomCards(availableCards, numSlots, remainingCost) {
  if (numSlots === 0) return [];
  const validCards = availableCards.filter(c => getCardCost(c) <= remainingCost);
  
  // 指定数に満たない場合は、コストが低い順に取得（妥協処理）
  if (validCards.length < numSlots) {
    return [...availableCards].sort((a, b) => getCardCost(a) - getCardCost(b)).slice(0, numSlots);
  }

  // 組み合わせ列挙関数（numSlots が最大3なので全探索で一瞬）
  function getCombinations(arr, k) {
    if (k === 1) return arr.map(e => [e]);
    const combos = [];
    arr.forEach((e, i) => {
      const smaller = getCombinations(arr.slice(i + 1), k - 1);
      smaller.forEach(c => combos.push([e].concat(c)));
    });
    return combos;
  }

  const combos = getCombinations(validCards, numSlots);
  let bestCombo = [];
  let bestScore = -1;

  combos.forEach(combo => {
    const costSum = combo.reduce((sum, c) => sum + getCardCost(c), 0);
    if (costSum <= remainingCost) {
      // 評価スコア: コスト消費量を最優先。同コストなら「HP+ATK」の高い組み合わせを優先する
      const statSum = combo.reduce((sum, c) => sum + (c.maxHp || 100) + (c.atk || 20), 0);
      const score = (costSum * 10000) + statSum; 
      
      if (score > bestScore) {
        bestScore = score;
        bestCombo = combo;
      }
    }
  });

  if (bestCombo.length === 0) return [...availableCards].sort((a, b) => getCardCost(a) - getCardCost(b)).slice(0, numSlots);
  return bestCombo;
}

function generateDeck(selections) {
  let deck = [null, null, null];
  let currentCost = 0;
  const db = [...CARD_DATABASE];

  // 1. 指定されたカードをセット
  for (let i = 0; i < 3; i++) {
    if (selections[i] && selections[i] !== 'random') {
      const c = db.find(card => String(card.id) === String(selections[i]));
      if (c) {
        deck[i] = JSON.parse(JSON.stringify(c));
        currentCost += getCardCost(c);
      }
    }
  }

  // 2. 空き枠の最適化計算
  const emptyIndices = [];
  deck.forEach((c, i) => { if (!c) emptyIndices.push(i); });
  
  if (emptyIndices.length > 0) {
    const maxAllowed = getCurrentMaxCost() - currentCost;
    // 重複を避けるため、既にデッキにいるカードを除外
    const availableCards = db.filter(c => !deck.some(d => d && d.id === c.id));
    
    // 最適化エンジンで最良の組み合わせを取得
    const bestCards = getOptimizedRandomCards(availableCards, emptyIndices.length, maxAllowed);
    
    bestCards.forEach((c, idx) => {
      deck[emptyIndices[idx]] = JSON.parse(JSON.stringify(c));
    });
  }

  return prepareCardsForBattle(deck);
}

function prepareCardsForBattle(cards) {
  return cards.map(c => ({
    ...c, hp: c.hp ?? c.maxHp ?? 100, currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
    maxHp: c.maxHp ?? 100, atk: c.atk ?? 20, baseAtk: c.baseAtk ?? c.atk ?? 20, skillUsed: false, isFlipped: false
  }));
}

// ==========================================
// 思想家カードゲーム バトル基礎関数群
// ==========================================
function initializeCardState(card) {
  card.currentHP = card.maxHP || card.hp; card.isDead = false;
  card.isInvincible = false; card.evadeRate = 0; card.damageReduction = 0; card.nullifyRank = null;
  card.hasGuts = false; card.hasRevive = false; card.coverTarget = null; card.regenAmount = 0;
  card.stunTurns = 0; card.silenceTurns = 0; card.attackBuff = 0; card.defenseBuff = 0;
}

function applyDamage(attacker, defender, baseDamage) {
  let actualTarget = defender;
  if (defender.coverTarget && !defender.coverTarget.isDead) actualTarget = defender.coverTarget;
  if (actualTarget.nullifyRank && attacker.rank !== actualTarget.nullifyRank) return 0;
  if (actualTarget.isInvincible || (actualTarget.evadeRate > 0 && Math.random() < actualTarget.evadeRate)) return 0;
  let rawDamage = Math.max(0, baseDamage + (attacker.attackBuff || 0) - (actualTarget.defenseBuff || 0));
  let finalDamage = Math.floor(rawDamage * (1 - actualTarget.damageReduction));
  actualTarget.currentHP -= finalDamage;
  if (actualTarget.currentHP <= 0) {
    if (actualTarget.hasGuts) { actualTarget.currentHP = 1; actualTarget.hasGuts = false; } 
    else { actualTarget.currentHP = 0; actualTarget.isDead = true; }
  }
  return finalDamage;
}

function applyHeal(target, amount, allowOverflow = false) { 
  if (target.currentHP <= 0 && !target.isDead) return 0;
  target.currentHP += amount;
  if (!allowOverflow && target.currentHP > target.maxHP) target.currentHP = target.maxHP;
}
function applyBuff(target, statType, amount) {
  if (statType === 'attack') target.attackBuff += amount;
  else if (statType === 'defense') target.defenseBuff += amount;
}
function hasTag(card, tagName) { return card.synergyTags && card.synergyTags.includes(tagName); }
function canAct(card) { if (card.stunTurns > 0) { card.stunTurns--; return false; } return true; }

function executeSpecialSkill(pName, attacker, target, actorObj, targetObj, activePt) {
  if (typeof specialSkillLogic !== 'undefined' && specialSkillLogic[attacker.id]) {
    specialSkillLogic[attacker.id](pName, attacker, target, actorObj, targetObj, activePt);
  } else { addLogMessage("⚠️ [" + pName + "] " + attacker.name + " の特殊スキルは未実装です。"); }
}

fetch('cards.json')
  .then(response => response.json())
  .then(data => {
    data.forEach(card => { if (typeof initializeCardState === 'function') initializeCardState(card); });
    CARD_DATABASE = data;
    console.log("思想家データ全 " + CARD_DATABASE.length + " 件の読み込み完了！");
    initDeckMenu();
  })
  .catch(error => console.error("cards.json 読み込みエラー:", error));

let myRole = ""; let roomId = ""; let roomRef = null; let gameState = null; let currentLogs = []; let isCpuMode = false;

function addLogMessage(msg) {
  if (!window.currentLogs) window.currentLogs = []; window.currentLogs.push(msg);
  if (typeof gameState !== "undefined" && gameState) {
    if (!gameState.logs) gameState.logs = []; gameState.logs.push(msg);
  }
  const logElem = document.getElementById("log") || document.getElementById("logContainer");
  if (logElem) {
    const p = document.createElement("div"); p.textContent = msg; p.style.margin = "2px 0";
    logElem.appendChild(p); logElem.scrollTop = logElem.scrollHeight;
  }
}

function resetGame() {
  if (!isCpuMode && db && roomId) { db.ref("rooms/" + roomId).remove(); db.ref("rooms/" + roomId).off(); }
  gameState = null; currentLogs = []; window.currentLogs = []; isCpuMode = false; myRole = ""; roomId = "";
  document.getElementById("setup-area").style.display = "block"; document.getElementById("game-area").style.display = "none";
  document.getElementById("action-area").style.display = "none"; document.getElementById("log").innerHTML = "";
  initDeckMenu();
}

// === CPU対戦開始 ===
function startCpuBattle() {
  isCpuMode = true; myRole = "p1"; window.currentLogs = [];
  const mySelections = [ document.getElementById('deck-1').value, document.getElementById('deck-2').value, document.getElementById('deck-3').value ];

  // ★ プレイヤーのデッキ生成（最適化計算入り）
  const p1Cards = generateDeck(mySelections);
  
  // ★ CPUのデッキ生成（完全ランダム最適化＝ルール上限内で最強の組み合わせを探す）
  const p2Cards = generateDeck(['random', 'random', 'random']); 

  gameState = {
    turnCount: 1, p1: { name: "あなた", cards: p1Cards, cmd: null }, p2: { name: "CPU", cards: p2Cards, cmd: null },
    phase: "card_reveal", revealedCount: 0, logs: ["⚔ CPU対戦が開始されました！「カードをめくる」ボタンを押してください。"]
  };

  applySynergyBuff(gameState.p1.cards); applySynergyBuff(gameState.p2.cards);
  document.getElementById("setup-area").style.display = "none"; document.getElementById("game-area").style.display = "block";
  updateGameUI();
  if (typeof triggerBattleStartPassives === "function") triggerBattleStartPassives();
}

function joinRoom(role) {
  const inputElem = document.getElementById("room-id-input");
  let inputRoomId = inputElem ? inputElem.value.trim() : "";
  if (!inputRoomId) {
    if (role === 'p1') { inputRoomId = "100"; if (inputElem) inputElem.value = "100"; } 
    else { alert("部屋IDを入力してください"); return; }
  }
  roomId = inputRoomId; myRole = role; isCpuMode = false;
  if (typeof db === "undefined" || !db) { alert("Firebaseに接続されていません。"); return; }
  const roomRef = db.ref("rooms/" + roomId);
  const mySelections = [ document.getElementById('deck-1').value, document.getElementById('deck-2').value, document.getElementById('deck-3').value ];

  if (role === 'p1') {
    const p1Cards = generateDeck(mySelections);
    const p2Cards = generateDeck(['random', 'random', 'random']); // 仮置き

    const newGameState = {
      phase: "waiting_p2", turnCount: 1, p1: { name: "P1(あなた)", cards: p1Cards, cmd: null }, p2: { name: "P2(待機中)", cards: p2Cards, cmd: null },
      revealedCount: 0, logs: ["部屋を作成しました (部屋ID: " + roomId + ")。P2の参加を待っています..."]
    };
    gameState = newGameState;
    applySynergyBuff(gameState.p1.cards);
    
    roomRef.set(sanitizeObject(gameState), function(error) {
      if (error) { alert("部屋の作成に失敗しました。"); } 
      else {
        listenToRoom(roomId);
        document.getElementById("setup-area").style.display = "none"; document.getElementById("game-area").style.display = "block";
        updateGameUI();
      }
    });
  } else if (role === 'p2') {
    roomRef.once("value", function(snapshot) {
      const data = snapshot.val();
      if (data) {
        data.phase = "card_reveal";
        if (data.p2) { data.p2.name = "P2(あなた)"; data.p2.cards = generateDeck(mySelections); }
        if (data.p1) data.p1.name = "P1(相手)";
        data.logs = [...(data.logs || []), "⚔️ P2が参加しました！各自カードをめくってください。"];
        applySynergyBuff(data.p2.cards);
        roomRef.update(sanitizeObject(data), function(error) {
          if (!error) {
            listenToRoom(roomId);
            document.getElementById("setup-area").style.display = "none"; document.getElementById("game-area").style.display = "block";
            updateGameUI();
          }
        });
      } else { alert("部屋IDが存在しません。"); }
    });
  }
}

function revealNextCard() {
  if (!gameState || gameState.phase !== "card_reveal") return;
  const myData = gameState[myRole];
  if (!myData || !myData.cards) return;

  const unrevealedCard = myData.cards.find(c => !c.isFlipped);
  if (unrevealedCard) unrevealedCard.isFlipped = true;
  const allMyFlipped = myData.cards.every(c => c.isFlipped);

  if (isCpuMode) {
    if (allMyFlipped) {
      gameState.p2.cards.forEach(c => c.isFlipped = true); gameState.phase = "command_select";
      addLogMessage("⚔️ すべての思想家が登場しました！コマンドを選択してください。");
    }
    updateGameUI();
  } else {
    const enemyRole = myRole === "p1" ? "p2" : "p1"; const enemyData = gameState[enemyRole];
    const allEnemyFlipped = enemyData && enemyData.cards ? enemyData.cards.every(c => c.isFlipped) : false;
    let updates = {}; updates[`rooms/${roomId}/${myRole}/cards`] = sanitizeObject(myData.cards);

    if (allMyFlipped && allEnemyFlipped) {
      updates[`rooms/${roomId}/phase`] = "command_select"; updates[`rooms/${roomId}/logs`] = [...(gameState.logs || []), "⚔️ お互いの準備が完了しました！コマンドを選択してください。"];
    } else if (allMyFlipped) { addLogMessage("⚔️ あなたの思想家が出揃いました！相手の準備を待っています..."); updates[`rooms/${roomId}/logs`] = gameState.logs || []; }
    if (db && roomId) db.ref().update(updates);
  }
}

function sanitizeObject(obj) { return JSON.parse(JSON.stringify(obj, (key, value) => value === undefined ? null : value)); }

function listenToRoom(id) {
  if (isCpuMode) return;
  const roomRef = db ? db.ref("rooms/" + id) : null;
  if (!roomRef) return;
  db.ref("rooms/" + id).on("value", (snapshot) => {
    const data = snapshot.val();
    if (data) {
        gameState = data;
        if (!isCpuMode && gameState.phase === "command_select") {
            if (gameState.p1 && gameState.p1.cmd && gameState.p2 && gameState.p2.cmd) {
                if (myRole === "p1") { processBattlePhase(); db.ref("rooms/" + id).set(sanitizeObject(gameState)); }
            }
        }
        
        const p1Alive = gameState.p1 && gameState.p1.cards && gameState.p1.cards.some(c => (c.currentHP ?? c.hp) > 0);
        const p2Alive = gameState.p2 && gameState.p2.cards && gameState.p2.cards.some(c => (c.currentHP ?? c.hp) > 0);
        
        if (gameState.phase === "command_select" && (!p1Alive || !p2Alive)) {
            gameState.phase = "finished";
            if (!p1Alive && !p2Alive) addLogMessage("🤝 引き分け！両者のチームが全滅しました！");
            else if (!p2Alive) addLogMessage(isCpuMode ? "🎉 Victory！あなたの勝利です！" : "🎉 プレイヤー1 (P1) の勝利です！");
            else if (!p1Alive) addLogMessage(isCpuMode ? "💀 Defeat…敗北しました" : "🎉 プレイヤー2 (P2) の勝利です！");
            
            document.getElementById("command-inputs").style.display = "none"; document.getElementById("reset-area").style.display = "block";
            updateGameUI(); return;
        }
        updateGameUI();
    }else{ 
        if (!isCpuMode) { alert("ホストが部屋をリセットしました。タイトル画面に戻ります。"); location.reload(); }
    } 
  });
}

function updateGameUI() {
  document.getElementById("reset-area").style.display = (myRole === "p1" || isCpuMode) ? "block" : "none";
  if (!gameState) return;

  if (gameState.p1) document.getElementById("my-role").textContent = myRole === "p1" ? (gameState.p1.name || "あなた") : (gameState.p2.name || "あなた");

  const myPlayerData = myRole === "p1" ? gameState.p1 : gameState.p2; const enemyPlayerData = myRole === "p1" ? gameState.p2 : gameState.p1;
  if (myPlayerData && myPlayerData.cards) document.getElementById("my-cards").innerHTML = myPlayerData.cards.map(c => renderCard(c, false)).join("");
  if (enemyPlayerData && enemyPlayerData.cards) document.getElementById("enemy-cards").innerHTML = enemyPlayerData.cards.map(c => renderCard(c, true)).join("");

  document.getElementById("action-area").style.display = "block";
  const waitMsg = document.getElementById("wait-msg"); const commandInputs = document.getElementById("command-inputs");

  if (gameState.phase === "waiting_p2") {
    commandInputs.style.display = "none"; waitMsg.style.display = "block"; waitMsg.innerHTML = `<div style="font-size: 16px; color: #f1c40f;">⏳ 相手(P2)が部屋に入るのを待っています...<br><small>(部屋ID: ${roomId})</small></div>`;
   } else if (gameState.phase === "card_reveal") {
    commandInputs.style.display = "none"; waitMsg.style.display = "block";
    const myFlippedCount = myPlayerData && myPlayerData.cards ? myPlayerData.cards.filter(c => c.isFlipped).length : 0;
    if (myFlippedCount < 3) { waitMsg.innerHTML = `<button class="cpu-btn" onclick="revealNextCard()" style="font-size: 16px; padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px;">🃏 カードをめくる (${myFlippedCount} / 3)</button>`; } 
    else { waitMsg.innerText = "相手の準備完了を待っています..."; }
  } else if (gameState.phase === "command_select") {
    commandInputs.style.display = "block"; waitMsg.style.display = "none";
    if (myPlayerData && myPlayerData.cards) updateSelectOptions(myPlayerData.cards);
  } else if (gameState.phase === "finished") {
    commandInputs.style.display = "none";
    if (myRole === "p1" || isCpuMode) { waitMsg.style.display = "none"; } 
    else { waitMsg.style.display = "block"; waitMsg.innerHTML = `<div style="font-size: 15px; color: #f1c40f;">⏳ P1が部屋をリセットするのを待っています...</div>`; }
  }

  const logElem = document.getElementById("log") || document.getElementById("logContainer");
  if (logElem) {
    const logsToRender = (gameState && gameState.logs && gameState.logs.length > 0) ? gameState.logs : (window.currentLogs || []);
    logElem.innerHTML = ""; logsToRender.forEach(msg => { const div = document.createElement("div"); div.textContent = msg; div.style.margin = "2px 0"; logElem.appendChild(div); });
    logElem.scrollTop = logElem.scrollHeight;
  }
}

function triggerBattleStartPassives() {
  if (!gameState) return;
  ["p1", "p2"].forEach(role => {
    const playerObj = gameState[role]; const enemyObj = gameState[role === "p1" ? "p2" : "p1"];
    if (playerObj && playerObj.cards) { playerObj.cards.forEach(card => { if (card.hp > 0 && typeof triggerPassive === "function") triggerPassive("onBattleStart", card, playerObj, enemyObj); }); }
  });
}

function renderCard(c, isEnemy) {
  if (!c || !c.isFlipped) { return `<div class="card-container card-back" style="min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #2a2a2a; border: 2px solid #555; border-radius: 6px;"><div style="font-size: 36px; color: #e74c3c; font-weight: bold;">?</div></div>`; }
  const hpPercent = Math.max(0, (c.currentHP ?? c.hp ?? 100) / (c.maxHp ?? 100) * 100);
  const isDefeated = (c.currentHP ?? c.hp) <= 0;
  let rawImg = c.image || c.icon || c.img || '';
  if (rawImg && !rawImg.startsWith('http') && !rawImg.startsWith('images/')) rawImg = `images/${rawImg}`;

  return `
  <div class="card-container ${isDefeated ? 'card-defeated' : ''}" onclick="openModal('${c.id || c.name}')" style="box-sizing: border-box; padding: 0; border-radius: 6px; overflow: hidden; position: relative; background: #fff; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; height: 100%; min-height: 200px;">
      ${rawImg ? `<img src="${rawImg}" alt="${c.name}" style="width: 100%; height: auto; display: block; object-fit: cover;" onerror="this.style.display='none'">` : ''}
      <div style="background: rgba(0, 0, 0, 0.85); width: 100%; padding: 4px 6px; box-sizing: border-box; text-align: center;">
        <div style="font-weight: bold; font-size: 0.85em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;">${c.name}</div>
        <div style="background: #444; height: 8px; border-radius: 4px; overflow: hidden; margin: 0 auto 2px auto; width: 90%;">
          <div style="background: #2ecc71; width: ${hpPercent}%; height: 100%;"></div>
        </div>
        <div style="font-size: 0.75em; color: #fff; font-weight: bold;">${c.currentHP ?? c.hp} / ${c.maxHp ?? 100}</div>
      </div>
    </div>`;
}

function updateSelectOptions(myCards) {
  const atkSelect = document.getElementById("attacker-select"); if (!atkSelect || !myCards) return;
  const currentAtkVal = atkSelect.value;
  atkSelect.innerHTML = myCards.map((c, i) => `<option value="${i}" ${c.hp === 0 ? 'disabled':''}>${c.name} (ATK:${c.atk}) ${c.skillUsed ? '[スキル済]':''}</option>`).join('');
  if (currentAtkVal !== "") atkSelect.value = currentAtkVal;
  updateSkillDisplay();
}

function updateSkillDisplay() {
  const myData = gameState ? gameState[myRole] : null; if (!myData) return;
  const atkIdx = document.getElementById("attacker-select").value || 0; const selectedCard = myData.cards[atkIdx];
  const skillBtn = document.getElementById("skill-btn"); const statusEl = document.getElementById("skill-used-status");

  if (selectedCard) {
    const actPt = selectedCard.activeVal ?? 0; const pasPt = selectedCard.passiveVal ?? 0;
    document.getElementById("active-val").innerText = actPt; document.getElementById("active-rate").innerText = Math.min(100, Math.floor((actPt / 50) * 100));
    document.getElementById("skill-name").innerText = selectedCard.skillName || "-"; document.getElementById("skill-desc").innerText = selectedCard.skillDesc || "-";
    document.getElementById("passive-val").innerText = pasPt; document.getElementById("passive-rate").innerText = Math.min(100, Math.floor((pasPt / 50) * 100));
    document.getElementById("passive-name").innerText = selectedCard.passiveName || "-"; document.getElementById("passive-desc").innerText = selectedCard.passiveDesc || "-";

    if (actPt === 0) { skillBtn.disabled = true; skillBtn.title = "アクティブスキルポイントが0のため発動できません"; if (statusEl) statusEl.innerText = ""; } 
    else { skillBtn.disabled = false; skillBtn.title = ""; if (statusEl) statusEl.innerText = ""; }
  }
}

function submitCommand(type) {
  if (!gameState) return;
  let actorSelect = document.getElementById("attacker-select") || document.querySelector("#action-area select"); if (!actorSelect) return;
  const cmd = { type: type, attacker: parseInt(actorSelect.value, 10) || 0 };

  if (isCpuMode) { gameState[myRole].cmd = cmd; generateCpuCommand(); processBattlePhase(); } 
  else { db.ref("rooms/" + roomId + "/" + myRole + "/cmd").set(cmd); }
  updateGameUI();
}

function generateCpuCommand() {
  const aliveIndices = gameState.p2.cards.map((c, i) => ({ ...c, idx: i })).filter(c => c.hp > 0);
  if (aliveIndices.length === 0) return;
  const chosen = aliveIndices[Math.floor(Math.random() * aliveIndices.length)];
  let type = "attack";
  if ((chosen.activeVal || 0) > 0 && !chosen.skillUsed && Math.random() < 0.5) type = "skill";
  gameState.p2.cmd = { type: type, attacker: chosen.idx };
}

function getRandomTarget(targetCards) {
  const aliveTargets = targetCards.map((c, i) => ({ ...c, originalIdx: i })).filter(c => c.hp > 0);
  return aliveTargets.length === 0 ? null : aliveTargets[Math.floor(Math.random() * aliveTargets.length)].originalIdx;
}

function getAttributeMultiplier(atkType, defType) {
  if ((atkType === "源流" || atkType === "他者") && defType === "西洋") return 1.5;
  if (atkType === "西洋" && defType === "日本") return 1.5;
  if (atkType === "日本" && (defType === "源流" || defType === "他者")) return 1.5;
  return 1.0;
}

function processBattlePhase() {
  const p1Name = isCpuMode ? "あなた" : "P1"; const p2Name = isCpuMode ? "CPU" : "P2";
  addLogMessage("=== 第 " + gameState.turnCount + " ターン 結果発表！ ===");
  
  [gameState.p1, gameState.p2].forEach(pObj => { if (pObj && pObj.cards) { pObj.cards.forEach(card => { if ((card.currentHP ?? card.hp ?? 0) > 0 && typeof triggerPassive === "function") triggerPassive("onTurnStart", card, pObj, pObj === gameState.p1 ? gameState.p2 : gameState.p1); }); } });
  applyAction(p1Name, gameState.p1, gameState.p2, gameState.p1.cmd, gameState.p2.cmd);
  applyAction(p2Name, gameState.p2, gameState.p1, gameState.p2.cmd, gameState.p1.cmd);
  [gameState.p1, gameState.p2].forEach(pObj => { if (pObj && pObj.cards) { const enemyObj = pObj === gameState.p1 ? gameState.p2 : gameState.p1; pObj.cards.forEach(card => { if ((card.currentHP ?? card.hp ?? 0) > 0 && typeof triggerPassive === "function") triggerPassive("onTurnEnd", card, pObj, enemyObj); }); } });

  gameState.p1.cmd = null; gameState.p2.cmd = null;
  const p1Alive = gameState.p1.cards.some(c => (c.currentHP ?? c.hp ?? 0) > 0);
  const p2Alive = gameState.p2.cards.some(c => (c.currentHP ?? c.hp ?? 0) > 0);

  if (!p1Alive || !p2Alive) {
    gameState.phase = "finished";
    if (!p1Alive && !p2Alive) addLogMessage("🤝 引き分け！両者のチームが全滅しました！");
    else if (!p2Alive) addLogMessage(isCpuMode ? "🎉 Victory！ あなたの勝利です！" : "🎉 プレイヤー1 (P1) の勝利です！");
    else addLogMessage(isCpuMode ? "💀 Defeat... CPUの勝利です。" : "🎉 プレイヤー2 (P2) の勝利です！");
    document.getElementById("command-inputs").style.display = "none"; document.getElementById("reset-area").style.display = "block";
    updateGameUI(); return;
  }
  gameState.turnCount++; updateGameUI();
}

function executeDamage(pName, attacker, target, actorObj, targetObj, baseDmg, isSkill) {
  const currentHpVal = target.currentHP ?? target.hp ?? 0; if (!target || currentHpVal <= 0) return;
  const mult = getAttributeMultiplier(attacker.type, target.type);
  let finalDamage = Math.floor(baseDmg * mult);
  if (attacker.atkBuff) { finalDamage *= 2; attacker.atkBuff = false; addLogMessage("💨 " + attacker.name + " の攻撃力が2倍にアップ！"); }
  if (target.defenseBuff) { finalDamage = Math.floor(finalDamage / 2); target.defenseBuff = false; addLogMessage("🌍 " + target.name + " は土の盾でダメージを半減！"); }
  if (typeof triggerPassive === "function") { const reducedDmg = triggerPassive("onTakeDamage", target, attacker, finalDamage); if (typeof reducedDmg === "number") finalDamage = reducedDmg; }

  const newHp = Math.max(0, currentHpVal - finalDamage);
  target.currentHP = newHp; target.hp = newHp;
  addLogMessage("⚔️ [" + pName + "] " + attacker.name + " の攻撃！ " + target.name + " に " + finalDamage + " のダメージ！" + (mult > 1.0 ? " (弱点突いた！)" : ""));
  if (newHp === 0) { addLogMessage("💀 " + target.name + " は倒れた！"); if (typeof triggerPassive === "function") triggerPassive("onDeath", target, targetObj, actorObj); }
}

function applyAction(pName, actorObj, targetObj, cmd, oppCmd) {
  if (!cmd || !actorObj || !actorObj.cards || !actorObj.cards[cmd.attacker]) return;
  const attacker = actorObj.cards[cmd.attacker]; if ((attacker.currentHP ?? attacker.hp ?? 0) <= 0) return;
  if (attacker.isStunned) { addLogMessage(`💤 [${pName}] ${attacker.name} は罪を悔い改めており、行動できない！`); attacker.isStunned = false; return; }

  const target = (tgtIdx => tgtIdx !== null ? targetObj.cards[tgtIdx] : null)(getRandomTarget(targetObj.cards));
  if (cmd.type === 'attack') {
    if (target) executeDamage(pName, attacker, target, actorObj, targetObj, attacker.atk, false);
    else addLogMessage("⚠️ [" + pName + "] 攻撃対象が存在しません。");
  } else {
    const activePt = attacker.activeVal || 0;
    if (activePt === 0) { addLogMessage("⚠️ [" + pName + "] " + attacker.name + " はスキルを発動できない！"); return; }
    if (Math.floor(Math.random() * 100) >= Math.min(100, Math.floor((activePt / 50) * 100))) { addLogMessage("🎲 [" + pName + "] " + attacker.name + " のスキル不発..."); return; }

    addLogMessage("🔥 [" + pName + "] " + attacker.name + " のスキル「" + attacker.skillName + "」発動！");
    const sType = attacker.skillType || attacker.type || "special";
    switch (sType) {
      case "damage": if (target) executeDamage(pName, attacker, target, actorObj, targetObj, activePt * 2, true); break;
      case "debuff": if (target) { const reduced = Math.min(Math.floor(Math.random() * Math.max(1, Math.floor(activePt / 5))) + 1, target.atk); target.atk = Math.max(0, target.atk - reduced); addLogMessage(`🎲 ${target.name}のATKを${reduced}低下！`); } break;
      case "heal": actorObj.cards.forEach(c => { if ((c.currentHP ?? c.hp ?? 0) > 0) { c.currentHP = Math.min(c.maxHp || 100, (c.currentHP ?? c.hp) + activePt); c.hp = c.currentHP; } }); addLogMessage(`✨ 味方全員のHPが${activePt}回復！`); break;
      case "buff": const buffAmt = Math.max(1, Math.floor(activePt / 5)); actorObj.cards.forEach(c => { if ((c.currentHP ?? c.hp ?? 0) > 0) c.atk += buffAmt; }); addLogMessage(`🔥 味方全員のATKが+${buffAmt}上昇！`); break;
      case "cancel": addLogMessage("🛡️ このターンの相手スキルを無効化！"); break;
      case "special": default: executeSpecialSkill(pName, attacker, target, actorObj, targetObj, activePt); break;
    }
  }
}

function applySynergyBuff(cards) {
  if (!cards || !Array.isArray(cards)) return;
  const tagCounts = {}; const tagToCards = {};
  cards.forEach(card => {
    if (!card.synergyTags) return;
    const tags = Array.isArray(card.synergyTags) ? card.synergyTags : card.synergyTags.split(',').map(t => t.trim());
    tags.forEach(tag => { if (tag === "男性" || !tag) return; tagCounts[tag] = (tagCounts[tag] || 0) + 1; if (!tagToCards[tag]) tagToCards[tag] = []; tagToCards[tag].push(card.name); });
  });
  Object.keys(tagCounts).forEach(tag => { if (tagCounts[tag] >= 2) addLogMessage(`🤝 絆効果「${tag}」発動！ (${tagToCards[tag].join(" × ")}) チームのHPが1.2倍に強化！`); });
  cards.forEach(card => {
    if (!card.synergyTags) return;
    const tags = Array.isArray(card.synergyTags) ? card.synergyTags : card.synergyTags.split(',').map(t => t.trim());
    if (tags.some(tag => tag !== "男性" && tagCounts[tag] >= 2) && !card._synergyApplied) {
      const boostedHp = Math.round((card.maxHp || card.hp || 60) * 1.2);
      card.maxHp = boostedHp; card.hp = boostedHp; card.currentHP = boostedHp; card._synergyApplied = true;
    }
  });
}

function openModal(cardId) {
  if (!cardId) return;
  const card = CARD_DATABASE.find(c => c.id === cardId || c.name === cardId); if (!card) return;
  let rawImg = card.image || card.icon || card.img || '';
  if (rawImg && !rawImg.startsWith('http') && !rawImg.startsWith('images/')) rawImg = `images/${rawImg}`;
  document.getElementById("modal-img").src = rawImg || "https://via.placeholder.com/300x180?text=No+Image";
  document.getElementById("modal-title").innerText = card.name || "不明";
  document.getElementById("modal-rank").innerText = card.rank ? `Rank: ${card.rank}` : "";
  document.getElementById("modal-cost").innerText = `Cost: ${getCardCost(card)}`;
  document.getElementById("modal-type").innerText = card.type ? `属性: ${card.type}` : "";
  document.getElementById("modal-active-val").innerText = card.activeVal ?? card.activePt ?? 0;
  document.getElementById("modal-skill-name").innerText = card.skillName || "-"; document.getElementById("modal-skill-desc").innerText = card.skillDesc || "-";
  document.getElementById("modal-passive-val").innerText = card.passiveVal ?? card.passivePt ?? 0;
  document.getElementById("modal-passive-name").innerText = card.passiveName || "-"; document.getElementById("modal-passive-desc").innerText = card.passiveDesc || "-";
  document.getElementById("modal-tags").innerText = Array.isArray(card.synergyTags) ? card.synergyTags.join(" / ") : (card.synergyTags || "なし");
  document.getElementById("card-modal").style.display = "flex";
}
function closeModal() { document.getElementById("card-modal").style.display = "none"; }
</script>
