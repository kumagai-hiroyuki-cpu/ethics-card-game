    button:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.6; }
    select { padding: 6px; font-size: 13px; border-radius: 4px; margin-bottom: 6px; }

    .log-window { background: #000; border: 1px solid #444; padding: 8px; height: 140px; overflow-y: scroll; font-family: monospace; font-size: 0.8em; margin-top: 10px; max-width: 900px; margin-left: auto; margin-right: auto; }

    /* モーダル (カード拡大表示) */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }

    button, .btn, input[type="button"] { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

<body>
<!-- v4用 デバッグ・検証パネル -->

  <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">

<h1>📜 倫理 思想家カードバトル (3vs3)</h1>

<div class="room-setup" id="setup-area">

<div class="battle-field" id="game-area" style="display:none;">

  <button onclick="submitCommand('attack')">通常攻撃</button>

    <img id="modal-img" class="modal-img" src="">
    <div id="modal-title" class="modal-title"></div>

<script>
// === Firebase接続設定 ===
const firebaseConfig = {
  apiKey: "AIzaSyCFr2e2VVWPV8JIf9cIRUh94fLxGFpNR1w",
  authDomain: "ethics-card-game-4598a.firebaseapp.com",
  databaseURL: "https://ethics-card-game-4598a-default-rtdb.firebaseio.com",
  projectId: "ethics-card-game-4598a",
  storageBucket: "ethics-card-game-4598a.firebasestorage.app",
  messagingSenderId: "1094270378260",
  appId: "1:1094270378260:web:aef75b9c4108f2bd472201",
  measurementId: "G-R8SYD17150"
};

// ==========================================
// デバッグ検証機能
// ==========================================
function initDebugMenu() {
  const selectEl = document.getElementById('debug-card-select');
  if (!selectEl) return;
  const db = window.CARD_DATABASE || window.cardsData || [];
  if (!db || db.length === 0) {
    setTimeout(initDebugMenu, 1000);
    return;
  }
  selectEl.innerHTML = '<option value="">-- 検証する思想家を選択 --</option>';
  db.forEach(card => {
    const opt = document.createElement('option');
    opt.value = card.id;
    opt.textContent = `[${card.type || '未設定'}] ${card.name}`;
    selectEl.appendChild(opt);
  });
}
document.addEventListener('DOMContentLoaded', () => { initDebugMenu(); });

function spawnDebugCard(targetSide) {
  const selectEl = document.getElementById('debug-card-select');
  if (!selectEl) return;
  const selectedCardId = selectEl.value;
  if (!selectedCardId) return;
  
  const originalCard = CARD_DATABASE.find(c => String(c.id) === String(selectedCardId));
  if (!originalCard) return;
  const newCard = JSON.parse(JSON.stringify(originalCard));

  if (targetSide === 'attacker') {
    window.debugAttackerCard = newCard;
  } else {
    window.debugDefenderCard = newCard;
  }
  if (typeof addLogMessage === 'function') {
    addLogMessage(`🛠️ [デバッグ予約] ${targetSide === 'attacker' ? 'あなた' : '相手チーム'} の1番目のカードに【${newCard.name}】をセットしました。対戦を開始してください。`);
  }
}

// ==========================================
// 思想家カードゲーム バトル基礎関数群
// ==========================================
function initializeCardState(card) {
  card.currentHP = card.maxHP || card.hp;
  card.isDead = false;
  card.isInvincible = false;
  card.evadeRate = 0;
  card.damageReduction = 0;
  card.nullifyRank = null;
  card.hasGuts = false;
  card.hasRevive = false;
  card.coverTarget = null;
  card.regenAmount = 0;
  card.stunTurns = 0;
  card.silenceTurns = 0;
  card.attackBuff = 0;
  card.defenseBuff = 0;
}

function applyDamage(attacker, defender, baseDamage) {
  let actualTarget = defender;
  if (defender.coverTarget && !defender.coverTarget.isDead) {
    actualTarget = defender.coverTarget;
    console.log(`${actualTarget.name}がダメージを肩代わり！`);
  }
  if (actualTarget.nullifyRank && attacker.rank !== actualTarget.nullifyRank) return 0;
  if (actualTarget.isInvincible) return 0;
  if (actualTarget.evadeRate > 0 && Math.random() < actualTarget.evadeRate) return 0;

  let rawDamage = Math.max(0, baseDamage + (attacker.attackBuff || 0) - (actualTarget.defenseBuff || 0));
  let finalDamage = Math.floor(rawDamage * (1 - actualTarget.damageReduction));
  actualTarget.currentHP -= finalDamage;

  if (actualTarget.currentHP <= 0) {
    if (actualTarget.hasGuts) {
      actualTarget.currentHP = 1;
      actualTarget.hasGuts = false;
    } else {
      actualTarget.currentHP = 0;
      actualTarget.isDead = true;
    }
  }
  return finalDamage;
}

function dealTrueDamage(target, amount) { target.currentHP -= amount; if (target.currentHP <= 0) target.isDead = true; }
function executeInstantKill(target) { target.currentHP = 0; target.hasGuts = false; target.isDead = true; }
function applyHeal(target, amount, allowOverflow = false) { 
  if (target.currentHP <= 0 && !target.isDead) return 0;
  target.currentHP += amount;
  if (!allowOverflow && target.currentHP > target.maxHP) target.currentHP = target.maxHP;
}
function applyBuff(target, statType, amount) {
  if (statType === 'attack') target.attackBuff += amount;
  else if (statType === 'defense') target.defenseBuff += amount;
}
function clearAllBuffs(target) {
  target.attackBuff = 0; target.defenseBuff = 0; target.isInvincible = false; target.evadeRate = 0; target.stunTurns = 0;
}
function hasTag(card, tagName) { return card.synergyTags && card.synergyTags.includes(tagName); }
function countTagInParty(party, tagName) { return party.filter(card => !card.isDead && hasTag(card, tagName)).length; }
function applyEffectToTag(party, tagName, effectType, amount) {
  party.forEach(card => {
    if (!card.isDead && hasTag(card, tagName)) {
      if (effectType === 'hp') applyHeal(card, amount);
      else if (effectType === 'attack') applyBuff(card, 'attack', amount);
    }
  });
}
function canAct(card) { if (card.stunTurns > 0) { card.stunTurns--; return false; } return true; }
function rollDice(sides = 6) { return Math.floor(Math.random() * sides) + 1; }

function executeSkill(attacker, targetParty, skillData) {
  if (!canAct(attacker)) return;
  let target = targetParty[0];
  switch (skillData.type) {
    case 'damage': applyDamage(attacker, target, skillData.value); break;
    case 'heal': applyHeal(attacker, skillData.value); break;
    case 'buff': applyBuff(attacker, 'attack', skillData.value); break;
    case 'debuff': applyBuff(target, 'attack', -skillData.value); break;
    case 'special': executeSpecialSkill(attacker, targetParty, skillData); break;
  }
}

function executeSpecialSkill(pName, attacker, target, actorObj, targetObj, activePt) {
  if (typeof specialSkillLogic !== 'undefined' && specialSkillLogic[attacker.id]) {
    specialSkillLogic[attacker.id](pName, attacker, target, actorObj, targetObj, activePt);
  } else {
    addLogMessage("⚠️ [" + pName + "] " + attacker.name + " の特殊スキルは未実装です。");
  }
}

// 画面HP表示更新
let testAttacker, testDefender;
function updateBattleUI() {
  if (!testAttacker || !testDefender) return;
  const atkNameEl = document.getElementById('attacker-name'); if (atkNameEl) atkNameEl.innerText = testAttacker.name;
  const atkHpEl = document.getElementById('attacker-hp'); if (atkHpEl) atkHpEl.innerText = testAttacker.currentHP;
  const defNameEl = document.getElementById('defender-name'); if (defNameEl) defNameEl.innerText = testDefender.name;
  const defHpEl = document.getElementById('defender-hp'); if (defHpEl) defHpEl.innerText = Math.max(0, testDefender.currentHP);
} 

fetch('cards.json')
  .then(response => response.json())
  .then(data => {
    data.forEach(card => {
      if (typeof initializeCardState === 'function') initializeCardState(card);
    });
    CARD_DATABASE = data;
    if (Array.isArray(CARD_DATABASE) && CARD_DATABASE.length >= 2) {
      testAttacker = CARD_DATABASE[0]; testDefender = CARD_DATABASE[1];
      if (typeof updateBattleUI === 'function') updateBattleUI();
    }
    console.log("思想家データ全 " + CARD_DATABASE.length + " 件の読み込みが完了！");
    initDebugMenu();
  })
  .catch(error => console.error("cards.json 読み込みエラー:", error));

let myRole = ""; let roomId = ""; let roomRef = null; let gameState = null; let currentLogs = []; let isCpuMode = false;

function addLogMessage(msg) {
  if (!window.currentLogs) window.currentLogs = [];
  window.currentLogs.push(msg);
  if (typeof gameState !== "undefined" && gameState) {
    if (!gameState.logs) gameState.logs = [];
    gameState.logs.push(msg);
  }
  const logElem = document.getElementById("logContainer") || document.getElementById("battleLog") || document.getElementById("log");
  if (logElem) {
    const p = document.createElement("p");
    p.textContent = msg; p.style.margin = "2px 0";
    logElem.appendChild(p); logElem.scrollTop = logElem.scrollHeight;
  }
}

function resetGame() {
  if (!isCpuMode && db && roomId) {
    db.ref("rooms/" + roomId).remove(); db.ref("rooms/" + roomId).off();
  }
  gameState = null; currentLogs = []; window.currentLogs = []; isCpuMode = false; myRole = ""; roomId = "";
  const setupArea = document.getElementById("setup-area"); const gameArea = document.getElementById("game-area");
  const actionArea = document.getElementById("action-area"); const logElem = document.getElementById("log");
  if (setupArea) setupArea.style.display = "block";
  if (gameArea) gameArea.style.display = "none";
  if (actionArea) actionArea.style.display = "none";
  if (logElem) logElem.innerHTML = "";
  const roomInput = document.getElementById("room-id-input"); if (roomInput) roomInput.value = "";
}

// === CPU対戦開始 ===
function startCpuBattle() {
  isCpuMode = true; myRole = "p1"; window.currentLogs = [];
  const shuffled = [...CARD_DATABASE].sort(() => 0.5 - Math.random());

  // ★ P1 (あなた) の生成とデバッグ上書き
  const p1Cards = shuffled.slice(0, 3).map(c => ({
    ...c, hp: c.hp ?? c.maxHp ?? 100, currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
    maxHp: c.maxHp ?? 100, atk: c.atk ?? 20, baseAtk: c.baseAtk ?? c.atk ?? 20, skillUsed: false, isFlipped: false
  }));
  if (window.debugAttackerCard) {
    const raw = window.debugAttackerCard; const baseHp = raw.hp ?? raw.maxHp ?? 100; const baseAtk = raw.atk ?? 20;
    p1Cards[0] = { ...raw, hp: baseHp, currentHP: raw.currentHP ?? baseHp, maxHp: raw.maxHp ?? baseHp, atk: baseAtk, baseAtk: raw.baseAtk ?? baseAtk, skillUsed: false, isFlipped: false };
  }

  // ★ P2 (CPU) の生成とデバッグ上書き
  const p2Cards = shuffled.slice(3, 6).map(c => ({
    ...c, hp: c.hp ?? c.maxHp ?? 100, currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
    maxHp: c.maxHp ?? 100, atk: c.atk ?? 20, baseAtk: c.baseAtk ?? c.atk ?? 20, skillUsed: false, isFlipped: false
  }));
  if (window.debugDefenderCard) {
    const raw = window.debugDefenderCard; const baseHp = raw.hp ?? raw.maxHp ?? 100; const baseAtk = raw.atk ?? 20;
    p2Cards[0] = { ...raw, hp: baseHp, currentHP: raw.currentHP ?? baseHp, maxHp: raw.maxHp ?? baseHp, atk: baseAtk, baseAtk: raw.baseAtk ?? baseAtk, skillUsed: false, isFlipped: false };
  }

  gameState = {
    turnCount: 1, p1: { name: "あなた", cards: p1Cards, cmd: null }, p2: { name: "CPU", cards: p2Cards, cmd: null },
    phase: "card_reveal", revealedCount: 0, logs: ["⚔ CPU対戦が開始されました！「カードをめくる」ボタンを押してください。"]
  };

  applySynergyBuff(gameState.p1.cards); applySynergyBuff(gameState.p2.cards);
  const setupArea = document.getElementById("setup-area"); const gameArea = document.getElementById("game-area");
  if (setupArea) setupArea.style.display = "none";
  if (gameArea) gameArea.style.display = "block";
  if (typeof updateBattleUI === "function") updateBattleUI();
  updateGameUI();
  if (typeof triggerBattleStartPassives === "function") triggerBattleStartPassives();
}

function joinRoom(role) {
  const inputElem = document.getElementById("room-id-input");
  let inputRoomId = inputElem ? inputElem.value.trim() : "";
  if (!inputRoomId) {
    if (role === 'p1') { inputRoomId = "100"; if (inputElem) inputElem.value = "100"; } 
    else { alert("部屋IDを入力してください（例: 333）"); return; }
  }
  roomId = inputRoomId; myRole = role; isCpuMode = false;
  if (typeof db === "undefined" || !db) { alert("Firebaseに接続されていません。"); return; }
  const roomRef = db.ref("rooms/" + roomId);

  if (role === 'p1') {
    const shuffled = [...CARD_DATABASE].sort(() => 0.5 - Math.random());
    const p1Cards = shuffled.slice(0, 3).map(c => ({
      ...c, hp: c.hp ?? c.maxHp ?? 100, currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
      maxHp: c.maxHp ?? 100, atk: c.atk ?? 20, skillUsed: false, isFlipped: false
    }));
    const p2Cards = shuffled.slice(3, 6).map(c => ({
      ...c, hp: c.hp ?? c.maxHp ?? 100, currentHP: c.currentHP ?? c.hp ?? c.maxHp ?? 100,
      maxHp: c.maxHp ?? 100, atk: c.atk ?? 20, skillUsed: false, isFlipped: false
    }));

    const newGameState = {
      phase: "waiting_p2", turnCount: 1, p1: { name: "P1(あなた)", cards: p1Cards, cmd: null }, p2: { name: "P2(待機中)", cards: p2Cards, cmd: null },
      revealedCount: 0, logs: ["部屋を作成しました (部屋ID: " + roomId + ")。P2の参加を待っています..."]
    };
    gameState = newGameState;
    applySynergyBuff(gameState.p1.cards); applySynergyBuff(gameState.p2.cards);
    
    roomRef.set(sanitizeObject(gameState), function(error) {
      if (error) { alert("部屋の作成に失敗しました。"); } 
      else {
        listenToRoom(roomId);
        const setupArea = document.getElementById("setup-area"); const gameArea = document.getElementById("game-area");
        if (setupArea) setupArea.style.display = "none";
        if (gameArea) gameArea.style.display = "block";
        updateGameUI();
      }
    });
  } else if (role === 'p2') {
    roomRef.once("value", function(snapshot) {
      const data = snapshot.val();
      if (data) {
        data.phase = "card_reveal";
        if (data.p2) data.p2.name = "P2(あなた)";
        if (data.p1) data.p1.name = "P1(相手)";
        data.logs = [...(data.logs || []), "⚔️ P2が参加しました！各自カードをめくってください。"];
        roomRef.update(sanitizeObject(data), function(error) {
          if (!error) {
            listenToRoom(roomId);
            const setupArea = document.getElementById("setup-area"); const gameArea = document.getElementById("game-area");
            if (setupArea) setupArea.style.display = "none";
            if (gameArea) gameArea.style.display = "block";
            updateGameUI();
          }
        });
      } else { alert("部屋ID 「" + roomId + "」 が存在しません。先にP1で部屋を作成してください。"); }
    });
  }
}

function revealNextCard() {
  if (!gameState || gameState.phase !== "card_reveal") return;
  const myData = gameState[myRole];
  if (!myData || !myData.cards) return;

  const unrevealedCard = myData.cards.find(c => !c.isFlipped);
  if (unrevealedCard) unrevealedCard.isFlipped = true;
  const allMyFlipped = myData.cards.every(c => c.isFlipped);

  if (isCpuMode) {
    if (allMyFlipped) {
      gameState.p2.cards.forEach(c => c.isFlipped = true);
      gameState.phase = "command_select";
      addLogMessage("⚔️ すべての思想家が登場しました！コマンドを選択してください。");
    }
    updateGameUI();
  } else {
    const enemyRole = myRole === "p1" ? "p2" : "p1";
    const enemyData = gameState[enemyRole];
    const allEnemyFlipped = enemyData && enemyData.cards ? enemyData.cards.every(c => c.isFlipped) : false;
    let updates = {};
    updates[`rooms/${roomId}/${myRole}/cards`] = sanitizeObject(myData.cards);

    if (allMyFlipped && allEnemyFlipped) {
      updates[`rooms/${roomId}/phase`] = "command_select";
      updates[`rooms/${roomId}/logs`] = [...(gameState.logs || []), "⚔️ お互いの準備が完了しました！コマンドを選択してください。"];
    } else if (allMyFlipped) {
      addLogMessage("⚔️ あなたの思想家が出揃いました！相手の準備を待っています...");
      updates[`rooms/${roomId}/logs`] = gameState.logs || [];
    }
    if (db && roomId) db.ref().update(updates);
  }
}

function sanitizeObject(obj) { return JSON.parse(JSON.stringify(obj, (key, value) => value === undefined ? null : value)); }

function listenToRoom(id) {
  if (isCpuMode) return;
  const roomRef = db ? db.ref("rooms/" + id) : null;
  if (!roomRef) return;

  db.ref("rooms/" + id).on("value", (snapshot) => {
    const data = snapshot.val();
    if (data) {
        gameState = data;
        if (!isCpuMode && gameState.phase === "command_select") {
            if (gameState.p1 && gameState.p1.cmd && gameState.p2 && gameState.p2.cmd) {
                if (myRole === "p1") {
                    processBattlePhase();
                    db.ref("rooms/" + id).set(sanitizeObject(gameState));
                }
            }
        }
        const hasP1Data = gameState.p1Team && gameState.p1Team.length > 0;
        const hasP2Data = gameState.p2Team && gameState.p2Team.length > 0;
        if (hasP1Data && hasP2Data) {
            const p1Alive = gameState.p1Team.some(c => (c.currentHP ?? c.hp) > 0);
            const p2Alive = gameState.p2Team.some(c => (c.currentHP ?? c.hp) > 0);
            if (!p1Alive || !p2Alive) {
                gameState.phase = "finished";
                if (!p1Alive && !p2Alive) addLogMessage("🤝 引き分け！両者のチームが全滅しました！");
                else if (!p2Alive) addLogMessage(isCpuMode ? "🎉 Victory！あなたの勝利です！" : "🎉 プレイヤー1 (P1) の勝利です！");
                else if (!p1Alive) addLogMessage(isCpuMode ? "💀 Defeat…敗北しました" : "🎉 プレイヤー2 (P2) の勝利です！");
                
                const commandInputs = document.getElementById("command-inputs");
                const resetArea = document.getElementById("reset-area");
                if (commandInputs) commandInputs.style.display = "none";
                if (resetArea) resetArea.style.display = "block";
                updateGameUI();
                return;
            }
        }
        updateGameUI();
    }else{ 
        if (!isCpuMode) {
            alert("ホストが部屋をリセットしました。タイトル画面に戻ります。");
            location.reload();
        }
    } 
  });
}

function updateGameUI() {
  const resetArea = document.getElementById("reset-area");
  if (resetArea) resetArea.style.display = (myRole === "p1" || isCpuMode) ? "block" : "none";
  if (!gameState) return;

  const myRoleElem = document.getElementById("my-role");
  if (myRoleElem && gameState.p1) myRoleElem.textContent = myRole === "p1" ? (gameState.p1.name || "あなた") : (gameState.p2.name || "あなた");

  const myCardsElem = document.getElementById("my-cards"); const enemyCardsElem = document.getElementById("enemy-cards");
  const myPlayerData = myRole === "p1" ? gameState.p1 : gameState.p2;
  const enemyPlayerData = myRole === "p1" ? gameState.p2 : gameState.p1;

  if (myCardsElem && myPlayerData && myPlayerData.cards) myCardsElem.innerHTML = myPlayerData.cards.map(c => renderCard(c, false)).join("");
  if (enemyCardsElem && enemyPlayerData && enemyPlayerData.cards) enemyCardsElem.innerHTML = enemyPlayerData.cards.map(c => renderCard(c, true)).join("");

  const actionArea = document.getElementById("action-area"); const waitMsg = document.getElementById("wait-msg"); const commandInputs = document.getElementById("command-inputs");
  if (actionArea) actionArea.style.display = "block";

  if (gameState.phase === "waiting_p2") {
    if (commandInputs) commandInputs.style.display = "none";
    if (waitMsg) { waitMsg.style.display = "block"; waitMsg.innerHTML = `<div style="font-size: 16px; color: #f1c40f;">⏳ 相手(P2)が部屋に入るのを待っています...<br><small>(部屋ID: ${roomId})</small></div>`; }
   } else if (gameState.phase === "card_reveal") {
    if (commandInputs) commandInputs.style.display = "none";
    if (waitMsg) {
      waitMsg.style.display = "block";
      const myFlippedCount = myPlayerData && myPlayerData.cards ? myPlayerData.cards.filter(c => c.isFlipped).length : 0;
      if (myFlippedCount < 3) {
        waitMsg.innerHTML = `<button class="cpu-btn" onclick="revealNextCard()" style="font-size: 16px; padding: 10px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 5px;">🃏 カードをめくる (${myFlippedCount} / 3)</button>`;
      } else { waitMsg.innerText = "相手の準備完了を待っています..."; }
    }
  } else if (gameState.phase === "command_select") {
    if (commandInputs) commandInputs.style.display = "block";
    if (waitMsg) waitMsg.style.display = "none";
    if (myPlayerData && myPlayerData.cards) updateSelectOptions(myPlayerData.cards);
  } else if (gameState.phase === "finished") {
    if (commandInputs) commandInputs.style.display = "none";
    if (myRole === "p1" || isCpuMode) { if (waitMsg) waitMsg.style.display = "none"; } 
    else { if (waitMsg) { waitMsg.style.display = "block"; waitMsg.innerHTML = `<div style="font-size: 15px; color: #f1c40f;">⏳ P1が部屋をリセットするのを待っています...</div>`; } }
  }

  const logElem = document.getElementById("log") || document.getElementById("logContainer") || document.getElementById("battleLog");
  if (logElem) {
    const logsToRender = (gameState && gameState.logs && gameState.logs.length > 0) ? gameState.logs : (window.currentLogs || []);
    logElem.innerHTML = "";
    logsToRender.forEach(msg => { const div = document.createElement("div"); div.textContent = msg; div.style.margin = "2px 0"; logElem.appendChild(div); });
    logElem.scrollTop = logElem.scrollHeight;
  }
}

function triggerBattleStartPassives() {
  if (!gameState) return;
  ["p1", "p2"].forEach(role => {
    const playerObj = gameState[role]; const enemyObj = gameState[role === "p1" ? "p2" : "p1"];
    if (playerObj && playerObj.cards) {
      playerObj.cards.forEach(card => {
        if (card.hp > 0 && typeof triggerPassive === "function") triggerPassive("onBattleStart", card, playerObj, enemyObj);
      });
    }
  });
}

function renderCard(c, isEnemy) {
  if (!c || !c.isFlipped) {
    return `<div class="card-container card-back" style="min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #2a2a2a; border: 2px solid #555; border-radius: 6px;"><div style="font-size: 36px; color: #e74c3c; font-weight: bold;">?</div></div>`;
  }
  const hpPercent = Math.max(0, (c.currentHP ?? c.hp ?? 100) / (c.maxHp ?? 100) * 100);
  const isDefeated = (c.currentHP ?? c.hp) <= 0;
  let rawImg = c.image || c.icon || c.img || '';
  if (rawImg && !rawImg.startsWith('http') && !rawImg.startsWith('images/')) rawImg = `images/${rawImg}`;

  return `
  <div class="card-container ${isDefeated ? 'card-defeated' : ''}" onclick="openModal('${c.id || c.name}')" style="box-sizing: border-box; padding: 0; border-radius: 6px; overflow: hidden; position: relative; background: #fff; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; height: 100%; min-height: 200px;">
      ${rawImg ? `<img src="${rawImg}" alt="${c.name}" style="width: 100%; height: auto; display: block; object-fit: cover;" onerror="this.style.display='none'">` : ''}
      <div style="background: rgba(0, 0, 0, 0.85); width: 100%; padding: 4px 6px; box-sizing: border-box; text-align: center;">
        <div style="font-weight: bold; font-size: 0.85em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;">${c.name}</div>
        <div style="background: #444; height: 8px; border-radius: 4px; overflow: hidden; margin: 0 auto 2px auto; width: 90%;">
          <div style="background: #2ecc71; width: ${hpPercent}%; height: 100%;"></div>
        </div>
        <div style="font-size: 0.75em; color: #fff; font-weight: bold;">${c.currentHP ?? c.hp} / ${c.maxHp ?? 100}</div>
      </div>
    </div>`;
}

function updateSelectOptions(myCards) {
  const atkSelect = document.getElementById("attacker-select");
  if (!atkSelect || !myCards) return;
  const currentAtkVal = atkSelect.value;
  atkSelect.innerHTML = myCards.map((c, i) => `<option value="${i}" ${c.hp === 0 ? 'disabled':''}>${c.name} (ATK:${c.atk}) ${c.skillUsed ? '[スキル済]':''}</option>`).join('');
  if (currentAtkVal !== "") atkSelect.value = currentAtkVal;
  updateSkillDisplay();
}

function updateSkillDisplay() {
  const myData = gameState ? gameState[myRole] : null; if (!myData) return;
  const atkIdx = document.getElementById("attacker-select").value || 0;
  const selectedCard = myData.cards[atkIdx];
  const skillBtn = document.getElementById("skill-btn"); const statusEl = document.getElementById("skill-used-status");

  if (selectedCard) {
    const actPt = selectedCard.activeVal ?? 0; const pasPt = selectedCard.passiveVal ?? 0;
    const actRate = Math.min(100, Math.floor((actPt / 50) * 100)); const pasRate = Math.min(100, Math.floor((pasPt / 50) * 100));
    document.getElementById("active-val").innerText = actPt; document.getElementById("active-rate").innerText = actRate;
    document.getElementById("skill-name").innerText = selectedCard.skillName || "-"; document.getElementById("skill-desc").innerText = selectedCard.skillDesc || "-";
    document.getElementById("passive-val").innerText = pasPt; document.getElementById("passive-rate").innerText = pasRate;
    document.getElementById("passive-name").innerText = selectedCard.passiveName || "-"; document.getElementById("passive-desc").innerText = selectedCard.passiveDesc || "-";

    if (actPt === 0) { skillBtn.disabled = true; skillBtn.title = "アクティブスキルポイントが0のため発動できません"; if (statusEl) statusEl.innerText = ""; } 
    else { skillBtn.disabled = false; skillBtn.title = ""; if (statusEl) statusEl.innerText = ""; }
  }
}

function submitCommand(type) {
  if (!gameState) return;
  let actorSelect = document.getElementById("attacker-select") || document.querySelector("#action-area select");
  if (!actorSelect) return;
  const actorIndex = parseInt(actorSelect.value, 10) || 0;
  const cmd = { type: type, attacker: actorIndex };

  if (isCpuMode) {
    gameState[myRole].cmd = cmd;
    generateCpuCommand();
    processBattlePhase();
  } else { db.ref("rooms/" + roomId + "/" + myRole + "/cmd").set(cmd); }
  updateGameUI();
}

function generateCpuCommand() {
  const aliveIndices = gameState.p2.cards.map((c, i) => ({ ...c, idx: i })).filter(c => c.hp > 0);
  if (aliveIndices.length === 0) return;
  const chosen = aliveIndices[Math.floor(Math.random() * aliveIndices.length)];
  const actPt = chosen.activeVal || 0;
  let type = "attack";
  if (actPt > 0 && !chosen.skillUsed && Math.random() < 0.5) type = "skill";
  gameState.p2.cmd = { type: type, attacker: chosen.idx };
}

function getRandomTarget(targetCards) {
  const aliveTargets = targetCards.map((c, i) => ({ ...c, originalIdx: i })).filter(c => c.hp > 0);
  if (aliveTargets.length === 0) return null;
  return aliveTargets[Math.floor(Math.random() * aliveTargets.length)].originalIdx;
}

function getAttributeMultiplier(atkType, defType) {
  if ((atkType === "源流" || atkType === "他者") && defType === "西洋") return 1.5;
  if (atkType === "西洋" && defType === "日本") return 1.5;
  if (atkType === "日本" && (defType === "源流" || defType === "他者")) return 1.5;
  return 1.0;
}

function processBattlePhase() {
  const p1Name = isCpuMode ? "あなた" : "P1"; const p2Name = isCpuMode ? "CPU" : "P2";
  addLogMessage("=== 第 " + gameState.turnCount + " ターン 結果発表！ ===");
  
  [gameState.p1, gameState.p2].forEach(pObj => {
    if (pObj && pObj.cards) {
      pObj.cards.forEach(card => {
        const hp = card.currentHP ?? card.hp ?? 0;
        if (hp > 0 && typeof triggerPassive === "function") triggerPassive("onTurnStart", card, pObj, pObj === gameState.p1 ? gameState.p2 : gameState.p1);
      });
    }
  });

  applyAction(p1Name, gameState.p1, gameState.p2, gameState.p1.cmd, gameState.p2.cmd);
  applyAction(p2Name, gameState.p2, gameState.p1, gameState.p2.cmd, gameState.p1.cmd);

  [gameState.p1, gameState.p2].forEach(pObj => {
    if (pObj && pObj.cards) {
      const enemyObj = pObj === gameState.p1 ? gameState.p2 : gameState.p1;
      pObj.cards.forEach(card => {
        const hp = card.currentHP ?? card.hp ?? 0;
        if (hp > 0 && typeof triggerPassive === "function") triggerPassive("onTurnEnd", card, pObj, enemyObj);
      });
    }
  });

  gameState.p1.cmd = null; gameState.p2.cmd = null;
  const p1Alive = gameState.p1.cards.some(c => (c.currentHP ?? c.hp ?? 0) > 0);
  const p2Alive = gameState.p2.cards.some(c => (c.currentHP ?? c.hp ?? 0) > 0);

  if (!p1Alive || !p2Alive) {
    gameState.phase = "finished";
    if (!p1Alive && !p2Alive) addLogMessage("🤝 引き分け！両者のチームが全滅しました！");
    else if (!p2Alive) addLogMessage(isCpuMode ? "🎉 Victory！ あなたの勝利です！" : "🎉 プレイヤー1 (P1) の勝利です！");
    else addLogMessage(isCpuMode ? "💀 Defeat... CPUの勝利です。" : "🎉 プレイヤー2 (P2) の勝利です！");

    const commandInputs = document.getElementById("command-inputs"); const resetArea = document.getElementById("reset-area");
    if (commandInputs) commandInputs.style.display = "none";
    if (resetArea) resetArea.style.display = "block";
    updateGameUI();
    return;
  }
  gameState.turnCount++;
  updateGameUI();
}

function executeDamage(pName, attacker, target, actorObj, targetObj, baseDmg, isSkill) {
  const currentHpVal = target.currentHP ?? target.hp ?? 0;
  if (!target || currentHpVal <= 0) return;
  const mult = getAttributeMultiplier(attacker.type, target.type);
  let finalDamage = Math.floor(baseDmg * mult);

  if (attacker.atkBuff) { finalDamage *= 2; attacker.atkBuff = false; addLogMessage("💨 " + attacker.name + " の攻撃力が2倍にアップしている！"); }
  if (target.defenseBuff) { finalDamage = Math.floor(finalDamage / 2); target.defenseBuff = false; addLogMessage("🌍 " + target.name + " は土の盾でダメージを半減した！"); }
  if (target.fixedDamageVal !== undefined && target.fixedDamageVal !== null) { finalDamage = target.fixedDamageVal; target.fixedDamageVal = null; addLogMessage("📐 " + target.name + " は「決定論」により、被ダメージが " + finalDamage + " に固定された！"); }

  if (typeof triggerPassive === "function") {
    const reducedDmg = triggerPassive("onTakeDamage", target, attacker, finalDamage);
    if (typeof reducedDmg === "number") finalDamage = reducedDmg;
  }

  let effText = mult > 1.0 ? " (弱点突いた！)" : "";
  const newHp = Math.max(0, currentHpVal - finalDamage);
  target.currentHP = newHp; target.hp = newHp;
  addLogMessage("⚔️ [" + pName + "] " + attacker.name + " の攻撃！ " + target.name + " に " + finalDamage + " のダメージ！" + effText);

  if (newHp === 0) {
    addLogMessage("💀 " + target.name + " は倒れた！");
    if (typeof triggerPassive === "function") triggerPassive("onDeath", target, targetObj, actorObj);
  }
}

function applyAction(pName, actorObj, targetObj, cmd, oppCmd) {
  if (!cmd || !actorObj || !actorObj.cards || !actorObj.cards[cmd.attacker]) return;
  const attacker = actorObj.cards[cmd.attacker]; const attackerHp = attacker.currentHP ?? attacker.hp ?? 0;
  if (attackerHp <= 0) return;

  if (attacker.isStunned) {
    addLogMessage(`💤 [${pName}] ${attacker.name} は罪を悔い改めており、行動できない！`);
    attacker.isStunned = false; return;
  }

  const tgtIdx = getRandomTarget(targetObj.cards);
  const target = tgtIdx !== null ? targetObj.cards[tgtIdx] : null;

  if (cmd.type === 'attack') {
    if (target) executeDamage(pName, attacker, target, actorObj, targetObj, attacker.atk, false);
    else addLogMessage("⚠️ [" + pName + "] 攻撃対象が存在しません。");
  } else {
    const activePt = attacker.activeVal || 0;
    if (activePt === 0) { addLogMessage("⚠️ [" + pName + "] " + attacker.name + " はスキルを発動できない！"); return; }
    const activeRate = Math.min(100, Math.floor((activePt / 50) * 100));
    if (Math.floor(Math.random() * 100) >= activeRate) { addLogMessage("🎲 [" + pName + "] " + attacker.name + " のスキル不発... (確率:" + activeRate + "%)"); return; }

    let isCanceledByFestinger = false;
    if (oppCmd && oppCmd.type === 'skill' && targetObj && targetObj.cards[oppCmd.attacker]) {
      const oppAttacker = targetObj.cards[oppCmd.attacker];
      if (oppAttacker.id === 'festinger' && (oppAttacker.currentHP ?? oppAttacker.hp ?? 0) > 0) {
        if (Math.floor(Math.random() * 100) < Math.min(100, Math.floor(((oppAttacker.activeVal || 0) / 50) * 100))) isCanceledByFestinger = true;
      }
    }

    if (isCanceledByFestinger) { addLogMessage("🚫 [" + pName + "] " + attacker.name + " のスキルはフェスティンガーにより無効化された！"); return; }
    addLogMessage("🔥 [" + pName + "] " + attacker.name + " のスキル「" + attacker.skillName + "」発動！");

    const sType = attacker.skillType || attacker.type || "special";
    switch (sType) {
      case "damage": if (target) executeDamage(pName, attacker, target, actorObj, targetObj, activePt * 2, true); break;
      case "debuff": if (target) { const reduced = Math.min(Math.floor(Math.random() * Math.max(1, Math.floor(activePt / 5))) + 1, target.atk); target.atk = Math.max(0, target.atk - reduced); addLogMessage(`🎲 ${target.name}のATKを${reduced}低下！`); } break;
      case "heal": actorObj.cards.forEach(c => { if ((c.currentHP ?? c.hp ?? 0) > 0) { c.currentHP = Math.min(c.maxHp || 100, (c.currentHP ?? c.hp) + activePt); c.hp = c.currentHP; } }); addLogMessage(`✨ 味方全員のHPが${activePt}回復！`); break;
      case "buff": const buffAmt = Math.max(1, Math.floor(activePt / 5)); actorObj.cards.forEach(c => { if ((c.currentHP ?? c.hp ?? 0) > 0) c.atk += buffAmt; }); addLogMessage(`🔥 味方全員のATKが+${buffAmt}上昇！`); break;
      case "cancel": addLogMessage("🛡️ このターンの相手スキルを無効化！"); break;
      case "special": default: executeSpecialSkill(pName, attacker, target, actorObj, targetObj, activePt); break;
    }
  }
}

function applySynergyBuff(cards) {
  if (!cards || !Array.isArray(cards)) return;
  const tagCounts = {}; const tagToCards = {};
  cards.forEach(card => {
    if (!card.synergyTags) return;
    const tags = Array.isArray(card.synergyTags) ? card.synergyTags : card.synergyTags.split(',').map(t => t.trim());
    tags.forEach(tag => {
      if (tag === "男性" || !tag) return;
      tagCounts[tag] = (tagCounts[tag] || 0) + 1;
      if (!tagToCards[tag]) tagToCards[tag] = []; tagToCards[tag].push(card.name);
    });
  });
  Object.keys(tagCounts).forEach(tag => {
    if (tagCounts[tag] >= 2) addLogMessage(`🤝 絆効果「${tag}」発動！ (${tagToCards[tag].join(" × ")}) チームのHPが1.2倍に強化！`);
  });
  cards.forEach(card => {
    if (!card.synergyTags) return;
    const tags = Array.isArray(card.synergyTags) ? card.synergyTags : card.synergyTags.split(',').map(t => t.trim());
    if (tags.some(tag => tag !== "男性" && tagCounts[tag] >= 2) && !card._synergyApplied) {
      const boostedHp = Math.round((card.maxHp || card.hp || 60) * 1.2);
      card.maxHp = boostedHp; card.hp = boostedHp; card.currentHP = boostedHp; card._synergyApplied = true;
    }
  });
}

function openModal(cardId) {
  if (!cardId) return;
  const card = CARD_DATABASE.find(c => c.id === cardId || c.name === cardId);
  if (!card) return;
  let rawImg = card.image || card.icon || card.img || '';
  if (rawImg && !rawImg.startsWith('http') && !rawImg.startsWith('images/')) rawImg = `images/${rawImg}`;

  document.getElementById("modal-img").src = rawImg || "https://via.placeholder.com/300x180?text=No+Image";
  document.getElementById("modal-title").innerText = card.name || "不明";
  document.getElementById("modal-rank").innerText = card.rank ? `Rank: ${card.rank}` : "";
  document.getElementById("modal-type").innerText = card.type ? `属性: ${card.type}` : "";
  document.getElementById("modal-active-val").innerText = card.activeVal ?? card.activePt ?? 0;
  document.getElementById("modal-skill-name").innerText = card.skillName || "-";
  document.getElementById("modal-skill-desc").innerText = card.skillDesc || "-";
  document.getElementById("modal-passive-val").innerText = card.passiveVal ?? card.passivePt ?? 0;
  document.getElementById("modal-passive-name").innerText = card.passiveName || "-";
  document.getElementById("modal-passive-desc").innerText = card.passiveDesc || "-";
  document.getElementById("modal-tags").innerText = Array.isArray(card.synergyTags) ? card.synergyTags.join(" / ") : (card.synergyTags || "なし");
  document.getElementById("card-modal").style.display = "flex";
}

function closeModal() { document.getElementById("card-modal").style.display = "none"; }
</script>
</body>
</html>
