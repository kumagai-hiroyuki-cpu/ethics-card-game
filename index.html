<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倫理 思想家カードバトル (3vs3)</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 10px; margin: 0; user-select: none; }
    h1 { text-align: center; color: #f39c12; margin: 10px 0; font-size: 1.4em; }
    
    .room-setup { background: #2c3e50; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
    .status-msg { font-weight: bold; color: #1abc9c; margin: 10px 0; }
    
    .battle-field { display: flex; flex-direction: column; gap: 15px; max-width: 900px; margin: 0 auto; }
    .player-board { background: #2a2a2a; padding: 10px; border-radius: 10px; border: 2px solid #444; }
    .board-title { margin: 0 0 10px 0; font-size: 1em; display: flex; justify-content: space-between; }
    
    .card-list { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .card-container { width: 30%; max-width: 140px; background: #333; border-radius: 6px; overflow: hidden; border: 2px solid #555; cursor: pointer; position: relative; transition: transform 0.1s; }
    .card-container:active { transform: scale(0.95); }
    .card-container.defeated { opacity: 0.3; filter: grayscale(100%); pointer-events: none; }
    
    .card-image { width: 100%; height: 140px; object-fit: cover; display: block; background: #000; }
    .card-info { padding: 5px; background: rgba(0,0,0,0.8); }
    .card-name { font-size: 0.8em; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f1c40f; text-align: center; }
    
    .hp-bar { background: #555; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 4px; position: relative; }
    .hp-fill { background: #2ecc71; height: 100%; transition: width 0.3s; }
    .hp-text { position: absolute; width: 100%; text-align: center; font-size: 9px; line-height: 12px; top: 0; left: 0; color: #fff; font-weight: bold; }
    
    .controls { background: #2c3e50; padding: 12px; border-radius: 8px; text-align: center; margin-top: 15px; max-width: 900px; margin-left: auto; margin-right: auto; }
    .skill-box { background: #1a252f; border: 1px solid #1abc9c; border-radius: 6px; padding: 8px; margin: 8px 0; font-size: 0.85em; text-align: left; }
    .skill-title { color: #f39c12; font-weight: bold; margin-bottom: 2px; }
    .skill-desc { color: #ecf0f1; font-size: 0.8em; }

    button { background: #e67e22; color: #fff; border: none; padding: 8px 16px; font-size: 14px; border-radius: 4px; cursor: pointer; margin: 4px; font-weight: bold; }
    button:disabled { background: #7f8c8d; }
    select { padding: 6px; font-size: 13px; border-radius: 4px; margin-bottom: 6px; }

    .log-window { background: #000; border: 1px solid #444; padding: 8px; height: 100px; overflow-y: scroll; font-family: monospace; font-size: 0.8em; margin-top: 10px; max-width: 900px; margin-left: auto; margin-right: auto; }

    /* モーダル (カード拡大表示) */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    .modal-card { background: #2c3e50; border: 2px solid #f1c40f; border-radius: 10px; width: 80%; max-width: 280px; padding: 15px; text-align: center; }
    .modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
    .modal-title { font-size: 1.2em; color: #f1c40f; font-weight: bold; margin: 10px 0 5px 0; }
    .modal-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #e67e22; font-size: 0.8em; margin-bottom: 8px; font-weight: bold; }
    .modal-detail { font-size: 0.85em; text-align: left; background: #1a252f; padding: 8px; border-radius: 6px; margin-top: 8px; }
  </style>

  <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<h1>📜 倫理 思想家カードバトル (3vs3)</h1>

<div class="room-setup" id="setup-area">
  <input type="text" id="room-id-input" placeholder="部屋ID (例: 333)" style="padding: 6px; font-size: 14px;">
  <button onclick="joinRoom('p1')">部屋を作る (P1)</button>
  <button onclick="joinRoom('p2')">部屋に入る (P2)</button>
  <div id="connection-status" class="status-msg"></div>
</div>

<div class="battle-field" id="game-area" style="display:none;">
  <div class="player-board" id="enemy-board">
    <div class="board-title"><span>⚔️ 相手チーム</span></div>
    <div id="enemy-cards" class="card-list"></div>
  </div>
  <div class="player-board" id="my-board">
    <div class="board-title"><span>🛡️ あなた (<span id="my-role"></span>)</span></div>
    <div id="my-cards" class="card-list"></div>
  </div>
</div>

<div class="controls" id="action-area" style="display:none;">
  <div id="wait-msg" class="status-msg" style="font-size: 0.9em;">コマンドを選択してください</div>
  <div id="command-inputs">
    行動する思想家: <select id="attacker-select" onchange="updateSkillDisplay()"></select><br>
    攻撃ターゲット: <select id="target-select"></select><br>
    
    <!-- スキル内容表示エリア -->
    <div class="skill-box">
      <div class="skill-title">✨ スキル: <span id="skill-name">-</span></div>
      <div class="skill-desc" id="skill-desc">思想家を選択すると効果が表示されます</div>
    </div>

    <button onclick="submitCommand('attack')">通常攻撃</button>
    <button onclick="submitCommand('skill')">スキル発動</button>
  </div>
</div>

<div id="log" class="log-window"></div>

<!-- カード拡大モーダル -->
<div class="modal-overlay" id="card-modal" onclick="closeModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <img id="modal-img" class="modal-img" src="">
    <div id="modal-title" class="modal-title"></div>
    <div>
      <span id="modal-rank" class="modal-badge"></span>
      <span id="modal-type" class="modal-badge" style="background:#3498db;"></span>
    </div>
    <div class="modal-detail">
      <strong>【スキル】</strong><span id="modal-skill-name"></span><br>
      <span id="modal-skill-desc" style="color:#bdc3c7;"></span>
    </div>
    <button onclick="closeModal()" style="margin-top:12px;">閉じる</button>
  </div>
</div>

<script>
// === Firebase接続設定 ===
const firebaseConfig = {
  apiKey: "AIzaSyCFr2e2VVWPV8JIf9cIRUh94fLxGFpNR1w",
  authDomain: "ethics-card-game-4598a.firebaseapp.com",
  databaseURL: "https://ethics-card-game-4598a-default-rtdb.firebaseio.com",
  projectId: "ethics-card-game-4598a",
  storageBucket: "ethics-card-game-4598a.firebasestorage.app",
  messagingSenderId: "1094270378260",
  appId: "1:1094270378260:web:aef75b9c4108f2bd472201",
  measurementId: "G-R8SYD17150"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// === テスト用 6人の思想家データ（属性・スキル追加） ===
const CARD_DATABASE = [
  { id: "socrates", name: "ソクラテス", rank: "S", type: "源流", maxHp: 100, atk: 12, skillName: "無知の知", skillDesc: "相手に18の固定ダメージを与える", image: "images/socrates.jpg" },
  { id: "kant", name: "カント", rank: "S", type: "西洋", maxHp: 100, atk: 12, skillName: "定言命法", skillDesc: "相手に18の固定ダメージを与える", image: "images/kant.jpg" },
  { id: "watsuji", name: "和辻哲郎", rank: "S", type: "日本", maxHp: 100, atk: 12, skillName: "間柄的存在", skillDesc: "相手に18の固定ダメージを与える", image: "images/watsuji.jpg" },
  { id: "festinger", name: "フェスティンガー", rank: "C", type: "他者", maxHp: 50, atk: 6, skillName: "認知的不協和", skillDesc: "相手に10の固定ダメージを与える", image: "images/festinger.jpg" },[cite: 1]
  { id: "erikson", name: "エリクソン", rank: "A", type: "他者", maxHp: 80, atk: 9, skillName: "アイデンティティ", skillDesc: "相手に14の固定ダメージを与える", image: "images/erikson.jpg" },[cite: 1]
  { id: "heraclitus", name: "ヘラクレイトス", rank: "C", type: "源流", maxHp: 50, atk: 6, skillName: "万物は流転する", skillDesc: "相手に10の固定ダメージを与える", image: "images/heraclitus.jpg" }[cite: 1]
];

let myRole = "";
let roomId = "";
let roomRef = null;
let gameState = null;

function log(msg) {
  const l = document.getElementById("log");
  l.innerHTML = `<div>・${msg}</div>` + l.innerHTML;
}

function joinRoom(role) {
  roomId = document.getElementById("room-id-input").value;
  if (!roomId) return alert("部屋IDを入力してください！");
  
  myRole = role;
  roomRef = db.ref("rooms/" + roomId);

  if (role === 'p1') {
    const shuffled = [...CARD_DATABASE].sort(() => 0.5 - Math.random());
    const initialState = {
      turnCount: 1,
      p1: { cards: shuffled.slice(0, 3).map(c=>({...c, hp:c.maxHp})), cmd: null },
      p2: { cards: shuffled.slice(3, 6).map(c=>({...c, hp:c.maxHp})), cmd: null },
      phase: "waiting_p2"
    };
    roomRef.set(initialState);
    document.getElementById("connection-status").innerText = "P2の接続を待っています...";
  } else {
    document.getElementById("connection-status").innerText = "接続中...";
  }

  roomRef.on("value", (snapshot) => {
    gameState = snapshot.val();
    if (!gameState) return;
    updateGameUI();
  });
}

function updateGameUI() {
  if (gameState.phase === "waiting_p2" && myRole === "p2") {
    roomRef.update({ phase: "command_select" });
  }

  if (gameState.phase !== "waiting_p2") {
    document.getElementById("setup-area").style.display = "none";
    document.getElementById("game-area").style.display = "flex";
    document.getElementById("action-area").style.display = "block";
  }

  document.getElementById("my-role").innerText = myRole.toUpperCase();
  
  const myData = gameState[myRole];
  const enemyData = gameState[myRole === "p1" ? "p2" : "p1"];

  renderCards("my-cards", myData.cards);
  renderCards("enemy-cards", enemyData.cards);

  updateSelectOptions(myData.cards, enemyData.cards);

  if (myData.cmd) {
    document.getElementById("command-inputs").style.display = "none";
    document.getElementById("wait-msg").innerText = "⏳ 相手のコマンド決定を待っています...";
  } else {
    document.getElementById("command-inputs").style.display = "block";
    document.getElementById("wait-msg").innerText = "⚔️ コマンドを選択してください";
  }

  if (gameState.p1.cmd && gameState.p2.cmd && myRole === "p1") {
    processBattlePhase();
  }
}

function renderCards(containerId, cards) {
  document.getElementById(containerId).innerHTML = cards.map((c, i) => {
    const hpPercent = Math.max(0, (c.hp / c.maxHp) * 100);
    return `
      <div class="card-container ${c.hp === 0 ? 'defeated' : ''}" onclick="openModal('${c.id}')">
        <img src="${c.image}" class="card-image" alt="${c.name}" onerror="this.src='https://via.placeholder.com/140x140?text=No+Image';">
        <div class="card-info">
          <div class="card-name">${c.name}</div>
          <div class="hp-bar">
            <div class="hp-fill" style="width: ${hpPercent}%;"></div>
            <div class="hp-text">${c.hp}/${c.maxHp}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function updateSelectOptions(myCards, enemyCards) {
  const atkSelect = document.getElementById("attacker-select");
  const tgtSelect = document.getElementById("target-select");
  
  const currentAtkVal = atkSelect.value;
  const currentTgtVal = tgtSelect.value;

  atkSelect.innerHTML = myCards
    .map((c, i) => `<option value="${i}" ${c.hp === 0 ? 'disabled':''}>${c.name} (HP:${c.hp})</option>`).join('');
  tgtSelect.innerHTML = enemyCards
    .map((c, i) => `<option value="${i}" ${c.hp === 0 ? 'disabled':''}>${c.name} (HP:${c.hp})</option>`).join('');

  if (currentAtkVal !== "") atkSelect.value = currentAtkVal;
  if (currentTgtVal !== "") tgtSelect.value = currentTgtVal;

  updateSkillDisplay();
}

function updateSkillDisplay() {
  const myData = gameState ? gameState[myRole] : null;
  if (!myData) return;

  const atkIdx = document.getElementById("attacker-select").value || 0;
  const selectedCard = myData.cards[atkIdx];

  if (selectedCard) {
    document.getElementById("skill-name").innerText = selectedCard.skillName;
    document.getElementById("skill-desc").innerText = selectedCard.skillDesc;
  }
}

function submitCommand(type) {
  const atkIdx = document.getElementById("attacker-select").value;
  const tgtIdx = document.getElementById("target-select").value;
  
  const cmdData = { type: type, attacker: parseInt(atkIdx), target: parseInt(tgtIdx) };
  roomRef.child(`${myRole}/cmd`).set(cmdData);
}

// === 相性計算関数 ===
function getAttributeMultiplier(atkType, defType) {
  // 源流・他者 ➔ 西洋 に強い
  if ((atkType === "源流" || atkType === "他者") && defType === "西洋") return 1.5;
  // 西洋 ➔ 日本 に強い
  if (atkType === "西洋" && defType === "日本") return 1.5;
  // 日本 ➔ 源流・他者 に強い
  if (atkType === "日本" && (defType === "源流" || defType === "他者")) return 1.5;
  
  return 1.0; // 通常
}

function processBattlePhase() {
  log(`=== 第 ${gameState.turnCount} ターン 結果発表！ ===`);
  
  applyAction("P1", gameState.p1, gameState.p2, gameState.p1.cmd);
  applyAction("P2", gameState.p2, gameState.p1, gameState.p2.cmd);

  gameState.turnCount++;
  gameState.p1.cmd = null;
  gameState.p2.cmd = null;
  gameState.phase = "command_select";

  roomRef.set(gameState);
}

function applyAction(pName, actorObj, targetObj, cmd) {
  const attacker = actorObj.cards[cmd.attacker];
  const target = targetObj.cards[cmd.target];

  if (attacker.hp <= 0) return;

  const mult = getAttributeMultiplier(attacker.type, target.type);
  const effText = mult > 1.0 ? " (弱点を突いた！)" : "";

  if (cmd.type === 'attack') {
    const damage = Math.floor(attacker.atk * mult);
    target.hp = Math.max(0, target.hp - damage);
    log(`💥 [${pName}] ${attacker.name}(${attacker.type}) の攻撃！ ${target.name}(${target.type}) に ${damage} ダメージ！${effText}`);
  } else {
    // スキル攻撃（スキル基本値15）
    const damage = Math.floor(15 * mult);
    target.hp = Math.max(0, target.hp - damage);
    log(`🔥 [${pName}] ${attacker.name} のスキル「${attacker.skillName}」！ ${target.name} に ${damage} ダメージ！${effText}`);
  }

  if (target.hp === 0) log(`☠️ ${target.name} は論破された！`);
}

// === カード拡大モーダル制御 ===
function openModal(cardId) {
  const card = CARD_DATABASE.find(c => c.id === cardId);
  if (!card) return;

  document.getElementById("modal-img").src = card.image;
  document.getElementById("modal-title").innerText = card.name;
  document.getElementById("modal-rank").innerText = "ランク: " + card.rank;
  document.getElementById("modal-type").innerText = "タイプ: " + card.type;
  document.getElementById("modal-skill-name").innerText = card.skillName;
  document.getElementById("modal-skill-desc").innerText = card.skillDesc;

  document.getElementById("card-modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("card-modal").style.display = "none";
}
</script>
</body>
</html>
