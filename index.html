<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倫理 思想家カードバトル (3vs3)</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 10px; margin: 0; user-select: none; }
    h1 { text-align: center; color: #f39c12; margin: 10px 0; font-size: 1.4em; }
    
    .room-setup { background: #2c3e50; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
    .status-msg { font-weight: bold; color: #1abc9c; margin: 10px 0; }
    
    .battle-field { display: flex; flex-direction: column; gap: 15px; max-width: 900px; margin: 0 auto; }
    .player-board { background: #2a2a2a; padding: 10px; border-radius: 10px; border: 2px solid #444; }
    .board-title { margin: 0 0 10px 0; font-size: 1em; display: flex; justify-content: space-between; }
    
    .card-list { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .card-container { width: 30%; max-width: 140px; background: #333; border-radius: 6px; overflow: hidden; border: 2px solid #555; cursor: pointer; position: relative; transition: transform 0.1s; }
    .card-container:active { transform: scale(0.95); }
    .card-container.defeated { opacity: 0.3; filter: grayscale(100%); pointer-events: none; }
    .card-container.synergy-active { border: 2px solid #f1c40f; box-shadow: 0 0 8px #f1c40f; }
    
    .card-image { width: 100%; height: 140px; object-fit: cover; display: block; background: #000; }
    .card-info { padding: 5px; background: rgba(0,0,0,0.8); }
    .card-name { font-size: 0.8em; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f1c40f; text-align: center; }
    
    .hp-bar { background: #555; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 4px; position: relative; }
    .hp-fill { background: #2ecc71; height: 100%; transition: width 0.3s; }
    .hp-text { position: absolute; width: 100%; text-align: center; font-size: 9px; line-height: 12px; top: 0; left: 0; color: #fff; font-weight: bold; }
    
    .controls { background: #2c3e50; padding: 12px; border-radius: 8px; text-align: center; margin-top: 15px; max-width: 900px; margin-left: auto; margin-right: auto; }
    .skill-box { background: #1a252f; border: 1px solid #1abc9c; border-radius: 6px; padding: 8px; margin: 8px 0; font-size: 0.85em; text-align: left; }
    .skill-title { color: #f39c12; font-weight: bold; margin-bottom: 2px; }
    .skill-desc { color: #ecf0f1; font-size: 0.8em; }

    button { background: #e67e22; color: #fff; border: none; padding: 8px 16px; font-size: 14px; border-radius: 4px; cursor: pointer; margin: 4px; font-weight: bold; }
    button:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.6; }
    select { padding: 6px; font-size: 13px; border-radius: 4px; margin-bottom: 6px; }

    .log-window { background: #000; border: 1px solid #444; padding: 8px; height: 140px; overflow-y: scroll; font-family: monospace; font-size: 0.8em; margin-top: 10px; max-width: 900px; margin-left: auto; margin-right: auto; }

    /* モーダル (カード拡大表示) */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    .modal-card { background: #2c3e50; border: 2px solid #f1c40f; border-radius: 10px; width: 85%; max-width: 300px; padding: 15px; text-align: center; }
    .modal-img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; }
    .modal-title { font-size: 1.2em; color: #f1c40f; font-weight: bold; margin: 8px 0 4px 0; }
    .modal-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #e67e22; font-size: 0.8em; margin-bottom: 6px; font-weight: bold; }
    .modal-detail { font-size: 0.8em; text-align: left; background: #1a252f; padding: 8px; border-radius: 6px; margin-top: 6px; }
  </style>

  <!-- Firebase SDK (安定版v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<h1>📜 倫理 思想家カードバトル (3vs3)</h1>

<div class="room-setup" id="setup-area">
  <input type="text" id="room-id-input" placeholder="部屋ID (例: 333)" style="padding: 6px; font-size: 14px;">
  <button onclick="joinRoom('p1')">部屋を作る (P1)</button>
  <button onclick="joinRoom('p2')">部屋に入る (P2)</button>
  <div id="connection-status" class="status-msg"></div>
</div>

<div class="battle-field" id="game-area" style="display:none;">
  <div class="player-board" id="enemy-board">
    <div class="board-title"><span>⚔️ 相手チーム</span></div>
    <div id="enemy-cards" class="card-list"></div>
  </div>
  <div class="player-board" id="my-board">
    <div class="board-title"><span>🛡️ あなた (<span id="my-role"></span>)</span></div>
    <div id="my-cards" class="card-list"></div>
  </div>
</div>

<div class="controls" id="action-area" style="display:none;">
  <div id="wait-msg" class="status-msg" style="font-size: 0.9em;">コマンドを選択してください</div>
  <div id="command-inputs">
    行動する思想家: <select id="attacker-select" onchange="updateSkillDisplay()"></select><br>
    <span style="font-size:0.8em; color:#bdc3c7;">※攻撃ターゲットは自動でランダムに選ばれます</span><br>
    
    <!-- スキル内容表示エリア -->
    <div class="skill-box">
      <div class="skill-title">✨ アクティブ [Pt:<span id="active-val">0</span>]: <span id="skill-name">-</span> <span id="skill-used-status" style="color:#e74c3c;"></span></div>
      <div class="skill-desc" id="skill-desc">-</div>
      <div class="skill-title" style="margin-top: 6px; color: #e74c3c;">🌀 パッシブ [Pt:<span id="passive-val">0</span>]: <span id="passive-name">-</span></div>
      <div class="skill-desc" id="passive-desc">-</div>
    </div>

    <button onclick="submitCommand('attack')">通常攻撃</button>
    <button id="skill-btn" onclick="submitCommand('skill')">スキル発動</button>
  </div>
</div>

<div id="log" class="log-window"></div>

<!-- カード拡大モーダル -->
<div class="modal-overlay" id="card-modal" onclick="closeModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <img id="modal-img" class="modal-img" src="">
    <div id="modal-title" class="modal-title"></div>
    <div>
      <span id="modal-rank" class="modal-badge"></span>
      <span id="modal-type" class="modal-badge" style="background:#3498db;"></span>
    </div>
    <div class="modal-detail">
      <strong style="color:#f39c12;">【アクティブスキル】</strong> (Pt:<span id="modal-active-val"></span>)<br>
      <span id="modal-skill-name" style="font-weight:bold;"></span>: <span id="modal-skill-desc" style="color:#bdc3c7;"></span>
      <hr style="border:0; border-top:1px solid #444; margin:6px 0;">
      <strong style="color:#e74c3c;">【パッシブスキル】</strong> (Pt:<span id="modal-passive-val"></span>)<br>
      <span id="modal-passive-name" style="font-weight:bold;"></span>: <span id="modal-passive-desc" style="color:#bdc3c7;"></span>
      <hr style="border:0; border-top:1px solid #444; margin:6px 0;">
      <strong style="color:#1abc9c;">【絆タグ】</strong><br>
      <span id="modal-tags" style="color:#1abc9c;"></span>
    </div>
    <button onclick="closeModal()" style="margin-top:12px;">閉じる</button>
  </div>
</div>

<script>
// === Firebase接続設定 ===
const firebaseConfig = {
  apiKey: "AIzaSyCFr2e2VVWPV8JIf9cIRUh94fLxGFpNR1w",
  authDomain: "ethics-card-game-4598a.firebaseapp.com",
  databaseURL: "https://ethics-card-game-4598a-default-rtdb.firebaseio.com",
  projectId: "ethics-card-game-4598a",
  storageBucket: "ethics-card-game-4598a.firebasestorage.app",
  messagingSenderId: "1094270378260",
  appId: "1:1094270378260:web:aef75b9c4108f2bd472201",
  measurementId: "G-R8SYD17150"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let CARD_DATABASE = [];

fetch('cards.json')
  .then(response => response.json())
  .then(data => {
    CARD_DATABASE = data;
    console.log("思想家データ全 " + CARD_DATABASE.length + " 件の読み込みが完了しました！");
  })
  .catch(error => console.error("cards.json 読み込みエラー:", error));

let myRole = "";
let roomId = "";
let roomRef = null;
let gameState = null;

function log(msg) {
  const l = document.getElementById("log");
  if (l) l.innerHTML = "<div>・" + msg + "</div>" + l.innerHTML;
}

// === 絆（シナジー）判定関数 ===
function applyTeamSynergy(cards, teamName) {
  const tagCounts = {};
  
  cards.forEach(c => {
    if (c.synergyTags && Array.isArray(c.synergyTags)) {
      c.synergyTags.forEach(tag => {
        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
      });
    }
  });

  cards.forEach(c => {
    c.hasSynergy = false;
    if (c.synergyTags && Array.isArray(c.synergyTags)) {
      c.synergyTags.forEach(tag => {
        if (tagCounts[tag] >= 2) {
          c.hasSynergy = true;
        }
      });
    }

    if (c.hasSynergy && !c.synergyApplied) {
      c.maxHp = Math.floor(c.maxHp * 1.2);
      c.hp = c.maxHp;
      c.synergyApplied = true;
      log("🤝 【絆発動】[" + teamName + "] " + c.name + " の絆効果発動！ HPが1.2倍(" + c.maxHp + ")に強化！");
    }
  });
}

function joinRoom(role) {
  const inputEl = document.getElementById("room-id-input");
  roomId = inputEl ? inputEl.value : "";
  if (!roomId) return alert("部屋IDを入力してください！");
  if (CARD_DATABASE.length === 0) return alert("カードデータを読み込み中です。少々お待ちください。");

  myRole = role;
  roomRef = db.ref("rooms/" + roomId);

  const statusEl = document.getElementById("connection-status");

  if (role === 'p1') {
    const shuffled = [...CARD_DATABASE].sort(() => 0.5 - Math.random());
    const p1Cards = shuffled.slice(0, 3).map(c=>({...c, hp:c.maxHp, baseAtk:c.atk, skillUsed: false}));
    const p2Cards = shuffled.slice(3, 6).map(c=>({...c, hp:c.maxHp, baseAtk:c.atk, skillUsed: false}));

    applyTeamSynergy(p1Cards, "P1");
    applyTeamSynergy(p2Cards, "P2");

    const initialState = {
      turnCount: 1,
      p1: { cards: p1Cards, cmd: null },
      p2: { cards: p2Cards, cmd: null },
      phase: "waiting_p2"
    };
    roomRef.set(initialState)
      .then(() => {
        if (statusEl) statusEl.innerText = "P2の接続を待っています...";
      })
      .catch((err) => {
        alert("部屋作成エラー: " + err.message);
      });
  } else {
    if (statusEl) statusEl.innerText = "接続中...";
  }

  roomRef.on("value", (snapshot) => {
    gameState = snapshot.val();
    if (!gameState) return;
    updateGameUI();
  });
}

function updateGameUI() {
  if (!gameState) return;

  if (gameState.phase === "waiting_p2" && myRole === "p2") {
    roomRef.update({ phase: "command_select" });
  }

  if (gameState.phase !== "waiting_p2") {
    document.getElementById("setup-area").style.display = "none";
    document.getElementById("game-area").style.display = "flex";
    document.getElementById("action-area").style.display = "block";
  }

  const roleEl = document.getElementById("my-role");
  if (roleEl) roleEl.innerText = myRole.toUpperCase();
  
  const myData = gameState[myRole];
  const enemyData = gameState[myRole === "p1" ? "p2" : "p1"];

  if (myData && enemyData) {
    renderCards("my-cards", myData.cards);
    renderCards("enemy-cards", enemyData.cards);

    updateSelectOptions(myData.cards);

    if (myData.cmd) {
      document.getElementById("command-inputs").style.display = "none";
      document.getElementById("wait-msg").innerText = "⏳ 相手のコマンド決定を待っています...";
    } else {
      document.getElementById("command-inputs").style.display = "block";
      document.getElementById("wait-msg").innerText = "⚔️ コマンドを選択してください";
    }

    if (gameState.p1.cmd && gameState.p2.cmd && myRole === "p1") {
      processBattlePhase();
    }
  }
}

function renderCards(containerId, cards) {
  const el = document.getElementById(containerId);
  if (!el || !cards) return;

  el.innerHTML = cards.map((c) => {
    const hpPercent = Math.max(0, (c.hp / c.maxHp) * 100);
    const synergyClass = c.hasSynergy ? 'synergy-active' : '';
    return `
      <div class="card-container ${c.hp === 0 ? 'defeated' : ''} ${synergyClass}" onclick="openModal('${c.id}')">
        <img src="${c.image}" class="card-image" alt="${c.name}" onerror="this.src='https://via.placeholder.com/140x140?text=No+Image';">
        <div class="card-info">
          <div class="card-name">${c.hasSynergy ? '🤝 ' : ''}${c.name}</div>
          <div class="hp-bar">
            <div class="hp-fill" style="width: ${hpPercent}%;"></div>
            <div class="hp-text">${c.hp}/${c.maxHp}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function updateSelectOptions(myCards) {
  const atkSelect = document.getElementById("attacker-select");
  if (!atkSelect || !myCards) return;

  const currentAtkVal = atkSelect.value;

  atkSelect.innerHTML = myCards
    .map((c, i) => `<option value="${i}" ${c.hp === 0 ? 'disabled':''}>${c.name} (ATK:${c.atk}) ${c.skillUsed ? '[スキル済]':''}</option>`).join('');

  if (currentAtkVal !== "") atkSelect.value = currentAtkVal;

  updateSkillDisplay();
}

function updateSkillDisplay() {
  const myData = gameState ? gameState[myRole] : null;
  if (!myData) return;

  const atkIdx = document.getElementById("attacker-select").value || 0;
  const selectedCard = myData.cards[atkIdx];
  const skillBtn = document.getElementById("skill-btn");
  const statusEl = document.getElementById("skill-used-status");

  if (selectedCard) {
    document.getElementById("active-val").innerText = selectedCard.activeVal ?? 0;
    document.getElementById("skill-name").innerText = selectedCard.skillName || "-";
    document.getElementById("skill-desc").innerText = selectedCard.skillDesc || "-";
    
    document.getElementById("passive-val").innerText = selectedCard.passiveVal ?? 0;
    document.getElementById("passive-name").innerText = selectedCard.passiveName || "-";
    document.getElementById("passive-desc").innerText = selectedCard.passiveDesc || "-";

    // activeVal === 0 または 既に1回スキル使用済みの場合はボタン無効化
    if (selectedCard.activeVal === 0) {
      skillBtn.disabled = true;
      skillBtn.title = "アクティブスキルポイントが0のため発動できません";
      if (statusEl) statusEl.innerText = "";
    } else if (selectedCard.skillUsed) {
      skillBtn.disabled = true;
      skillBtn.title = "アクティブスキルは1戦闘につき1回までです";
      if (statusEl) statusEl.innerText = "(1回のみ使用済み)";
    } else {
      skillBtn.disabled = false;
      skillBtn.title = "";
      if (statusEl) statusEl.innerText = "";
    }
  }
}

function submitCommand(type) {
  const atkIdx = document.getElementById("attacker-select").value;
  const cmdData = { type: type, attacker: parseInt(atkIdx) };
  roomRef.child(`${myRole}/cmd`).set(cmdData);
}

function getRandomTarget(targetCards) {
  const aliveTargets = targetCards.map((c, i) => ({ ...c, originalIdx: i })).filter(c => c.hp > 0);
  if (aliveTargets.length === 0) return null;
  const randIdx = Math.floor(Math.random() * aliveTargets.length);
  return aliveTargets[randIdx].originalIdx;
}

function getAttributeMultiplier(atkType, defType) {
  if ((atkType === "源流" || atkType === "他者") && defType === "西洋") return 1.5;
  if (atkType === "西洋" && defType === "日本") return 1.5;
  if (atkType === "日本" && (defType === "源流" || defType === "他者")) return 1.5;
  return 1.0;
}

function processBattlePhase() {
  log("=== 第 " + gameState.turnCount + " ターン 結果発表！ ===");
  
  applyTurnStartPassives(gameState.p1, gameState.turnCount);
  applyTurnStartPassives(gameState.p2, gameState.turnCount);

  applyAction("P1", gameState.p1, gameState.p2, gameState.p1.cmd, gameState.p2.cmd);
  applyAction("P2", gameState.p2, gameState.p1, gameState.p2.cmd, gameState.p1.cmd);

  applyTurnEndPassives("P1", gameState.p1);
  applyTurnEndPassives("P2", gameState.p2);

  gameState.turnCount++;
  gameState.p1.cmd = null;
  gameState.p2.cmd = null;
  gameState.phase = "command_select";

  roomRef.set(gameState);
}

function applyTurnStartPassives(playerObj, turn) {
  if (!playerObj || !playerObj.cards) return;
  playerObj.cards.forEach(c => {
    if (c.id === "erikson" && c.hp > 0 && c.passiveVal > 0) {
      const bonusAtk = (turn * (turn + 1)) / 2;
      c.atk = Math.min(21, c.baseAtk + bonusAtk);
    }
  });
}

function applyTurnEndPassives(pName, playerObj) {
  if (!playerObj || !playerObj.cards) return;
  playerObj.cards.forEach(c => {
    if (c.id === "heraclitus" && c.hp > 0 && c.hp < c.maxHp && c.passiveVal > 0) {
      const healAmt = c.passiveVal;
      c.hp = Math.min(c.maxHp, c.hp + healAmt);
      log("🌀 [" + pName + "] ヘラクレイトスの「万物の流転」！ HPが " + healAmt + " 回復！");
    }
  });
}

function applyAction(pName, actorObj, targetObj, cmd, oppCmd) {
  if (!cmd || !actorObj || !actorObj.cards || !actorObj.cards[cmd.attacker]) return;

  const attacker = actorObj.cards[cmd.attacker];
  if (attacker.hp <= 0) return;

  const tgtIdx = getRandomTarget(targetObj.cards);
  const target = tgtIdx !== null ? targetObj.cards[tgtIdx] : null;

  if (cmd.type === 'attack') {
    if (target && target.hp > 0) {
      executeDamage(pName, attacker, target, actorObj, targetObj, attacker.atk, false);
    }
  } else {
    // 1戦闘中1回のみ制限フラグチェック
    if (attacker.activeVal === 0 || attacker.skillUsed) {
      log("⚠️ [" + pName + "] " + attacker.name + " はスキルを発動できない！");
      return;
    }

    // スキル使用済みフラグをオンに設定
    attacker.skillUsed = true;

    if (oppCmd && oppCmd.type === 'skill' && targetObj && targetObj.cards[oppCmd.attacker]) {
      const oppAttacker = targetObj.cards[oppCmd.attacker];
      if (oppAttacker.id === 'festinger' && oppAttacker.hp > 0) {
        log("🚫 [" + pName + "] " + attacker.name + " のスキルはフェスティンガーの「認知的不協和」により無効化された！");
        return;
      }
    }

    log("🔥 [" + pName + "] " + attacker.name + " のスキル「" + attacker.skillName + "」！(1回限り使用済)");

    switch (attacker.id) {
      case "socrates":
        if (target) {
          const stealAmt = Math.min(attacker.activeVal, target.atk);
          target.atk -= stealAmt;
          attacker.atk += stealAmt;
          log("✨ " + attacker.name + " は " + target.name + " から能力を" + stealAmt + "奪った！ (自分のATK:" + attacker.atk + " / 相手ATK:" + target.atk + ")");
        }
        break;

      case "kant":
        if (target) executeDamage(pName, attacker, target, actorObj, targetObj, attacker.activeVal * 2, true);
        break;

      case "watsuji":
        actorObj.cards.forEach(c => { if(c.atk < c.baseAtk) c.atk = c.baseAtk; });
        if (targetObj) targetObj.cards.forEach(c => { if(c.atk > c.baseAtk) c.atk = c.baseAtk; });

        let totalStolenHp = 0;
        let totalStolenAtk = 0;

        if (targetObj) {
          targetObj.cards.forEach(tCard => {
            if (tCard.hp > 0) {
              const cutHp = Math.floor(tCard.hp / 2);
              const cutAtk = Math.floor(tCard.atk / 2);

              tCard.hp -= cutHp;
              tCard.atk -= cutAtk;

              totalStolenHp += cutHp;
              totalStolenAtk += cutAtk;
            }
          });
        }

        attacker.maxHp += totalStolenHp;
        attacker.hp += totalStolenHp;
        attacker.atk += totalStolenAtk;

        log("🌾 和辻哲郎の「風土改変」発動！ 両チームの状態異常を解除し、敵全体の能力を半減！");
        log("✨ 敵から奪った HP:" + totalStolenHp + " / ATK:" + totalStolenAtk + " を和辻哲郎に加算！");
        break;

      case "festinger":
        log("✨ フェスティンガーは「認知的不協和」を展開！ このターンの敵スキルを牽制！");
        break;

      case "erikson":
        if (target) {
          const dice = Math.floor(Math.random() * 6);
          const reduced = Math.min(dice, target.atk);
          target.atk -= reduced;
          log("🎲 サイコロの目は [" + dice + "]！ " + target.name + " の攻撃力を " + reduced + " 低下させた！(残ATK:" + target.atk + ")");
        }
        break;

      case "heraclitus":
        if (targetObj) {
          const dmg = attacker.activeVal;
          targetObj.cards.forEach(tCard => {
            if (tCard.hp > 0) {
              executeDamage(pName, attacker, tCard, actorObj, targetObj, dmg, true);
            }
          });
        }
        break;
    }
  }

  if (attacker.passiveVal > 0) {
    if (attacker.id === "kant" || attacker.id === "festinger") {
      const healAmt = attacker.passiveVal;
      actorObj.cards.forEach(c => { if(c.hp > 0) c.hp = Math.min(c.maxHp, c.hp + healAmt); });
      log("🌀 [" + pName + "] " + attacker.name + " の「" + attacker.passiveName + "」！ 味方全員のHPが " + healAmt + " 回復！");
    }
  }
}

function executeDamage(pName, attacker, target, actorObj, targetObj, baseDmg, isSkill) {
  if (!target || target.hp <= 0) return;

  const mult = getAttributeMultiplier(attacker.type, target.type);
  let finalDamage = Math.floor(baseDmg * mult);
  let effText = mult > 1.0 ? " (弱点突いた！)" : "";

  let isReflected = false;
  if (target.id === "watsuji" && (attacker.rank === "B" || attacker.rank === "C")) {
    isReflected = true;
  } else if (target.type === "日本" && target.id !== "watsuji" && attacker.rank === "C") {
    const hasWatsuji = targetObj ? targetObj.cards.some(c => c.id === "watsuji" && c.hp > 0) : false;
    if (hasWatsuji) isReflected = true;
  }

  if (isReflected) {
    attacker.hp = Math.max(0, attacker.hp - finalDamage);
    log("🌀 " + target.name + " の「間柄支配」！ " + finalDamage + " ダメージが " + attacker.name + " に反射された！");
    if (attacker.hp === 0) log("☠️ " + attacker.name + " は自滅した！");
  } else {
    if (target.id === "socrates" && target.atk < attacker.atk) {
      finalDamage = Math.floor(finalDamage / 2);
      effText += " (無知の知でダメージ半減！)";
    }

    target.hp = Math.max(0, target.hp - finalDamage);
    log("💥 [" + pName + "] " + attacker.name + " ➔ " + target.name + " に " + finalDamage + " ダメージ！" + effText);
    if (target.hp === 0) log("☠️ " + target.name + " は論破された！");
  }
}

function openModal(cardId) {
  const card = CARD_DATABASE.find(c => c.id === cardId);
  if (!card) return;

  document.getElementById("modal-img").src = card.image;
  document.getElementById("modal-title").innerText = card.name;
  document.getElementById("modal-rank").innerText = "ランク: " + card.rank;
  document.getElementById("modal-type").innerText = "タイプ: " + card.type;
  
  document.getElementById("modal-active-val").innerText = card.activeVal ?? 0;
  document.getElementById("modal-skill-name").innerText = card.skillName;
  document.getElementById("modal-skill-desc").innerText = card.skillDesc;

  document.getElementById("modal-passive-val").innerText = card.passiveVal ?? 0;
  document.getElementById("modal-passive-name").innerText = card.passiveName;
  document.getElementById("modal-passive-desc").innerText = card.passiveDesc;

  document.getElementById("modal-tags").innerText = (card.synergyTags && card.synergyTags.length > 0) ? card.synergyTags.join(", ") : "なし";

  document.getElementById("card-modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("card-modal").style.display = "none";
}
</script>
